<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/devices.css" />
  <link rel="stylesheet" href="shared/device-detail.css" />
  <link rel="stylesheet" href="shared/dashboard.css" />
  <title>Device — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content" style="padding:0;">
        <div id="device-detail-root"></div>
      </div>
    </div>
  </div>

  <!-- Custom widgets tab: same floating palette used on the main dashboard -->
  <button type="button" class="widget-palette-fab hidden" id="widget-palette-fab" aria-label="Add widget" title="Add widget">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
  </button>
  <div class="widget-palette-backdrop" id="widget-palette-backdrop"></div>
  <aside class="widget-palette-drawer" id="widget-palette-drawer">
    <div class="widget-palette-header">
      <div id="widget-palette-header-title"><span class="widget-palette-title">Widget library</span></div>
      <button type="button" class="widget-palette-close" id="widget-palette-close" aria-label="Close" title="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="widget-palette-search" id="widget-palette-search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
      <input type="search" id="widget-palette-search-input" placeholder="Search widgets…" />
    </div>
    <div class="widget-palette-body" id="widget-palette-body"></div>
  </aside>

  <!-- Widget settings modal -->
  <div class="modal-overlay" id="widget-settings-modal">
    <div class="modal-card" style="max-width:560px;">
      <div class="modal-header">
        <h2>Widget settings</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('widget-settings-modal')" aria-label="Close" title="Close">&times;</button>
      </div>
      <div class="modal-body" id="widget-settings-body"></div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('widget-settings-modal')">Cancel</button>
        <button type="submit" form="widget-settings-form" class="modal-button primary">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.49.1/apexcharts.min.js"></script>
  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script src="shared/dashboard.js"></script>
  <script src="shared/device-detail.js"></script>
  <script>
    // The device id travels in the URL hash, not a query string: a hash is
    // never sent to the server, so it can't be dropped by a static-file
    // server that redirects/rewrites clean URLs (e.g. device-detail?id=x ->
    // device-detail, silently losing the query string).
    const deviceId = window.location.hash.slice(1)
    const initialDevice = Store.get().devices.find((d) => d.id === deviceId)
    Layout.mount({
      active: 'devices',
      breadcrumbs: initialDevice
        ? [
            { label: 'Home', href: 'dashboard.html' },
            { label: 'Devices', href: 'devices.html' },
            { label: `Device ${initialDevice.endpointId}`, href: 'device-detail.html#' + initialDevice.id },
            { label: 'Overview' },
          ]
        : [
            { label: 'Home', href: 'dashboard.html' },
            { label: 'Devices', href: 'devices.html' },
          ],
    })
    bootDeviceDetail()
  </script>
</body>
</html>
