<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/backup.css" />
  <title>Settings — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Settings</h1>
            <p class="page-subtitle">Database backup &mdash; back up the workspace, choosing which pages to include</p>
          </div>
        </div>

        <div id="backup-root"></div>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script src="shared/backup.js"></script>
  <script>
    Layout.mount({
      active: 'settings',
      breadcrumbs: [
        { label: 'Home', href: 'dashboard.html' },
        { label: 'Settings' },
        { label: 'Backup' },
      ],
    })

    // Layout.mount() stops early without a session or without permission for this page.
    if (document.querySelector('.sidebar')) Backup.mountPage(document.getElementById('backup-root'))
  </script>
</body>
</html>
