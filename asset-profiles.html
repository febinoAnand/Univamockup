<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/app-runtime.css" />
  <title>Asset profiles — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Asset profiles</h1>
            <p class="page-subtitle">Reusable templates that define shared metadata for an asset type</p>
          </div>
          <div class="page-header-actions">
            <button type="button" class="solid-action-button" id="add-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
              Add asset profile
            </button>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem;">
          <div class="table-search-wrap" style="margin-bottom:0;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
            <input type="text" id="search" placeholder="Search profiles" />
          </div>
          <div id="view-toggle-slot"></div>
        </div>

        <div class="table-scroll" id="table-scroll">
          <table class="data-table">
            <thead><tr>
              <th><button type="button" class="th-sort-button" data-sort="name">Name<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="name"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
              <th><button type="button" class="th-sort-button" data-sort="category">Category<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="category"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
              <th>In use</th>
              <th><button type="button" class="th-sort-button" data-sort="createdDate">Created Date<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="createdDate"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
              <th class="data-table-menu-col"></th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="profile-modal">
    <div class="modal-card" style="max-width:760px;">
      <div class="modal-header">
        <h2 id="modal-title">Add asset profile</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('profile-modal')" aria-label="Close" title="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="profile-form">
          <div class="modal-field"><label for="profile-name">Profile name*</label><input id="profile-name" type="text" required /></div>
          <div class="modal-field">
            <label for="profile-category">Category</label>
            <select id="profile-category">
              <option>Vehicle</option>
              <option>Facility equipment</option>
              <option>Power equipment</option>
              <option>Machinery</option>
              <option>Sensor equipment</option>
            </select>
          </div>
          <div class="modal-field"><label for="profile-description">Description</label><textarea id="profile-description" rows="3"></textarea></div>
          <div class="modal-field">
            <label>Attribute schema</label>
            <p class="rt-help" style="margin-bottom:0.2rem;">Typed configuration every asset of this profile carries (e.g. a target rate or tariff). Each asset stores its own values; applications read them in KPI formulas.</p>
            <div id="attr-fields"></div>
          </div>
          <div class="modal-field"><label>Metadata attributes</label><div class="metadata-fields" id="metadata-fields"></div></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('profile-modal')">Cancel</button>
        <button type="submit" form="profile-form" class="modal-button primary" id="save-btn">Create</button>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    Layout.mount({
      active: 'asset-profiles',
      breadcrumbs: [
        { label: 'Home', href: 'dashboard.html' },
        { label: 'Asset management', href: 'assets.html' },
        { label: 'Asset profiles' },
      ],
    })

    let editingId = null
    let metadataRows = []
    let metadataNextId = 1
    let attrRows = []
    let attrNextId = 1

    function escAttr(value) {
      return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;')
    }

    function renderAttributes() {
      const wrap = document.getElementById('attr-fields')
      wrap.innerHTML = attrRows.map((row) => `
        <div class="dp-row" style="grid-template-columns: 1fr 1.2fr 0.8fr 0.7fr 0.8fr auto;">
          <div class="modal-field"><label>Key*</label><input type="text" data-attr="${row.id}" data-attr-field="key" value="${escAttr(row.key)}" placeholder="e.g. targetPerHour" /></div>
          <div class="modal-field"><label>Label</label><input type="text" data-attr="${row.id}" data-attr-field="label" value="${escAttr(row.label)}" /></div>
          <div class="modal-field"><label>Type</label><select data-attr="${row.id}" data-attr-field="type"><option value="number"${row.type === 'number' ? ' selected' : ''}>Number</option><option value="string"${row.type === 'string' ? ' selected' : ''}>Text</option></select></div>
          <div class="modal-field"><label>Unit</label><input type="text" data-attr="${row.id}" data-attr-field="unit" value="${escAttr(row.unit)}" /></div>
          <div class="modal-field"><label>Default</label><input type="${row.type === 'number' ? 'number' : 'text'}" step="any" data-attr="${row.id}" data-attr-field="default" value="${escAttr(row.default)}" /></div>
          <button type="button" class="dp-remove" data-attr-remove="${row.id}" aria-label="Remove attribute" title="Remove attribute">&times;</button>
        </div>`).join('') + `<button type="button" class="metadata-add" id="attr-add-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
          Add attribute
        </button>`
      document.getElementById('attr-add-btn').addEventListener('click', () => {
        attrRows.push({ id: attrNextId++, key: '', label: '', type: 'number', unit: '', default: '' })
        renderAttributes()
      })
      wrap.querySelectorAll('[data-attr-remove]').forEach((btn) =>
        btn.addEventListener('click', () => {
          attrRows = attrRows.filter((r) => r.id !== Number(btn.getAttribute('data-attr-remove')))
          renderAttributes()
        }),
      )
      wrap.querySelectorAll('[data-attr]').forEach((el) => {
        const row = attrRows.find((r) => r.id === Number(el.getAttribute('data-attr')))
        const field = el.getAttribute('data-attr-field')
        el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
          row[field] = el.value
          if (field === 'type') renderAttributes()
        })
      })
    }

    function attributesFromRows() {
      return attrRows.filter((r) => String(r.key).trim()).map((r) => ({
        key: String(r.key).trim(),
        label: String(r.label).trim() || String(r.key).trim(),
        type: r.type,
        unit: String(r.unit).trim(),
        default: r.type === 'number' ? (r.default === '' ? 0 : Number(r.default)) : String(r.default),
      }))
    }
    let sort = { key: null, direction: 'asc' }

    function compareValues(a, b, direction) {
      const result = String(a).localeCompare(String(b))
      return direction === 'asc' ? result : -result
    }

    document.querySelectorAll('[data-sort]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-sort')
        sort = sort.key === key ? { key, direction: sort.direction === 'asc' ? 'desc' : 'asc' } : { key, direction: 'asc' }
        render()
      })
    })

    function renderMetadata() {
      document.getElementById('metadata-fields').innerHTML = metadataRows
        .map(
          (row) => `
        <div class="metadata-row">
          <button type="button" class="metadata-remove" data-remove="${row.id}" aria-label="Remove attribute" title="Remove attribute">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
          </button>
          <div class="modal-field"><label>Key*</label><input type="text" data-key="${row.id}" value="${UI.esc(row.key)}" /></div>
          <div class="modal-field"><label>Value</label><input type="text" data-value="${row.id}" value="${UI.esc(row.value)}" /></div>
        </div>`,
        )
        .join('') + `<button type="button" class="metadata-add" id="metadata-add-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
          Add
        </button>`
      document.getElementById('metadata-add-btn').addEventListener('click', () => {
        metadataRows.push({ id: metadataNextId++, key: '', value: '' })
        renderMetadata()
      })
      document.querySelectorAll('[data-remove]').forEach((btn) =>
        btn.addEventListener('click', () => {
          metadataRows = metadataRows.filter((r) => r.id !== Number(btn.getAttribute('data-remove')))
          renderMetadata()
        }),
      )
      document.querySelectorAll('[data-key]').forEach((input) =>
        input.addEventListener('input', () => { metadataRows.find((r) => r.id === Number(input.getAttribute('data-key'))).key = input.value }),
      )
      document.querySelectorAll('[data-value]').forEach((input) =>
        input.addEventListener('input', () => { metadataRows.find((r) => r.id === Number(input.getAttribute('data-value'))).value = input.value }),
      )
    }

    function usageCountByProfile() {
      const counts = {}
      Store.get().assets.forEach((a) => { counts[a.profileName] = (counts[a.profileName] ?? 0) + 1 })
      return counts
    }

    function render() {
      const data = Store.get()
      const term = document.getElementById('search').value.trim().toLowerCase()
      let profiles = term ? data.assetProfiles.filter((p) => p.name.toLowerCase().includes(term)) : data.assetProfiles
      if (sort.key) profiles = [...profiles].sort((a, b) => compareValues(a[sort.key], b[sort.key], sort.direction))
      const counts = usageCountByProfile()

      document.querySelectorAll('[data-sort-icon]').forEach((icon) => {
        const key = icon.getAttribute('data-sort-icon')
        icon.classList.toggle('flipped', sort.key === key && sort.direction === 'desc')
      })

      const tbody = document.getElementById('tbody')
      if (profiles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-table-note">No asset profiles match your search.</td></tr>'
        return
      }
      tbody.innerHTML = profiles
        .map(
          (p) => `
        <tr>
          <td class="card-title-cell"><div class="group-name-cell">${UI.esc(p.name)}${p.description ? `<p class="group-description">${UI.esc(p.description)}</p>` : ''}${(p.attributes || []).length ? `<p class="group-description">Attributes: ${(p.attributes || []).map((a) => a.key).join(', ')}</p>` : ''}</div></td>
          <td data-label="Category">${UI.esc(p.category)}</td>
          <td data-label="In use">${counts[p.name] ?? 0}</td>
          <td data-label="Created Date">${p.createdDate}</td>
          <td class="data-table-menu-col">
            <div class="row-menu">
              <button type="button" class="row-menu-button" data-menu-toggle>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
              </button>
              <div class="row-menu-dropdown">
                <button type="button" class="row-menu-item" data-edit="${p.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Edit
                </button>
                <button type="button" class="row-menu-item danger" data-delete="${p.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                  Delete
                </button>
              </div>
            </div>
          </td>
        </tr>`,
        )
        .join('')
      document.querySelectorAll('[data-edit]').forEach((btn) => btn.addEventListener('click', () => openEdit(btn.getAttribute('data-edit'))))
      document.querySelectorAll('[data-delete]').forEach((btn) => btn.addEventListener('click', () => handleRemove(btn.getAttribute('data-delete'))))
      document.querySelectorAll('[data-menu-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const menu = btn.closest('.row-menu')
          const wasOpen = menu.classList.contains('open')
          UI.closeRowMenus()
          if (!wasOpen) UI.openRowMenu(btn)
        }),
      )
    }
    document.addEventListener('click', () => UI.closeRowMenus())

    function openAdd() {
      editingId = null
      metadataRows = []
      metadataNextId = 1
      document.getElementById('modal-title').textContent = 'Add asset profile'
      document.getElementById('save-btn').textContent = 'Create'
      document.getElementById('profile-name').value = ''
      document.getElementById('profile-category').value = 'Vehicle'
      document.getElementById('profile-description').value = ''
      attrRows = []
      attrNextId = 1
      renderAttributes()
      renderMetadata()
      UI.openModal('profile-modal')
    }

    function openEdit(id) {
      const p = Store.get().assetProfiles.find((x) => x.id === id)
      if (!p) return
      editingId = id
      metadataRows = (p.metadata || []).map((f, i) => ({ id: i + 1, key: f.key, value: f.value }))
      metadataNextId = metadataRows.length + 1
      document.getElementById('modal-title').textContent = 'Edit asset profile'
      document.getElementById('save-btn').textContent = 'Save changes'
      document.getElementById('profile-name').value = p.name
      document.getElementById('profile-category').value = p.category
      document.getElementById('profile-description').value = p.description || ''
      attrRows = (p.attributes || []).map((a, i) => ({ id: i + 1, key: a.key, label: a.label || '', type: a.type || 'string', unit: a.unit || '', default: a.default ?? '' }))
      attrNextId = attrRows.length + 1
      renderAttributes()
      renderMetadata()
      UI.openModal('profile-modal')
    }

    function handleRemove(id) {
      const p = Store.get().assetProfiles.find((x) => x.id === id)
      if (!p) return
      const counts = usageCountByProfile()
      if (counts[p.name]) {
        UI.toast(`Reassign assets using "${p.name}" before deleting it.`)
        return
      }
      UI.confirm({
        message: `Delete <strong>${UI.esc(p.name)}</strong>? This can't be undone.`,
        onConfirm: () => {
          Store.removeAssetProfile(id)
          render()
          UI.toast(`"${p.name}" profile deleted successfully!`)
        },
      })
    }

    document.getElementById('view-toggle-slot').innerHTML = UI.viewToggleHtml('asset-profiles')
    UI.wireViewToggle('asset-profiles', document.getElementById('table-scroll'))

    document.getElementById('add-btn').addEventListener('click', openAdd)
    document.getElementById('search').addEventListener('input', render)

    document.getElementById('profile-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const name = document.getElementById('profile-name').value.trim()
      if (!name) return
      const category = document.getElementById('profile-category').value
      const description = document.getElementById('profile-description').value.trim()
      const metadata = metadataRows.filter((r) => r.key.trim()).map((r) => ({ key: r.key.trim(), value: r.value.trim() }))
      const attributes = attributesFromRows()
      if (editingId) {
        Store.updateAssetProfile(editingId, { name, category, description, metadata, attributes })
        UI.toast(`"${name}" profile updated successfully!`)
      } else {
        Store.addAssetProfile({ name, category, description, metadata, attributes })
        UI.toast(`"${name}" profile created successfully!`)
      }
      UI.closeModal('profile-modal')
      render()
    })

    render()
  </script>
</body>
</html>
