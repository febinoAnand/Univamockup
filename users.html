<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <title>Users — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Users</h1>
            <p class="page-subtitle">People with access to this organization</p>
          </div>
          <div class="page-header-actions">
            <button type="button" class="solid-action-button" id="add-user-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
              Add user
            </button>
          </div>
        </div>

        <div class="table-search-wrap">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
          <input type="text" id="user-search" placeholder="Search by name or email" />
        </div>

        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th><button type="button" class="th-sort-button" data-sort="name">Name<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="name"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
                <th>Email</th>
                <th>Role</th>
                <th><button type="button" class="th-sort-button" data-sort="groupNames">Group<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="groupNames"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
                <th>Status</th>
                <th><button type="button" class="th-sort-button" data-sort="createdDate">Created Date<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="createdDate"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
                <th class="data-table-menu-col"></th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit user modal -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="user-modal-title">Add user</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('user-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="user-form">
          <div class="modal-field">
            <label for="user-name">Full name*</label>
            <input id="user-name" type="text" required />
          </div>
          <div class="modal-field">
            <label for="user-email">Email address*</label>
            <input id="user-email" type="email" required />
          </div>
          <div class="modal-field">
            <label for="user-role">Role</label>
            <select id="user-role">
              <option>Owner</option>
              <option>Admin</option>
              <option>Member</option>
            </select>
          </div>
          <div class="modal-field">
            <label>User groups</label>
            <div class="checklist-search-wrap">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
              <input type="text" id="user-groups-search" placeholder="Search user groups" />
            </div>
            <div class="group-checkbox-list" id="user-groups-list"></div>
          </div>
        </form>
      </div>
      <div class="modal-footer" id="user-modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('user-modal')">Cancel</button>
        <button type="submit" form="user-form" class="modal-button secondary" id="add-user-mode-btn" style="display:none;">Add user</button>
        <button type="submit" form="user-form" class="modal-button primary" id="user-save-btn">Send invite</button>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    Layout.mount({
      active: 'users',
      breadcrumbs: [
        { label: 'Home', href: 'dashboard.html' },
        { label: 'User management', href: 'users.html' },
        { label: 'Users' },
      ],
    })

    let editingUserId = null
    let submitMode = 'invite'
    let sort = { key: null, direction: 'asc' }

    function compareValues(a, b, direction) {
      const result = String(a).localeCompare(String(b))
      return direction === 'asc' ? result : -result
    }

    document.querySelectorAll('[data-sort]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-sort')
        sort = sort.key === key ? { key, direction: sort.direction === 'asc' ? 'desc' : 'asc' } : { key, direction: 'asc' }
        renderUsers()
      })
    })

    function renderUsers() {
      const data = Store.get()
      const term = document.getElementById('user-search').value.trim().toLowerCase()
      let users = data.users.filter(
        (u) => !term || u.name.toLowerCase().includes(term) || u.email.toLowerCase().includes(term),
      )
      if (sort.key) {
        users = [...users].sort((a, b) =>
          compareValues(
            sort.key === 'groupNames' ? a.groupNames.join(', ') : a[sort.key],
            sort.key === 'groupNames' ? b.groupNames.join(', ') : b[sort.key],
            sort.direction,
          ),
        )
      }

      document.querySelectorAll('[data-sort-icon]').forEach((icon) => {
        const key = icon.getAttribute('data-sort-icon')
        icon.classList.toggle('flipped', sort.key === key && sort.direction === 'desc')
      })

      const tbody = document.getElementById('users-tbody')
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-table-note">No users match your search.</td></tr>'
        return
      }

      tbody.innerHTML = users
        .map(
          (u) => `
        <tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td>${u.groupNames.join(', ') || '—'}</td>
          <td><span class="status-pill status-${u.status}">${u.status}</span></td>
          <td>${u.createdDate}</td>
          <td class="data-table-menu-col">
            <div class="row-menu">
              <button type="button" class="row-menu-button" data-menu-toggle>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
              </button>
              <div class="row-menu-dropdown">
                ${u.status === 'invited' ? `
                <button type="button" class="row-menu-item" data-resend="${u.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="m4.5 6.5 7.5 6 7.5-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Resend invite
                </button>` : ''}
                <button type="button" class="row-menu-item" data-toggle-status="${u.id}">
                  ${u.status === 'active'
                    ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
                    : '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 5l12 7-12 7V5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
                  ${u.status === 'active' ? 'Suspend' : 'Activate'}
                </button>
                <button type="button" class="row-menu-item" data-edit="${u.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Edit
                </button>
                <button type="button" class="row-menu-item danger" data-delete="${u.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                  Remove
                </button>
              </div>
            </div>
          </td>
        </tr>`,
        )
        .join('')

      tbody.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => openEditModal(btn.getAttribute('data-edit')))
      })
      tbody.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', () => confirmDelete(btn.getAttribute('data-delete')))
      })
      tbody.querySelectorAll('[data-resend]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const user = Store.get().users.find((u) => u.id === btn.getAttribute('data-resend'))
          if (user) UI.toast(`Invite resent to "${user.email}"!`)
        })
      })
      tbody.querySelectorAll('[data-toggle-status]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-toggle-status')
          const user = Store.get().users.find((u) => u.id === id)
          if (!user) return
          const wasActive = user.status === 'active'
          Store.toggleUserStatus(id)
          renderUsers()
          UI.toast(`"${user.name}" ${wasActive ? 'suspended' : 'activated'} successfully!`)
        })
      })
      tbody.querySelectorAll('[data-menu-toggle]').forEach((btn) => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const menu = btn.closest('.row-menu')
          const wasOpen = menu.classList.contains('open')
          UI.closeRowMenus()
          if (!wasOpen) UI.openRowMenu(btn)
        })
      })
    }

    document.addEventListener('click', () => {
      UI.closeRowMenus()
    })

    function filterChecklist(listId, term) {
      const container = document.getElementById(listId)
      if (!container) return
      const t = term.trim().toLowerCase()
      const labels = Array.from(container.querySelectorAll('.modal-checkbox'))
      let visibleCount = 0
      labels.forEach((label) => {
        const match = !t || label.textContent.trim().toLowerCase().includes(t)
        label.style.display = match ? '' : 'none'
        if (match) visibleCount++
      })
      let emptyNote = container.querySelector('.checklist-no-match')
      if (labels.length > 0 && visibleCount === 0) {
        if (!emptyNote) {
          emptyNote = document.createElement('p')
          emptyNote.className = 'section-empty checklist-no-match'
          emptyNote.textContent = 'No matches found.'
          container.appendChild(emptyNote)
        }
      } else if (emptyNote) {
        emptyNote.remove()
      }
    }

    document.getElementById('user-groups-search').addEventListener('input', (e) => filterChecklist('user-groups-list', e.target.value))

    function renderGroupChecklist(selectedNames) {
      const data = Store.get()
      const selected = selectedNames ?? (data.userGroups[0] ? [data.userGroups[0].name] : [])
      document.getElementById('user-groups-list').innerHTML = data.userGroups
        .map(
          (g) => `
        <label class="modal-checkbox">
          <input type="checkbox" data-group-name="${g.name}" ${selected.includes(g.name) ? 'checked' : ''} />
          ${g.name}
        </label>`,
        )
        .join('')
    }

    function selectedGroupNames() {
      return Array.from(document.querySelectorAll('#user-groups-list input[data-group-name]:checked')).map((el) =>
        el.getAttribute('data-group-name'),
      )
    }

    function openAddModal() {
      editingUserId = null
      document.getElementById('user-modal-title').textContent = 'Add user'
      document.getElementById('user-name').value = ''
      document.getElementById('user-email').value = ''
      document.getElementById('user-role').value = 'Admin'
      document.getElementById('add-user-mode-btn').style.display = ''
      document.getElementById('user-save-btn').textContent = 'Send invite'
      document.getElementById('user-groups-search').value = ''
      renderGroupChecklist()
      UI.openModal('user-modal')
    }

    function openEditModal(id) {
      const user = Store.get().users.find((u) => u.id === id)
      if (!user) return
      editingUserId = id
      document.getElementById('user-modal-title').textContent = 'Edit user'
      document.getElementById('user-name').value = user.name
      document.getElementById('user-email').value = user.email
      document.getElementById('user-role').value = user.role
      document.getElementById('add-user-mode-btn').style.display = 'none'
      document.getElementById('user-save-btn').textContent = 'Save changes'
      document.getElementById('user-groups-search').value = ''
      renderGroupChecklist(user.groupNames)
      UI.openModal('user-modal')
    }

    function confirmDelete(id) {
      const user = Store.get().users.find((u) => u.id === id)
      if (!user) return
      UI.confirm({
        title: 'Remove user',
        confirmLabel: 'Remove',
        message: `Remove <strong>${user.name}</strong>? This can't be undone.`,
        onConfirm: () => {
          Store.deleteUser(id)
          renderUsers()
          UI.toast(`"${user.name}" removed successfully!`)
        },
      })
    }

    document.getElementById('add-user-btn').addEventListener('click', openAddModal)
    document.getElementById('user-search').addEventListener('input', renderUsers)
    document.getElementById('add-user-mode-btn').addEventListener('click', () => { submitMode = 'add' })
    document.getElementById('user-save-btn').addEventListener('click', () => { submitMode = 'invite' })

    document.getElementById('user-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const name = document.getElementById('user-name').value.trim()
      const email = document.getElementById('user-email').value.trim()
      const role = document.getElementById('user-role').value
      const groupNames = selectedGroupNames()
      if (!name || !email) return

      if (editingUserId) {
        Store.updateUser(editingUserId, { name, email, role, groupNames })
        UI.toast(`"${name}" updated successfully!`)
      } else {
        Store.addUser({ name, email, role, groupNames, mode: submitMode })
        UI.toast(submitMode === 'add' ? `"${name}" added successfully!` : `Invite sent to "${email}" successfully!`)
      }
      UI.closeModal('user-modal')
      renderUsers()
    })

    renderUsers()
  </script>
</body>
</html>
