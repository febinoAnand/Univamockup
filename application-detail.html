<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/dashboard.css" />
  <title>Application — Univa</title>
  <style>
    .detail-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .detail-card h2 {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0 0 1.1rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .section-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      flex-shrink: 0;
    }
    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.1rem 1rem;
    }
    .detail-meta-item .label {
      margin: 0 0 0.3rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .detail-meta-item .value {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      text-transform: capitalize;
    }
    .detail-overview-card,
    .detail-overview-stats {
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border-color: var(--accent-soft-border);
    }
    .detail-overview-card::before,
    .detail-overview-stats::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
    }
    .count-tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.85rem;
    }
    .count-tile {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.95rem 1rem;
      border-radius: 14px;
      background: var(--tile-bg);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .count-tile:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .count-tile-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--tile-icon-bg);
      color: var(--tile-icon-color);
      flex-shrink: 0;
    }
    .count-tile-value {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
    }
    .count-tile-label {
      margin: 0.15rem 0 0;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-subtle);
    }
    .count-tile-breakdown {
      margin: 0.2rem 0 0;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-faint);
    }
    .detail-tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.85rem;
    }
    .detail-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      aspect-ratio: 1 / 1;
      padding: 1rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    a.detail-tile:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
      border-color: var(--accent-soft-border);
    }
    .detail-tile-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .detail-tile-name {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }
    .detail-tile-sub {
      margin: 0;
      font-size: 0.78rem;
      color: var(--text-subtle);
      word-break: break-word;
    }
    .detail-subheading {
      margin: 0 0 0.75rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-subtle);
    }
    .detail-subheading:not(:first-child) {
      margin-top: 1.5rem;
    }
    .not-found-block {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-subtle);
    }

    .detail-overview-row {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      align-items: stretch;
    }
    .detail-overview-card,
    .detail-overview-stats {
      flex: 1 1 0;
      min-width: 0;
      margin-bottom: 0;
    }
    .detail-meta-item .value.with-icon {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-transform: capitalize;
    }
    .detail-meta-item .value.no-transform {
      text-transform: none;
    }
    @media (max-width: 720px) {
      .detail-overview-row {
        flex-direction: column;
      }
      .detail-overview-card,
      .detail-overview-stats {
        flex: 1 1 auto;
      }
    }

    .detail-tabs {
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin: 0 0 1.25rem;
    }
    .detail-tab-button {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 0.1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-faint);
      cursor: pointer;
    }
    .detail-tab-button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* ------------------------------------------------------- PMS tabs */
    .pms-tabs {
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin: 0 0 1.25rem;
    }
    .pms-tab-button {
      padding: 0.6rem 0.1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-faint);
      cursor: pointer;
    }
    .pms-tab-button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .pms-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .pms-panel-header {
      padding: 0.75rem 1.1rem;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .pms-panel-body {
      padding: 1rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .pms-select,
    .pms-date-input {
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--surface);
    }
    .pms-search-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 37px;
      height: 37px;
      border: none;
      border-radius: 6px;
      background: #2a7ab5;
      color: #ffffff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .pms-search-btn:hover {
      background: #236a9e;
    }
    .pms-table-wrap {
      max-height: 300px;
      overflow-y: auto;
    }
    .pms-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .pms-table th {
      position: sticky;
      top: 0;
      padding: 0.65rem 1.1rem;
      background: #2a7ab5;
      color: #ffffff;
      font-weight: 700;
      text-align: left;
      white-space: nowrap;
    }
    .pms-table td {
      padding: 0.6rem 1.1rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }
    .pms-table tbody tr:nth-child(even) {
      background: var(--surface-alt);
    }
    .pms-table tr.pms-total-row td {
      font-weight: 700;
      color: #2a7ab5;
      border-bottom: none;
    }
    .pms-table td.pms-highlight {
      font-weight: 700;
      color: #2a7ab5;
    }

    /* ------------------------------------------------------------- EMS
       Reuses the page's existing .detail-tabs / .data-table / .table-scroll
       components (same ones the generic tabs above use) — these rules only
       cover the bits those components don't already provide. */
    .ems-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .ems-toolbar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .ems-cell-btn {
      border: none;
      background: none;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      color: var(--accent-strong-text);
      font-weight: 600;
      cursor: pointer;
    }
    .ems-cell-btn:hover {
      background: var(--accent-soft);
    }
    .ems-row-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: none;
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 6px;
    }
    .ems-row-action-btn:hover {
      background: var(--surface-alt);
      color: var(--accent-strong-text);
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content">
        <div id="app-detail-root"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="app-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Edit application</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('app-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="app-form">
          <div class="modal-field"><label for="app-name">Application name*</label><input id="app-name" type="text" required /></div>
          <div class="modal-field"><label for="app-description">Description</label><textarea id="app-description" rows="3"></textarea></div>

          <div class="modal-field">
            <label>Sidebar icon</label>
            <div class="icon-picker" id="app-icon-picker"></div>
          </div>

          <div class="modal-field">
            <label>Devices</label>
            <div class="checklist-search-wrap">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
              <input type="text" id="app-devices-search" placeholder="Search devices" />
            </div>
            <div class="group-checkbox-list" id="app-devices-list"></div>
          </div>

          <div class="modal-field">
            <label>Assets</label>
            <div class="checklist-search-wrap">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
              <input type="text" id="app-assets-search" placeholder="Search assets" />
            </div>
            <div class="group-checkbox-list" id="app-assets-list"></div>
          </div>

          <div class="modal-field">
            <label>Asset groups</label>
            <div class="checklist-search-wrap">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
              <input type="text" id="app-groups-search" placeholder="Search asset groups" />
            </div>
            <div class="group-checkbox-list" id="app-groups-list"></div>
          </div>

          <div class="modal-field"><label>Metadata attributes</label><div class="metadata-fields" id="metadata-fields"></div></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('app-modal')">Cancel</button>
        <button type="submit" form="app-form" class="modal-button primary">Save changes</button>
      </div>
    </div>
  </div>

  <!-- EMS: Add/edit a TOD grid reading -->
  <div class="modal-overlay" id="ems-tod-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="ems-tod-modal-title">Add New Actual Reading</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('ems-tod-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="ems-tod-form">
          <div class="modal-field"><label for="ems-tod-date">Date*</label><input id="ems-tod-date" type="date" required /></div>
          <div class="modal-field"><label for="ems-tod-t1">T1 ()</label><input id="ems-tod-t1" type="number" step="any" /></div>
          <div class="modal-field"><label for="ems-tod-t2">T2 ()</label><input id="ems-tod-t2" type="number" step="any" /></div>
          <div class="modal-field"><label for="ems-tod-t3">T3 ()</label><input id="ems-tod-t3" type="number" step="any" /></div>
          <div class="modal-field"><label for="ems-tod-t4">T4 ()</label><input id="ems-tod-t4" type="number" step="any" /></div>
          <div class="modal-field"><label for="ems-tod-t5">T5 ()</label><input id="ems-tod-t5" type="number" step="any" /></div>
          <div class="modal-field"><label for="ems-tod-total">Total Hours (12AM to 12PM)</label><input id="ems-tod-total" type="number" step="any" /></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('ems-tod-modal')">Cancel</button>
        <button type="submit" form="ems-tod-form" class="modal-button primary" id="ems-tod-save-btn">Add Reading</button>
      </div>
    </div>
  </div>

  <!-- EMS: Update a single T-slot value on a reading -->
  <div class="modal-overlay" id="ems-tod-slot-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="ems-tod-slot-title">Update T1 ()</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('ems-tod-slot-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="ems-tod-slot-form">
          <div class="modal-field"><label for="ems-tod-slot-date">Date:</label><input id="ems-tod-slot-date" type="text" disabled /></div>
          <div class="modal-field"><label for="ems-tod-slot-value" id="ems-tod-slot-value-label">Value:</label><input id="ems-tod-slot-value" type="number" step="any" /></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('ems-tod-slot-modal')">Cancel</button>
        <button type="submit" form="ems-tod-slot-form" class="modal-button primary">Update</button>
      </div>
    </div>
  </div>

  <!-- EMS: Add/edit a meter -->
  <div class="modal-overlay" id="ems-meter-modal">
    <div class="modal-card" style="max-width:680px;">
      <div class="modal-header">
        <h2 id="ems-meter-modal-title">Add New Meter</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('ems-meter-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="ems-meter-form">
          <div class="modal-field-grid">
            <div class="modal-field"><label for="ems-meter-name">Meter Name*</label><input id="ems-meter-name" type="text" placeholder="Enter Meter Name" required /></div>
            <div class="modal-field">
              <label for="ems-meter-model">Meter Model</label>
              <select id="ems-meter-model">
                <option value="">Select Meter Model</option>
                <option>ElMeasure</option>
                <option>Schneider</option>
                <option>L&amp;T</option>
                <option>Secure</option>
              </select>
            </div>
            <div class="modal-field"><label for="ems-meter-id">Meter ID*</label><input id="ems-meter-id" type="text" placeholder="Enter Meter ID" required /></div>
            <div class="modal-field"><label for="ems-meter-model-number">Model Number</label><input id="ems-meter-model-number" type="text" placeholder="Enter Model Number" /></div>
            <div class="modal-field"><label for="ems-meter-location">Meter Location</label><input id="ems-meter-location" type="text" placeholder="Enter Meter Location" /></div>
            <div class="modal-field">
              <label for="ems-meter-unit">Unit select</label>
              <select id="ems-meter-unit">
                <option value="">Select Unit</option>
                <option>Peak Timing</option>
                <option>Off Peak</option>
                <option>Normal</option>
              </select>
            </div>
            <div class="modal-field"><label for="ems-meter-part-number">Part Number</label><input id="ems-meter-part-number" type="text" placeholder="Enter Part Number" /></div>
            <div class="modal-field"><label for="ems-meter-vpn-min">Vpn min</label><input id="ems-meter-vpn-min" type="number" step="any" placeholder="Enter Vpn min" /></div>
            <div class="modal-field"><label for="ems-meter-vpn-max">Vpn max</label><input id="ems-meter-vpn-max" type="number" step="any" placeholder="Enter Vpn max" /></div>
            <div class="modal-field"><label for="ems-meter-vpp-min">Vpp min</label><input id="ems-meter-vpp-min" type="number" step="any" placeholder="Enter Vpp min" /></div>
            <div class="modal-field"><label for="ems-meter-vpp-max">Vpp max</label><input id="ems-meter-vpp-max" type="number" step="any" placeholder="Enter Vpp max" /></div>
            <div class="modal-field"><label for="ems-meter-i-min">I min</label><input id="ems-meter-i-min" type="number" step="any" placeholder="Enter I min" /></div>
            <div class="modal-field"><label for="ems-meter-i-max">I max</label><input id="ems-meter-i-max" type="number" step="any" placeholder="Enter I max" /></div>
            <div class="modal-field"><label for="ems-meter-kw-min">Kw min</label><input id="ems-meter-kw-min" type="number" step="any" placeholder="Enter Kw min" /></div>
            <div class="modal-field"><label for="ems-meter-kw-max">Kw max</label><input id="ems-meter-kw-max" type="number" step="any" placeholder="Enter Kw max" /></div>
            <div class="modal-field"><label for="ems-meter-kva-min">Kva min</label><input id="ems-meter-kva-min" type="number" step="any" placeholder="Enter Kva min" /></div>
            <div class="modal-field"><label for="ems-meter-kva-max">Kva max</label><input id="ems-meter-kva-max" type="number" step="any" placeholder="Enter Kva max" /></div>
            <div class="modal-field"><label for="ems-meter-freq-min">Freq min</label><input id="ems-meter-freq-min" type="number" step="any" placeholder="Enter Freq min" /></div>
            <div class="modal-field"><label for="ems-meter-freq-max">Freq max</label><input id="ems-meter-freq-max" type="number" step="any" placeholder="Enter Freq max" /></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('ems-meter-modal')">Cancel</button>
        <button type="submit" form="ems-meter-form" class="modal-button primary" id="ems-meter-save-btn">Add Meter</button>
      </div>
    </div>
  </div>

  <!-- EMS: Add/edit energy data -->
  <div class="modal-overlay" id="ems-energy-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="ems-energy-modal-title">Add Energy Data</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('ems-energy-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="ems-energy-form">
          <div class="modal-field-grid">
            <div class="modal-field">
              <label for="ems-energy-year">Year*</label>
              <select id="ems-energy-year" required></select>
            </div>
            <div class="modal-field">
              <label for="ems-energy-month">Month*</label>
              <select id="ems-energy-month" required>
                <option value="">Select Month</option>
                <option>January</option><option>February</option><option>March</option><option>April</option>
                <option>May</option><option>June</option><option>July</option><option>August</option>
                <option>September</option><option>October</option><option>November</option><option>December</option>
              </select>
            </div>
            <div class="modal-field"><label for="ems-energy-renewable">Renewable Units*</label><input id="ems-energy-renewable" type="number" step="any" required /></div>
            <div class="modal-field"><label for="ems-energy-non-renewable">Non-Renewable Units*</label><input id="ems-energy-non-renewable" type="number" step="any" required /></div>
            <div class="modal-field"><label for="ems-energy-renewable-pct">Renewable Percentage*</label><input id="ems-energy-renewable-pct" type="number" step="any" required /></div>
            <div class="modal-field"><label for="ems-energy-non-renewable-pct">Non-Renewable Percentage*</label><input id="ems-energy-non-renewable-pct" type="number" step="any" required /></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('ems-energy-modal')">Cancel</button>
        <button type="submit" form="ems-energy-form" class="modal-button primary" id="ems-energy-save-btn">Add Energy</button>
      </div>
    </div>
  </div>

  <!-- Custom widgets tab (generic apps only): same floating palette used on the main dashboard -->
  <button type="button" class="widget-palette-fab hidden" id="widget-palette-fab" aria-label="Add widget">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
  </button>
  <div class="widget-palette-backdrop" id="widget-palette-backdrop"></div>
  <aside class="widget-palette-drawer" id="widget-palette-drawer">
    <div class="widget-palette-header">
      <div id="widget-palette-header-title"><span class="widget-palette-title">Widget library</span></div>
      <button type="button" class="widget-palette-close" id="widget-palette-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="widget-palette-search" id="widget-palette-search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
      <input type="search" id="widget-palette-search-input" placeholder="Search widgets…" />
    </div>
    <div class="widget-palette-body" id="widget-palette-body"></div>
  </aside>

  <!-- Widget settings modal -->
  <div class="modal-overlay" id="widget-settings-modal">
    <div class="modal-card" style="max-width:560px;">
      <div class="modal-header">
        <h2>Widget settings</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('widget-settings-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="widget-settings-body"></div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('widget-settings-modal')">Cancel</button>
        <button type="submit" form="widget-settings-form" class="modal-button primary">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.49.1/apexcharts.min.js"></script>
  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script src="shared/dashboard.js"></script>
  <script>
    // The application id travels in the URL hash — see device-detail.html
    // for why (a hash survives a static-file server in a way a query string
    // used with clean-URL rewriting might not). Unlike device-detail.html,
    // this page is also linked to from itself (every other application's
    // sidebar entry points here too), so a click only changes the hash on
    // an already-loaded document — the browser treats that as a
    // same-document navigation and never reloads. 'hashchange' below is
    // what makes clicking from one application to another actually update
    // the page instead of requiring a manual refresh.
    // The hash can also carry an EMS sub-tab after a colon (e.g.
    // "app_ems:meters"), so a link back from a meter's own dashboard page
    // lands on the Meter List tab instead of always resetting to TOD Grid.
    const initialHashParts = window.location.hash.slice(1).split(':')
    let applicationId = initialHashParts[0]
    let pendingEmsTab = initialHashParts[1] || null

    function getApp() {
      return Store.get().applications.find((a) => a.id === applicationId)
    }

    function breadcrumbsForApp(app) {
      return app
        ? [
            { label: 'Home', href: 'dashboard.html' },
            { label: 'Applications', href: 'applications.html' },
            { label: app.name },
          ]
        : [
            { label: 'Home', href: 'dashboard.html' },
            { label: 'Applications', href: 'applications.html' },
          ]
    }

    const initialApp = getApp()
    Layout.mount({
      active: initialApp ? `application-${initialApp.id}` : 'applications',
      breadcrumbs: breadcrumbsForApp(initialApp),
    })

    window.addEventListener('hashchange', () => {
      const hashParts = window.location.hash.slice(1).split(':')
      applicationId = hashParts[0]
      if (hashParts[1] && EMS_TABS.some((t) => t.key === hashParts[1])) emsActiveTab = hashParts[1]
      const app = getApp()
      Layout.setBreadcrumbs(breadcrumbsForApp(app))
      Layout.setActive(app ? `application-${app.id}` : 'applications')
      renderPage()
    })

    let metadataRows = []
    let metadataNextId = 1
    let selectedIcon = 'app'

    function renderIconPicker() {
      document.getElementById('app-icon-picker').innerHTML = APPLICATION_ICON_OPTIONS.map(
        (key) => `<button type="button" class="icon-picker-option${key === selectedIcon ? ' selected' : ''}" data-icon="${key}" aria-label="${key} icon">${iconSvg(key)}</button>`,
      ).join('')
      document.querySelectorAll('#app-icon-picker [data-icon]').forEach((btn) =>
        btn.addEventListener('click', () => {
          selectedIcon = btn.getAttribute('data-icon')
          renderIconPicker()
        }),
      )
    }

    function renderMetadataEditor() {
      document.getElementById('metadata-fields').innerHTML = metadataRows
        .map(
          (row) => `
        <div class="metadata-row">
          <button type="button" class="metadata-remove" data-remove="${row.id}" aria-label="Remove attribute">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
          </button>
          <div class="modal-field"><label>Key*</label><input type="text" data-key="${row.id}" value="${row.key}" /></div>
          <div class="modal-field"><label>Value</label><input type="text" data-value="${row.id}" value="${row.value}" /></div>
        </div>`,
        )
        .join('') + `<button type="button" class="metadata-add" id="metadata-add-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
          Add
        </button>`
      document.getElementById('metadata-add-btn').addEventListener('click', () => {
        metadataRows.push({ id: metadataNextId++, key: '', value: '' })
        renderMetadataEditor()
      })
      document.querySelectorAll('[data-remove]').forEach((btn) =>
        btn.addEventListener('click', () => {
          metadataRows = metadataRows.filter((r) => r.id !== Number(btn.getAttribute('data-remove')))
          renderMetadataEditor()
        }),
      )
      document.querySelectorAll('[data-key]').forEach((input) =>
        input.addEventListener('input', () => { metadataRows.find((r) => r.id === Number(input.getAttribute('data-key'))).key = input.value }),
      )
      document.querySelectorAll('[data-value]').forEach((input) =>
        input.addEventListener('input', () => { metadataRows.find((r) => r.id === Number(input.getAttribute('data-value'))).value = input.value }),
      )
    }

    function filterChecklist(listId, term) {
      const container = document.getElementById(listId)
      if (!container) return
      const t = term.trim().toLowerCase()
      const labels = Array.from(container.querySelectorAll('.modal-checkbox'))
      let visibleCount = 0
      labels.forEach((label) => {
        const match = !t || label.textContent.trim().toLowerCase().includes(t)
        label.style.display = match ? '' : 'none'
        if (match) visibleCount++
      })
      let emptyNote = container.querySelector('.checklist-no-match')
      if (labels.length > 0 && visibleCount === 0) {
        if (!emptyNote) {
          emptyNote = document.createElement('p')
          emptyNote.className = 'section-empty checklist-no-match'
          emptyNote.textContent = 'No matches found.'
          container.appendChild(emptyNote)
        }
      } else if (emptyNote) {
        emptyNote.remove()
      }
    }

    document.getElementById('app-devices-search').addEventListener('input', (e) => filterChecklist('app-devices-list', e.target.value))
    document.getElementById('app-assets-search').addEventListener('input', (e) => filterChecklist('app-assets-list', e.target.value))
    document.getElementById('app-groups-search').addEventListener('input', (e) => filterChecklist('app-groups-list', e.target.value))

    function renderDevicesChecklist(selectedIds) {
      const data = Store.get()
      document.getElementById('app-devices-list').innerHTML =
        data.devices.length === 0
          ? '<span class="section-empty">No devices available</span>'
          : data.devices.map((d) => `<label class="modal-checkbox"><input type="checkbox" data-device="${d.id}" ${selectedIds.includes(d.id) ? 'checked' : ''}/> ${d.name}</label>`).join('')
    }

    function renderAssetsChecklist(selectedIds) {
      const data = Store.get()
      document.getElementById('app-assets-list').innerHTML =
        data.assets.length === 0
          ? '<span class="section-empty">No assets available</span>'
          : data.assets.map((a) => `<label class="modal-checkbox"><input type="checkbox" data-asset="${a.id}" ${selectedIds.includes(a.id) ? 'checked' : ''}/> ${a.name}</label>`).join('')
    }

    function renderGroupsChecklist(selectedNames) {
      const data = Store.get()
      document.getElementById('app-groups-list').innerHTML =
        data.assetGroups.length === 0
          ? '<span class="section-empty">No asset groups available</span>'
          : data.assetGroups.map((g) => `<label class="modal-checkbox"><input type="checkbox" data-group="${g.name}" ${selectedNames.includes(g.name) ? 'checked' : ''}/> ${g.name}</label>`).join('')
    }

    function openEdit() {
      const app = getApp()
      if (!app) return
      metadataRows = (app.metadata || []).map((f, i) => ({ id: i + 1, key: f.key, value: f.value }))
      metadataNextId = metadataRows.length + 1
      selectedIcon = app.icon || 'app'
      document.getElementById('app-name').value = app.name
      document.getElementById('app-description').value = app.description || ''
      document.getElementById('app-devices-search').value = ''
      document.getElementById('app-assets-search').value = ''
      document.getElementById('app-groups-search').value = ''
      renderIconPicker()
      renderDevicesChecklist(app.deviceIds || [])
      renderAssetsChecklist(app.assetIds || [])
      renderGroupsChecklist(app.groupNames || [])
      renderMetadataEditor()
      UI.openModal('app-modal')
    }

    document.getElementById('app-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const app = getApp()
      if (!app) return
      const name = document.getElementById('app-name').value.trim()
      if (!name) return
      const description = document.getElementById('app-description').value.trim()
      const deviceIds = Array.from(document.querySelectorAll('#app-devices-list input:checked')).map((el) => el.getAttribute('data-device'))
      const assetIds = Array.from(document.querySelectorAll('#app-assets-list input:checked')).map((el) => el.getAttribute('data-asset'))
      const groupNames = Array.from(document.querySelectorAll('#app-groups-list input:checked')).map((el) => el.getAttribute('data-group'))
      const metadata = metadataRows.filter((r) => r.key.trim()).map((r) => ({ key: r.key.trim(), value: r.value.trim() }))
      Store.updateApplication(app.id, { name, description, deviceIds, assetIds, groupNames, metadata, icon: selectedIcon })
      UI.toast(`"${name}" updated successfully!`)
      UI.closeModal('app-modal')
      renderPage()
      Layout.setActive(`application-${app.id}`)
    })

    function confirmDelete() {
      const app = getApp()
      if (!app) return
      UI.confirm({
        message: `Delete <strong>${app.name}</strong>? This can't be undone.`,
        onConfirm: () => {
          Store.removeApplication(app.id)
          UI.toast(`"${app.name}" deleted successfully!`)
          window.location.href = 'applications.html'
        },
      })
    }

    function renderGenericBody(app, devices, assets) {
      const groupNames = app.groupNames || []
      const metadata = app.metadata || []
      const onlineDevices = devices.filter((d) => d.state === 'online').length
      const offlineDevices = devices.length - onlineDevices
      const operationalAssets = assets.filter((a) => a.status === 'operational').length
      const offlineAssets = assets.filter((a) => a.status === 'offline').length
      const countTiles = [
        { label: 'Linked devices', value: devices.length, icon: 'device', bg: 'var(--accent-soft)', iconBg: 'var(--accent-soft-strong)', iconColor: 'var(--accent)', breakdown: `${onlineDevices} online · ${offlineDevices} offline` },
        { label: 'Linked assets', value: assets.length, icon: 'asset', bg: 'var(--success-bg)', iconBg: '#bbf7d0', iconColor: 'var(--success-dark)', breakdown: `${operationalAssets} operational · ${offlineAssets} offline` },
        { label: 'Asset groups', value: groupNames.length, icon: 'group', bg: 'var(--warning-bg)', iconBg: '#fde68a', iconColor: 'var(--warning)' },
        { label: 'Activity', value: metadata.length, icon: 'report', bg: '#e0f2fe', iconBg: '#bae6fd', iconColor: '#0369a1' },
      ]

      return `
        <div class="detail-overview-row">
          <div class="detail-card detail-overview-card">
            <h2><span class="section-icon">${iconSvg('profile')}</span>Overview</h2>
            <div class="detail-meta-grid">
              <div class="detail-meta-item"><p class="label">Status</p><p class="value"><span class="status-pill status-${app.status}">${app.status}</span></p></div>
              <div class="detail-meta-item"><p class="label">Created date</p><p class="value">${app.createdDate}</p></div>
              <div class="detail-meta-item"><p class="label">Application ID</p><p class="value no-transform">${app.id}</p></div>
              <div class="detail-meta-item"><p class="label">Sidebar icon</p><p class="value with-icon">${iconSvg(app.icon || 'app')}${app.icon || 'app'}</p></div>
              <div class="detail-meta-item"><p class="label">Default application</p><p class="value">${app.isDefault ? 'Yes' : 'No'}</p></div>
              <div class="detail-meta-item"><p class="label">Description</p><p class="value no-transform">${app.description || '—'}</p></div>
            </div>
          </div>
          <div class="detail-card detail-overview-stats">
            <h2><span class="section-icon">${iconSvg('report')}</span>Count</h2>
            <div class="count-tile-grid">
              ${countTiles
                .map(
                  (t) => `
              <div class="count-tile" style="--tile-bg: ${t.bg}; --tile-icon-bg: ${t.iconBg}; --tile-icon-color: ${t.iconColor};">
                <span class="count-tile-icon">${iconSvg(t.icon)}</span>
                <span>
                  <p class="count-tile-value">${t.value}</p>
                  <p class="count-tile-label">${t.label}</p>
                  ${t.breakdown ? `<p class="count-tile-breakdown">${t.breakdown}</p>` : ''}
                </span>
              </div>`,
                )
                .join('')}
            </div>
          </div>
        </div>

        <div class="detail-tabs">
          ${GENERIC_TABS.map(
            (t) => `<button type="button" class="detail-tab-button${genericActiveTab === t.key ? ' active' : ''}" data-generic-tab="${t.key}">${iconSvg(t.icon)}${t.label}</button>`,
          ).join('')}
        </div>
        <div class="detail-card">
          ${renderGenericTabPanel(genericActiveTab, app, devices, assets, groupNames, metadata)}
        </div>`
    }

    const GENERIC_TABS = [
      { key: 'metadata', label: 'Metadata attributes', icon: 'credentials' },
      { key: 'assets', label: 'Assets', icon: 'asset' },
      { key: 'groups', label: 'Groups', icon: 'group' },
      { key: 'devices', label: 'Linked devices', icon: 'device' },
      { key: 'widgets', label: 'Custom widgets', icon: 'dashboard' },
    ]
    let genericActiveTab = 'devices'

    function renderGenericTabPanel(tab, app, devices, assets, groupNames, metadata) {
      if (tab === 'widgets') {
        return `
          <div class="dashboard-page" style="padding:0;">
            <div class="dashboard-toolbar" id="dashboard-toolbar"></div>
            <div class="dashboard-canvas" id="dashboard-canvas"></div>
          </div>`
      }
      if (tab === 'devices') {
        return devices.length === 0
          ? '<span class="section-empty">No devices linked to this application</span>'
          : `<div class="detail-tile-grid">${devices
              .map(
                (d) => `
              <a class="detail-tile" href="device-detail.html#${d.id}">
                <span class="detail-tile-icon">${iconSvg('device')}</span>
                <p class="detail-tile-name">${d.name}</p>
                <span class="status-pill status-${d.state === 'online' ? 'active' : 'offline'}">${d.state}</span>
              </a>`,
              )
              .join('')}</div>`
      }
      if (tab === 'assets') {
        return assets.length === 0
          ? '<span class="section-empty">No assets linked to this application</span>'
          : `<div class="detail-tile-grid">${assets
              .map(
                (a) => `
              <a class="detail-tile" href="asset-detail.html#${a.id}">
                <span class="detail-tile-icon">${iconSvg('asset')}</span>
                <p class="detail-tile-name">${a.name}</p>
                <span class="status-pill status-${a.status}">${a.status}</span>
              </a>`,
              )
              .join('')}</div>`
      }
      if (tab === 'groups') {
        if (groupNames.length === 0) return '<span class="section-empty">No asset groups linked to this application</span>'
        const allAssets = Store.get().assets
        return groupNames
          .map((name) => {
            const groupAssets = allAssets.filter((a) => (a.groupNames || []).includes(name))
            return `
          <h3 class="detail-subheading">${name}</h3>
          ${groupAssets.length === 0
            ? '<span class="section-empty">No assets in this group</span>'
            : `<div class="detail-tile-grid">${groupAssets
                .map(
                  (a) => `
              <a class="detail-tile" href="asset-detail.html#${a.id}">
                <span class="detail-tile-icon">${iconSvg('asset')}</span>
                <p class="detail-tile-name">${a.name}</p>
                <span class="status-pill status-${a.status}">${a.status}</span>
              </a>`,
                )
                .join('')}</div>`}`
          })
          .join('')
      }
      return metadata.length === 0
        ? '<span class="section-empty">No metadata attributes</span>'
        : `<div class="detail-tile-grid">${metadata
            .map(
              (m) => `
              <div class="detail-tile">
                <p class="detail-tile-name">${m.key}</p>
                <p class="detail-tile-sub">${m.value}</p>
              </div>`,
            )
            .join('')}</div>`
    }

    function wireGenericBody() {
      document.querySelectorAll('[data-generic-tab]').forEach((btn) =>
        btn.addEventListener('click', () => {
          genericActiveTab = btn.getAttribute('data-generic-tab')
          renderPage()
        }),
      )
      if (genericActiveTab === 'widgets') {
        const app = getApp()
        bootDashboard({ scopeId: 'app-' + app.id, title: app.name + ' — Custom widgets', emptyDefault: true })
      }
    }

    // ------------------------------------------------------------- PMS
    // PMS is the built-in production-monitoring application: its detail
    // page shows the real system's Production / Shift Report views instead
    // of the generic device/asset/metadata summary every other application
    // gets. There's no backend here, so the tables always show zero counts
    // — the date/machine filters and search buttons just re-render the tab.
    const PMS_WORK_CENTERS = ['HSGMI3', 'HSGMI4', 'HSGMI5', 'HSGMI6', 'HSGMI7', 'HSGMI1', 'HSGMI2', 'HSGMI8']
    const PMS_SHIFT_SLOTS = {
      'Shift 1': ['06:30 AM - 07:30 AM', '07:30 AM - 08:30 AM', '08:30 AM - 09:30 AM', '09:30 AM - 10:30 AM', '10:30 AM - 11:30 AM', '11:30 AM - 12:30 PM', '12:30 PM - 01:30 PM', '01:30 PM - 02:30 PM'],
      'Shift 2': ['02:30 PM - 03:30 PM', '03:30 PM - 04:30 PM', '04:30 PM - 05:30 PM', '05:30 PM - 06:30 PM', '06:30 PM - 07:30 PM', '07:30 PM - 08:30 PM', '08:30 PM - 09:30 PM', '09:30 PM - 10:30 PM'],
      'Shift 3': ['10:30 PM - 11:30 PM', '11:30 PM - 12:30 AM', '12:30 AM - 01:30 AM', '01:30 AM - 02:30 AM', '02:30 AM - 03:30 AM', '03:30 AM - 04:30 AM', '04:30 AM - 05:30 AM', '05:30 AM - 06:30 AM'],
    }
    let pmsActiveTab = 'production'

    function todayIso() {
      return new Date().toISOString().slice(0, 10)
    }

    function pmsSearchIcon() {
      return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>'
    }

    function renderPmsProductionPanel() {
      const rows = PMS_WORK_CENTERS.map((wc) => `<tr><td>${wc}</td><td>0</td><td>0</td><td>0</td><td class="pms-highlight">0</td></tr>`).join('')
      return `
        <div class="pms-panel">
          <div class="pms-panel-header">Production</div>
          <div class="pms-panel-body">
            <input type="date" class="pms-date-input" id="pms-production-date" value="${todayIso()}" />
            <button type="button" class="pms-search-btn" id="pms-production-search" aria-label="Search">${pmsSearchIcon()}</button>
          </div>
        </div>
        <div class="pms-panel">
          <div class="pms-panel-header">HSGMI</div>
          <div class="pms-table-wrap">
            <table class="pms-table">
              <thead><tr><th>WORK CENTER</th><th>Shift 1</th><th>Shift 2</th><th>Shift 3</th><th>Total</th></tr></thead>
              <tbody>
                ${rows}
                <tr class="pms-total-row"><td>Total</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
              </tbody>
            </table>
          </div>
        </div>`
    }

    function renderPmsShiftPanel() {
      const shiftTables = Object.entries(PMS_SHIFT_SLOTS)
        .map(
          ([shiftName, slots]) => `
        <div class="pms-panel">
          <div class="pms-panel-header">${shiftName}</div>
          <div class="pms-table-wrap">
            <table class="pms-table">
              <thead><tr><th>Time</th><th>Production Count</th><th>Target Count</th><th>Differences</th></tr></thead>
              <tbody>
                ${slots.map((slot) => `<tr><td>${slot}</td><td>0</td><td>0</td><td class="pms-highlight">0</td></tr>`).join('')}
                <tr class="pms-total-row"><td>Total</td><td>0</td><td>0</td><td>0</td></tr>
              </tbody>
            </table>
          </div>
        </div>`,
        )
        .join('')

      return `
        <div class="pms-panel">
          <div class="pms-panel-header">Shift Report</div>
          <div class="pms-panel-body">
            <select class="pms-select" id="pms-shift-machine">
              <option value="">Select Machine</option>
              ${PMS_WORK_CENTERS.map((wc) => `<option value="${wc}">${wc}</option>`).join('')}
            </select>
            <input type="date" class="pms-date-input" id="pms-shift-date" value="${todayIso()}" />
            <button type="button" class="pms-search-btn" id="pms-shift-search" aria-label="Search">${pmsSearchIcon()}</button>
          </div>
        </div>
        ${shiftTables}`
    }

    function renderPmsBody() {
      return `
        <div class="pms-tabs">
          <button type="button" class="pms-tab-button${pmsActiveTab === 'production' ? ' active' : ''}" data-pms-tab="production">Production</button>
          <button type="button" class="pms-tab-button${pmsActiveTab === 'shift-report' ? ' active' : ''}" data-pms-tab="shift-report">Shift Report</button>
        </div>
        <div id="pms-tab-content">
          ${pmsActiveTab === 'production' ? renderPmsProductionPanel() : renderPmsShiftPanel()}
        </div>`
    }

    function wirePmsBody() {
      document.querySelectorAll('[data-pms-tab]').forEach((btn) =>
        btn.addEventListener('click', () => {
          pmsActiveTab = btn.getAttribute('data-pms-tab')
          renderPage()
        }),
      )
      document.getElementById('pms-production-search')?.addEventListener('click', () => renderPage())
      document.getElementById('pms-shift-search')?.addEventListener('click', () => renderPage())
    }

    // ------------------------------------------------------------- EMS
    // EMS is the other built-in system application (alongside PMS above):
    // its detail page shows TOD grid readings, a meter list, and monthly
    // energy data instead of the generic device/asset/metadata summary.
    const EMS_PER_PAGE = 10
    const EMS_TOD_SLOTS = ['t1', 't2', 't3', 't4', 't5']

    const EMS_TABS = [
      { key: 'meters', label: 'Meter List' },
      { key: 'todgrid', label: 'TOD Grid' },
      { key: 'energy', label: 'Energy Data' },
    ]
    const EMS_METER_FIELD_IDS = {
      name: 'ems-meter-name',
      meterId: 'ems-meter-id',
      location: 'ems-meter-location',
      partNumber: 'ems-meter-part-number',
      model: 'ems-meter-model',
      modelNumber: 'ems-meter-model-number',
      unit: 'ems-meter-unit',
      vpnMin: 'ems-meter-vpn-min',
      vpnMax: 'ems-meter-vpn-max',
      vppMin: 'ems-meter-vpp-min',
      vppMax: 'ems-meter-vpp-max',
      iMin: 'ems-meter-i-min',
      iMax: 'ems-meter-i-max',
      kwMin: 'ems-meter-kw-min',
      kwMax: 'ems-meter-kw-max',
      kvaMin: 'ems-meter-kva-min',
      kvaMax: 'ems-meter-kva-max',
      freqMin: 'ems-meter-freq-min',
      freqMax: 'ems-meter-freq-max',
    }
    const EMS_METER_NUMERIC_FIELDS = ['vpnMin', 'vpnMax', 'vppMin', 'vppMax', 'iMin', 'iMax', 'kwMin', 'kwMax', 'kvaMin', 'kvaMax', 'freqMin', 'freqMax']

    let emsActiveTab = EMS_TABS.some((t) => t.key === pendingEmsTab) ? pendingEmsTab : 'todgrid'
    let emsTodPage = 1
    let emsTodSearch = ''
    let emsMeterPage = 1
    let emsMeterSearch = ''
    let emsMeterSelected = new Set()
    let emsEnergyPage = 1
    let emsEnergySearch = ''
    let emsEnergySelected = new Set()

    function emsSearchIcon() {
      return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>'
    }
    function emsAddIcon() {
      return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>'
    }
    function emsDeleteIcon() {
      return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>'
    }
    function emsEditIcon() {
      return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    }
    function emsViewIcon() {
      return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>'
    }

    function emsPaginate(rows, page, perPage) {
      const totalPages = Math.max(1, Math.ceil(rows.length / perPage))
      const clampedPage = Math.min(Math.max(1, page), totalPages)
      const start = (clampedPage - 1) * perPage
      return { pageRows: rows.slice(start, start + perPage), totalPages, page: clampedPage }
    }

    function emsPaginationHtml(page, totalPages, prefix) {
      const pages = Array.from({ length: totalPages }, (_, i) => i + 1)
      return `
        <div class="pagination">
          <button type="button" class="page-btn" data-ems-page="${prefix}:${page - 1}" ${page <= 1 ? 'disabled' : ''}>Previous</button>
          ${pages.map((p) => `<button type="button" class="page-btn${p === page ? ' active' : ''}" data-ems-page="${prefix}:${p}">${p}</button>`).join('')}
          <button type="button" class="page-btn" data-ems-page="${prefix}:${page + 1}" ${page >= totalPages ? 'disabled' : ''}>Next</button>
        </div>`
    }

    // --------------------------------------------------------- EMS: TOD grid
    function renderEmsTodGridPanel() {
      const term = emsTodSearch.trim().toLowerCase()
      const all = Store.get().emsTodReadings.slice().sort((a, b) => (a.date < b.date ? 1 : -1))
      const filtered = term ? all.filter((r) => r.date.toLowerCase().includes(term)) : all
      const { pageRows, totalPages, page } = emsPaginate(filtered, emsTodPage, EMS_PER_PAGE)
      emsTodPage = page
      const rowsHtml =
        pageRows.length === 0
          ? '<tr><td colspan="8" class="empty-table-note">No readings match your search.</td></tr>'
          : pageRows
              .map(
                (r, i) => `
        <tr>
          <td>${(page - 1) * EMS_PER_PAGE + i + 1}</td>
          <td>${r.date}</td>
          ${EMS_TOD_SLOTS.map((slot) => `<td><button type="button" class="ems-cell-btn" data-ems-slot="${r.id}:${slot}">${r[slot]}</button></td>`).join('')}
          <td>${r.totalHours}</td>
        </tr>`,
              )
              .join('')
      return `
        <div class="ems-toolbar">
          <div class="table-search-wrap" style="margin-bottom:0;">${emsSearchIcon()}<input type="text" id="ems-tod-search" placeholder="Search by date" value="${emsTodSearch}" /></div>
          <div class="ems-toolbar-actions">
            <button type="button" class="solid-action-button" id="ems-tod-add-btn">${emsAddIcon()}Add</button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>S.No</th><th>Date</th><th>T1 ()</th><th>T2 ()</th><th>T3 ()</th><th>T4 ()</th><th>T5 ()</th><th>Total Hours (12AM to 12PM)</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        ${emsPaginationHtml(page, totalPages, 'todgrid')}`
    }

    function emsOpenTodAdd() {
      document.getElementById('ems-tod-modal-title').textContent = 'Add New Actual Reading'
      document.getElementById('ems-tod-save-btn').textContent = 'Add Reading'
      document.getElementById('ems-tod-form').dataset.editingId = ''
      document.getElementById('ems-tod-date').value = ''
      EMS_TOD_SLOTS.forEach((slot) => {
        document.getElementById('ems-tod-' + slot).value = ''
      })
      document.getElementById('ems-tod-total').value = ''
      UI.openModal('ems-tod-modal')
    }

    function emsOpenTodSlot(readingId, slot) {
      const reading = Store.get().emsTodReadings.find((r) => r.id === readingId)
      if (!reading) return
      const label = slot.toUpperCase() + ' ()'
      document.getElementById('ems-tod-slot-title').textContent = 'Update ' + label
      document.getElementById('ems-tod-slot-value-label').textContent = label + ':'
      document.getElementById('ems-tod-slot-date').value = reading.date
      document.getElementById('ems-tod-slot-value').value = reading[slot]
      document.getElementById('ems-tod-slot-form').dataset.readingId = readingId
      document.getElementById('ems-tod-slot-form').dataset.slot = slot
      UI.openModal('ems-tod-slot-modal')
    }

    function wireEmsTodGridPanel() {
      document.getElementById('ems-tod-search').addEventListener('input', (event) => {
        emsTodSearch = event.target.value
        emsTodPage = 1
        renderPage()
      })
      document.getElementById('ems-tod-add-btn').addEventListener('click', emsOpenTodAdd)
      document.querySelectorAll('[data-ems-slot]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [readingId, slot] = btn.getAttribute('data-ems-slot').split(':')
          emsOpenTodSlot(readingId, slot)
        }),
      )
    }

    // ---------------------------------------------------- EMS: meter list
    function renderEmsMeterListPanel() {
      const term = emsMeterSearch.trim().toLowerCase()
      const all = Store.get().emsMeters
      const filtered = term ? all.filter((m) => m.name.toLowerCase().includes(term) || m.meterId.toLowerCase().includes(term)) : all
      const { pageRows, totalPages, page } = emsPaginate(filtered, emsMeterPage, EMS_PER_PAGE)
      emsMeterPage = page
      const rowsHtml =
        pageRows.length === 0
          ? '<tr><td colspan="7" class="empty-table-note">No meters match your search.</td></tr>'
          : pageRows
              .map(
                (m, i) => `
        <tr>
          <td><input type="checkbox" data-ems-meter-check="${m.id}" ${emsMeterSelected.has(m.id) ? 'checked' : ''} /></td>
          <td>${(page - 1) * EMS_PER_PAGE + i + 1}</td>
          <td>${m.name}</td>
          <td>${m.meterId}</td>
          <td>${m.model || '—'}</td>
          <td>${m.unit || '—'}</td>
          <td>
            <button type="button" class="ems-row-action-btn" data-ems-meter-edit="${m.id}" aria-label="Edit meter">${emsEditIcon()}</button>
            <button type="button" class="ems-row-action-btn" data-ems-meter-dashboard="${m.id}" aria-label="Open meter dashboard">${emsViewIcon()}</button>
          </td>
        </tr>`,
              )
              .join('')
      const allOnPageSelected = pageRows.length > 0 && pageRows.every((m) => emsMeterSelected.has(m.id))
      return `
        <div class="ems-toolbar">
          <div class="table-search-wrap" style="margin-bottom:0;">${emsSearchIcon()}<input type="text" id="ems-meter-search" placeholder="Search meters" value="${emsMeterSearch}" /></div>
          <div class="ems-toolbar-actions">
            <button type="button" class="solid-action-button danger" id="ems-meter-delete-btn" ${emsMeterSelected.size === 0 ? 'disabled' : ''}>${emsDeleteIcon()}Delete</button>
            <button type="button" class="solid-action-button" id="ems-meter-add-btn">${emsAddIcon()}Add</button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">

            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        ${emsPaginationHtml(page, totalPages, 'meters')}`

      document.getElementById('ems-meter-modal-title').textContent = 'Edit Meter'

        document.getElementById(elId).value = meter[field] ?? ''

      UI.openModal('ems-meter-modal')

        emsMeterPage = 1

        cb.addEventListener('change', () => {
          const id = cb.getAttribute('data-ems-meter-check')

          else emsMeterSelected.delete(id)

      )
      document.querySelectorAll('[data-ems-meter-edit]').forEach((btn) => btn.addEventListener('click', () => emsOpenMeterEdit(btn.getAttribute('data-ems-meter-edit'))))
      document.querySelectorAll('[data-ems-meter-dashboard]').forEach((btn) =>

    function renderEmsEnergyDataPanel() {

      const all = Store.get()
        .emsEnergyData.slice()
        .sort((a, b) => (a.year !== b.year ? b.year - a.year : EMS_TAB_MONTHS.indexOf(b.month) - EMS_TAB_MONTHS.indexOf(a.month)))
      const filtered = term ? all.filter((e) => String(e.year).includes(term) || e.month.toLowerCase().includes(term)) : all
      const { pageRows, totalPages, page } = emsPaginate(filtered, emsEnergyPage, EMS_PER_PAGE)

      const rowsHtml =
        pageRows.length === 0
          ? '<tr><td colspan="9" class="empty-table-note">No results found.</td></tr>'
          : pageRows

                (e, i) => `
        <tr>
          <td><input type="checkbox" data-ems-energy-check="${e.id}" ${emsEnergySelected.has(e.id) ? 'checked' : ''} /></td>
          <td>${(page - 1) * EMS_PER_PAGE + i + 1}</td>
          <td>${e.year}</td>
          <td>${e.month}</td>
          <td>${e.renewable}</td>

          <td>${e.renewablePercent}%</td>

        </tr>`,

      return `
        <div class="ems-toolbar">
          <div class="table-search-wrap" style="margin-bottom:0;">${emsSearchIcon()}<input type="text" id="ems-energy-search" placeholder="Search by year or month" value="${emsEnergySearch}" /></div>
          <div class="ems-toolbar-actions">
            <button type="button" class="solid-action-button danger" id="ems-energy-delete-btn" ${emsEnergySelected.size === 0 ? 'disabled' : ''}>${emsDeleteIcon()}Delete</button>
            <button type="button" class="solid-action-button" id="ems-energy-add-btn">${emsAddIcon()}Add</button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th><input type="checkbox" id="ems-energy-select-all" /></th><th>S.No</th><th>Year</th><th>Month</th><th>Renewable</th><th>Non-Renewable</th><th>Renewable %</th><th>Non-Renewable %</th><th>Action</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        ${emsPaginationHtml(page, totalPages, 'energy')}`
    }

    function emsPopulateYearOptions(selectedYear) {
      const currentYear = new Date().getFullYear()
      const years = []
      for (let y = 2021; y <= currentYear + 1; y++) years.push(y)
      document.getElementById('ems-energy-year').innerHTML = years.map((y) => `<option value="${y}" ${y === selectedYear ? 'selected' : ''}>${y}</option>`).join('')
    }

    function emsOpenEnergyAdd() {
      document.getElementById('ems-energy-modal-title').textContent = 'Add Energy Data'
      document.getElementById('ems-energy-save-btn').textContent = 'Add Energy'
      document.getElementById('ems-energy-form').dataset.editingId = ''
      emsPopulateYearOptions(new Date().getFullYear())
      document.getElementById('ems-energy-month').value = ''
      document.getElementById('ems-energy-renewable').value = ''
      document.getElementById('ems-energy-non-renewable').value = ''
      document.getElementById('ems-energy-renewable-pct').value = ''
      document.getElementById('ems-energy-non-renewable-pct').value = ''
      UI.openModal('ems-energy-modal')

      document.getElementById('ems-energy-modal-title').textContent = 'Edit Energy Data'

      document.getElementById('ems-energy-non-renewable').value = energy.nonRenewable
      document.getElementById('ems-energy-renewable-pct').value = energy.renewablePercent
      document.getElementById('ems-energy-non-renewable-pct').value = energy.nonRenewablePercent
      UI.openModal('ems-energy-modal')
    }

    function wireEmsEnergyDataPanel() {
      document.getElementById('ems-energy-search').addEventListener('input', (event) => {
        emsEnergySearch = event.target.value
        emsEnergyPage = 1
        renderPage()

      document.getElementById('ems-energy-add-btn').addEventListener('click', emsOpenEnergyAdd)
      document.getElementById('ems-energy-delete-btn').addEventListener('click', () => {
        if (emsEnergySelected.size === 0) return

          message: `Delete ${emsEnergySelected.size} selected record${emsEnergySelected.size === 1 ? '' : 's'}? This can't be undone.`,
          onConfirm: () => {
            Store.removeEmsEnergyData(Array.from(emsEnergySelected))
            emsEnergySelected.clear()
            UI.toast('Energy data deleted successfully!')
            renderPage()
          },

      })
      document.getElementById('ems-energy-select-all')?.addEventListener('change', (event) => {

        })

      document.querySelectorAll('[data-ems-energy-check]').forEach((cb) =>

    function renderEmsBody() {
      const panel = emsActiveTab === 'todgrid' ? renderEmsTodGridPanel() : emsActiveTab === 'meters' ? renderEmsMeterListPanel() : renderEmsEnergyDataPanel()
      return `
        <div class="detail-tabs">
          ${EMS_TABS.map((t) => `<button type="button" class="detail-tab-button${emsActiveTab === t.key ? ' active' : ''}" data-ems-tab="${t.key}">${t.label}</button>`).join('')}
        </div>
        <div class="detail-card">${panel}</div>`
    }

    function wireEmsBody() {
      document.querySelectorAll('[data-ems-tab]').forEach((btn) =>
        btn.addEventListener('click', () => {
          emsActiveTab = btn.getAttribute('data-ems-tab')
          renderPage()
        }),
      )
      document.querySelectorAll('[data-ems-page]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [prefix, pageStr] = btn.getAttribute('data-ems-page').split(':')
          const page = Number(pageStr)
          if (prefix === 'todgrid') emsTodPage = page
          else if (prefix === 'meters') emsMeterPage = page
          else emsEnergyPage = page
          renderPage()
        }),
      )
      if (emsActiveTab === 'todgrid') wireEmsTodGridPanel()
      else if (emsActiveTab === 'meters') wireEmsMeterListPanel()
      else wireEmsEnergyDataPanel()

    document.getElementById('ems-tod-form').addEventListener('submit', function (event) {

      const data = {
        date: document.getElementById('ems-tod-date').value,
        t1: Number(document.getElementById('ems-tod-t1').value) || 0,
        t2: Number(document.getElementById('ems-tod-t2').value) || 0,
        t3: Number(document.getElementById('ems-tod-t3').value) || 0,
        t4: Number(document.getElementById('ems-tod-t4').value) || 0,
        t5: Number(document.getElementById('ems-tod-t5').value) || 0,
        totalHours: Number(document.getElementById('ems-tod-total').value) || 0,
      }
      if (!data.date) return
      Store.addEmsTodReading(data)
      UI.toast('Reading added successfully!')
      UI.closeModal('ems-tod-modal')
      renderPage()
    })

    document.getElementById('ems-tod-slot-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const readingId = this.dataset.readingId
      const slot = this.dataset.slot
      const value = Number(document.getElementById('ems-tod-slot-value').value) || 0
      Store.updateEmsTodReading(readingId, { [slot]: value })
      UI.toast('Reading updated successfully!')
      UI.closeModal('ems-tod-slot-modal')
      renderPage()
    })

    document.getElementById('ems-meter-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const data = {}
      Object.entries(EMS_METER_FIELD_IDS).forEach(([field, elId]) => {
        const raw = document.getElementById(elId).value
        data[field] = EMS_METER_NUMERIC_FIELDS.includes(field) ? (raw === '' ? null : Number(raw)) : raw.trim()
      })
      if (!data.name || !data.meterId) return
      const editingId = this.dataset.editingId
      if (editingId) {
        Store.updateEmsMeter(editingId, data)
        UI.toast('Meter updated successfully!')
      } else {
        Store.addEmsMeter(data)
        UI.toast('Meter added successfully!')
      }
      UI.closeModal('ems-meter-modal')
      renderPage()
    })

      event.preventDefault()
      const data = {
        year: Number(document.getElementById('ems-energy-year').value),
        month: document.getElementById('ems-energy-month').value,
        renewable: Number(document.getElementById('ems-energy-renewable').value) || 0,
        nonRenewable: Number(document.getElementById('ems-energy-non-renewable').value) || 0,
        renewablePercent: Number(document.getElementById('ems-energy-renewable-pct').value) || 0,
        nonRenewablePercent: Number(document.getElementById('ems-energy-non-renewable-pct').value) || 0,
      }
      if (!data.month) return
      const editingId = this.dataset.editingId
      if (editingId) {
        Store.updateEmsEnergyData(editingId, data)

      } else {
        Store.addEmsEnergyData(data)
        UI.toast('Energy data added successfully!')
      }
      UI.closeModal('ems-energy-modal')
      renderPage()
    })

    function renderPage() {
      const app = getApp()
      const root = document.getElementById('app-detail-root')
      if (!app) {
        root.innerHTML = `
          <div class="not-found-block">
            <h2>Application not found</h2>
            <p>It may have been deleted.</p>
            <a class="detail-back-link" href="applications.html">Back to Applications</a>
          </div>`
        return
      }

      const isPms = app.name === 'PMS'
      const isEms = app.name === 'EMS'
      const data = Store.get()
      const devices = (app.deviceIds || []).map((id) => data.devices.find((d) => d.id === id)).filter(Boolean)
      const assets = (app.assetIds || []).map((id) => data.assets.find((a) => a.id === id)).filter(Boolean)

      root.innerHTML = `
        <a class="detail-back-link" href="applications.html">&larr; Back to Applications</a>
        <div class="page-header">
          <div>
            <h1 class="page-title">${app.name}${app.isDefault ? ' <span class="default-profile-badge">Default</span>' : ''}</h1>
            <p class="page-subtitle">${app.description || 'No description provided.'}</p>
          </div>
          <div class="page-header-actions">
            <span class="status-pill status-${app.status}">${app.status}</span>
            <button type="button" class="modal-button secondary" id="toggle-status-btn">${app.status === 'active' ? 'Suspend' : 'Activate'}</button>
            <button type="button" class="modal-button secondary" id="edit-app-btn">Edit</button>
            ${app.isDefault ? '' : '<button type="button" class="modal-button danger" id="delete-app-btn">Delete</button>'}
          </div>
        </div>

        ${isPms ? renderPmsBody() : isEms ? renderEmsBody() : renderGenericBody(app, devices, assets)}`

      document.getElementById('toggle-status-btn').addEventListener('click', () => {
        Store.toggleApplicationStatus(app.id)
        UI.toast(`"${app.name}" status updated successfully!`)
        renderPage()
      })
      document.getElementById('edit-app-btn').addEventListener('click', openEdit)
      document.getElementById('delete-app-btn')?.addEventListener('click', confirmDelete)
      if (isPms) wirePmsBody()
      else if (isEms) wireEmsBody()
      else wireGenericBody()
      // The palette FAB lives outside #app-detail-root (see the modal/FAB
      // markup near the bottom of <body>) so it survives this rewrite —
      // only show it for a generic app's own Custom widgets tab.
      document.getElementById('widget-palette-fab').classList.toggle('hidden', isPms || isEms || genericActiveTab !== 'widgets')
    }

    renderPage()
  </script>
</body>
</html>
