    ]
    const NOTION_HABIT_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']
    // Ephemeral (not persisted) Pomodoro runtime state, keyed by block id —
    // like a real Pomodoro widget, the running countdown resets if you
    // navigate away, only the chosen duration would be worth persisting and
    // even that isn't, to keep this a plain client-side widget.
    let notionTimerState = {}
    let notionLiveWidgetIntervalAttached = false
    const NOTION_CONTINUABLE_TYPES = ['bullet', 'numbered', 'todo']
    const NOTION_PAGE_ICONS = ['📄', '📝', '📌', '📚', '💡', '🎯', '🚀', '✅', '📅', '⭐', '🔥', '🗂️', '🧩', '📊']
    const NOTION_DB_VIEWS = [
      { key: 'table', label: 'Table' },
      { key: 'board', label: 'Board' },
      { key: 'list', label: 'List' },
      { key: 'calendar', label: 'Calendar' },
      { key: 'timeline', label: 'Timeline' },
      { key: 'gallery', label: 'Gallery' },
      { key: 'chart', label: 'Chart' },
    ]
    const NOTION_DB_STATUSES = ['Not started', 'In progress', 'Done']
    // Falls back into notionDbProperties() for database blocks created
    // before per-database columns existed (or missing the field for any
    // other reason) so Table view always has something to render.
    const NOTION_DB_DEFAULT_PROPERTIES = [
      { id: 'title', name: 'Title', type: 'text' },
      { id: 'status', name: 'Status', type: 'select', options: NOTION_DB_STATUSES },
      { id: 'tag', name: 'Tag', type: 'text' },
      { id: 'date', name: 'Date', type: 'date' },
      { id: 'endDate', name: 'End date', type: 'date' },
    ]
    let notionDbCalendarMonth = {}
    let notionDbChartInstances = {}
    let notionDraggedDbCard = null
    let notionEditingDbItem = null
    let notionTimelineDrag = null
    const NOTION_TIMELINE_DAY_WIDTH = 32

    function notionDbStatusColor(status) {
      if (status === 'Done') return 'var(--success-dark)'
      if (status === 'In progress') return 'var(--accent)'
      return 'var(--text-faint)'
    }
    function notionDbProperties(block) {
      return block.properties && block.properties.length ? block.properties : NOTION_DB_DEFAULT_PROPERTIES
    }
    function notionBlockData(type) {
      if (type === 'divider' || type === 'toc' || type === 'clock') return { type }
      if (type === 'database') return { type, view: 'table', properties: NOTION_DB_DEFAULT_PROPERTIES.map((p) => Object.assign({}, p, p.options ? { options: p.options.slice() } : {})), items: [] }
      if (type === 'todo') return { type, text: '', checked: false }
      if (type === 'image' || type === 'video' || type === 'embed') return { type, url: '' }
      if (type === 'timer') return { type, minutes: 25 }
      if (type === 'countdown') return { type, text: '', target: '' }
      if (type === 'habit') return { type, text: 'Daily habit', days: NOTION_HABIT_DAYS.map(() => false) }
      return { type, text: '' }
    }
    // Positions a `position: fixed` floating panel (column menu / add-column
    // popover) against the button that opened it, using the viewport rather
    // than any CSS offset parent — called only after the panel's `display`
    // is already switched on, so panel.offsetWidth reflects its real size.
    function notionPositionFloatingPanel(btn, panel) {
      const rect = btn.getBoundingClientRect()
      const panelWidth = panel.offsetWidth
      let left = rect.right - panelWidth
      if (left < 8) left = rect.left
      left = Math.max(8, Math.min(left, window.innerWidth - panelWidth - 8))
      panel.style.top = rect.bottom + 4 + 'px'
      panel.style.left = left + 'px'
    }
    // Named (not inline) so the exact same function reference can be passed
    // to both addEventListener and removeEventListener — not needed here
    // since it's only ever attached, but kept consistent with
    // notionTimelineOnMouseMove/Up below, which do need that.
    function notionCloseFloatingPanels() {
      const menu = document.getElementById('notion-icon-picker-menu')
      if (menu) menu.style.display = 'none'
      document.querySelectorAll('[data-notion-db-properties-panel]').forEach((el) => {
        el.style.display = 'none'
      })
    }
    function notionFindDbItem(blockId, itemId) {
      const page = (Store.get().notionPages || []).find((p) => p.id === notionActivePageId)
      const block = page && page.blocks.find((b) => b.id === blockId)
      const item = block && (block.items || []).find((i) => i.id === itemId)
      return item ? { page, block, item } : null
    }
    // Shared "edit item" modal used by Board/List/Calendar/Timeline/Gallery —
    // Table view edits cells inline instead, since it already shows every
    // property in one row.
    function notionOpenItemModal(blockId, itemId) {
      const found = notionFindDbItem(blockId, itemId)
      if (!found) return
      notionEditingDbItem = { blockId, itemId }
      document.getElementById('notion-db-item-modal-title').textContent = found.item.title ? 'Edit item' : 'New item'
      document.getElementById('notion-db-item-title').value = found.item.title || ''
      document.getElementById('notion-db-item-status').value = found.item.status || 'Not started'
      document.getElementById('notion-db-item-tag').value = found.item.tag || ''
      document.getElementById('notion-db-item-date').value = found.item.date || ''
      document.getElementById('notion-db-item-end-date').value = found.item.endDate || ''
      UI.openModal('notion-db-item-modal')
    }
    function notionAddDbItemAndEdit(blockId, seed) {
      Store.addNotionDatabaseItem(notionActivePageId, blockId, Object.assign({ title: '', status: 'Not started', tag: '', date: '', endDate: '' }, seed))
      const page = Store.get().notionPages.find((p) => p.id === notionActivePageId)
      const block = page.blocks.find((b) => b.id === blockId)
      const newItem = block.items[block.items.length - 1]
      renderPage()
      notionOpenItemModal(blockId, newItem.id)
    }

    // Named (not inline) so the exact same function reference can be passed
    // to both addEventListener and removeEventListener below.
    function notionTimelineOnMouseMove(event) {
      if (!notionTimelineDrag) return
      const deltaPx = event.clientX - notionTimelineDrag.startX
      const deltaDays = Math.round(deltaPx / NOTION_TIMELINE_DAY_WIDTH)
      notionTimelineDrag.deltaDays = deltaDays
      if (notionTimelineDrag.mode === 'move') {
        notionTimelineDrag.el.style.left = notionTimelineDrag.originalLeft + deltaDays * NOTION_TIMELINE_DAY_WIDTH + 'px'
      } else {
        const newWidth = Math.max(NOTION_TIMELINE_DAY_WIDTH, notionTimelineDrag.originalWidth + deltaDays * NOTION_TIMELINE_DAY_WIDTH)
        notionTimelineDrag.el.style.width = newWidth + 'px'
      }
    }
    function notionTimelineOnMouseUp() {
      if (!notionTimelineDrag) return
      const { blockId, itemId, mode, deltaDays, originalDate, originalEndDate } = notionTimelineDrag
      document.removeEventListener('mousemove', notionTimelineOnMouseMove)
      document.removeEventListener('mouseup', notionTimelineOnMouseUp)
      notionTimelineDrag = null
      if (!deltaDays) return
      const addDays = (iso, n) => {
        const d = new Date(iso + 'T00:00:00')
        d.setDate(d.getDate() + n)
        return d.toISOString().slice(0, 10)
      }
      if (mode === 'move') {
        Store.updateNotionDatabaseItem(notionActivePageId, blockId, itemId, {
          date: addDays(originalDate, deltaDays),
          endDate: originalEndDate ? addDays(originalEndDate, deltaDays) : '',
        })
      } else {
        const newEnd = addDays(originalEndDate || originalDate, deltaDays)
        Store.updateNotionDatabaseItem(notionActivePageId, blockId, itemId, { endDate: newEnd < originalDate ? originalDate : newEnd })
      }
      renderPage()
    }

    function notionTrashIcon() {
      return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>'
    }
    function notionChevronUpIcon() {
      return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    }
    function notionChevronDownIcon() {
      return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    }
    function notionAddIcon() {
      return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>'
    }
    function notionDragHandleIcon() {
      return '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>'
    }
    function notionSettingsIcon() {
      return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="3.5" rx="1"/><rect x="4" y="10.5" width="16" height="3.5" rx="1"/><rect x="4" y="16" width="16" height="3.5" rx="1"/><circle cx="8" cy="6.75" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="12.25" r="1.1" fill="currentColor" stroke="none"/><circle cx="10" cy="17.75" r="1.1" fill="currentColor" stroke="none"/></svg>'
    }

    function notionSlashMenu(block) {
      return `
        <div class="notion-slash-menu" data-notion-slash-menu="${block.id}" style="display:none;">
          ${NOTION_BLOCK_TYPES.map((t) => `<button type="button" class="notion-slash-item" data-notion-slash-pick="${block.id}:${t.type}" data-label="${t.label.toLowerCase()}">${t.label}</button>`).join('')}
        </div>`
    }

    function renderNotionBlock(block, index, total, numberedIndex, page) {
      const dragHandle = `<span class="notion-drag-handle" draggable="true" aria-hidden="true">${notionDragHandleIcon()}</span>`
      const actions = `
        <div class="notion-block-actions">
          <button type="button" class="notion-block-action-btn" data-notion-move="${block.id}:up" ${index === 0 ? 'disabled' : ''} aria-label="Move block up" title="Move block up">${notionChevronUpIcon()}</button>
          <button type="button" class="notion-block-action-btn" data-notion-move="${block.id}:down" ${index === total - 1 ? 'disabled' : ''} aria-label="Move block down" title="Move block down">${notionChevronDownIcon()}</button>
          <button type="button" class="notion-block-action-btn" data-notion-delete-block="${block.id}" aria-label="Delete block" title="Delete block">${notionTrashIcon()}</button>
        </div>`

      if (block.type === 'divider') {
        return `<div class="notion-block-wrap" id="notion-block-${block.id}"><div class="notion-block notion-block-divider" data-notion-block-id="${block.id}">${dragHandle}<hr />${actions}</div></div>`
      }
      if (block.type === 'database') {
        return renderNotionDatabaseBlock(block, dragHandle, actions)
      }
      if (block.type === 'image' || block.type === 'video' || block.type === 'embed') {
        return renderNotionMediaBlock(block, dragHandle, actions)
      }
      if (block.type === 'math') {
        return renderNotionMathBlock(block, dragHandle, actions)
      }
      if (block.type === 'toc') {
        return renderNotionTocBlock(block, dragHandle, actions, page)
      }
      if (block.type === 'clock') {
        return renderNotionClockBlock(block, dragHandle, actions)
      }
      if (block.type === 'timer') {
        return renderNotionTimerBlock(block, dragHandle, actions)
      }
      if (block.type === 'countdown') {
        return renderNotionCountdownBlock(block, dragHandle, actions)
      }
      if (block.type === 'habit') {
        return renderNotionHabitBlock(block, dragHandle, actions)
      }
      let row
      if (block.type === 'todo') {
        row = `
          <div class="notion-block notion-block-todo${block.checked ? ' checked' : ''}" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="checkbox" data-notion-block-checked="${block.id}" ${block.checked ? 'checked' : ''} />
            <input type="text" class="notion-block-input" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="To-do" />
            ${actions}
          </div>`
      } else if (block.type === 'bullet') {
        row = `
          <div class="notion-block notion-block-bullet" data-notion-block-id="${block.id}">
            ${dragHandle}
            <span class="notion-bullet-dot">&bull;</span>
            <input type="text" class="notion-block-input" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="List item" />
            ${actions}
          </div>`
      } else if (block.type === 'numbered') {
        row = `
          <div class="notion-block notion-block-numbered" data-notion-block-id="${block.id}">
            ${dragHandle}
            <span class="notion-number-marker">${numberedIndex}.</span>
            <input type="text" class="notion-block-input" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="List item" />
            ${actions}
          </div>`
      } else if (block.type === 'heading') {
        row = `
          <div class="notion-block notion-block-heading" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="text" class="notion-block-input heading1" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="Heading 1" />
            ${actions}
          </div>`
      } else if (block.type === 'heading2') {
        row = `
          <div class="notion-block notion-block-heading" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="text" class="notion-block-input heading2" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="Heading 2" />
            ${actions}
          </div>`
      } else if (block.type === 'quote') {
        row = `
          <div class="notion-block notion-block-quote" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="text" class="notion-block-input quote" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="Quote" />
            ${actions}
          </div>`
      } else if (block.type === 'callout') {
        row = `
          <div class="notion-block notion-block-callout" data-notion-block-id="${block.id}">
            ${dragHandle}
            <span class="notion-callout-emoji">💡</span>
            <input type="text" class="notion-block-input" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="Callout" />
            ${actions}
          </div>`
      } else if (block.type === 'code') {
        row = `
          <div class="notion-block notion-block-code" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="text" class="notion-block-input code" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="Code" />
            ${actions}
          </div>`
      } else {
        row = `
          <div class="notion-block notion-block-text" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="text" class="notion-block-input" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="Text" />
            ${actions}
          </div>`
      }
      return `<div class="notion-block-wrap" id="notion-block-${block.id}">${row}${notionSlashMenu(block)}</div>`
    }

    // -------------------------------------------- Notion media blocks
    // Image/Video/Embed all just store a `url` and preview it — Video
    // recognizes YouTube/Loom links and rewrites them to their embeddable
    // URL, Embed just iframes whatever's pasted (works for sites that allow
    // being framed; there's no backend here to resolve arbitrary links the
    // way Notion's own oEmbed service does for its 500+ supported sites).
    // The URL commits on blur/Enter rather than every keystroke, so pasting
    // a link doesn't fight for focus and still shows the preview right away.
    function notionMediaEmbedSrc(type, rawUrl) {
      const url = (rawUrl || '').trim()
      if (!url) return ''
      if (type === 'video') {
        const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/)
        if (yt) return 'https://www.youtube.com/embed/' + yt[1]
        const loom = url.match(/loom\.com\/(?:share|embed)\/([\w-]+)/)
        if (loom) return 'https://www.loom.com/embed/' + loom[1]
      }
      if (type === 'embed') {
        // Spotify's embed player is public — no API key needed — so any
        // normal share link just gets rewritten to its /embed/ form, same
        // idea as the YouTube/Loom rewrite above.
        const spotify = url.match(/open\.spotify\.com\/(track|album|playlist|episode|show|artist)\/([\w]+)/)
        if (spotify) return `https://open.spotify.com/embed/${spotify[1]}/${spotify[2]}`
      }
      return url
    }

    function notionIsSpotifyUrl(url) {
      return /open\.spotify\.com/.test(url || '')
    }

    // The 600+ widgets in a real Notion widget gallery aren't built by
    // Notion itself — each one is generated on a third-party site (Indify,
    // Apption Widgets, Widgetbox, etc.) as a unique embed link, which you
    // then paste into Notion's one generic /embed block. This block works
    // the same way: it's already compatible with all of them the moment a
    // link is pasted in, so the empty state just surfaces the categories of
    // services people commonly use it for, rather than the app trying to
    // natively rebuild hundreds of widgets.
    const NOTION_EMBED_GALLERY = [
      { icon: '🕐', label: 'Clocks & timers', services: 'Indify, Apption Widgets, Widgetbox' },
      { icon: '🌦️', label: 'Weather', services: 'Indify, Weatherwidget.io' },
      { icon: '🎵', label: 'Music', services: 'Spotify, SoundCloud' },
      { icon: '📅', label: 'Calendars', services: 'Google Calendar' },
      { icon: '🗺️', label: 'Maps', services: 'Google Maps' },
      { icon: '🎨', label: 'Design & docs', services: 'Figma, Miro, Google Drive' },
      { icon: '📊', label: 'Data & charts', services: 'Datawrapper, Rows, CodePen' },
      { icon: '📣', label: 'Buttons & social', services: 'Indify, Apption Widgets' },
    ]

    function notionEmbedGalleryHtml() {
      return `
        <div class="notion-embed-gallery">
          <p class="notion-embed-gallery-title">Paste a link from any of these — this one block works with all of them, the same way Notion's own /embed does:</p>
          <div class="notion-embed-gallery-grid">
            ${NOTION_EMBED_GALLERY.map(
              (c) => `
              <div class="notion-embed-gallery-chip">
                <span class="notion-embed-gallery-icon">${c.icon}</span>
                <span class="notion-embed-gallery-text"><strong>${c.label}</strong><br>${c.services}</span>
              </div>`,
            ).join('')}
          </div>
          <p class="notion-db-hint">Some services block being framed — if a preview stays blank, that's why.</p>
        </div>`
    }

    function renderNotionMediaBlock(block, dragHandle, actions) {
      const url = block.url || ''
      const placeholder = block.type === 'image' ? 'Image URL' : block.type === 'video' ? 'YouTube or Loom URL' : 'Embed URL — paste a link from Spotify, Google Calendar, Indify, Apption Widgets, and 100s more'
      let preview = ''
      if (url) {
        if (block.type === 'image') {
          preview = `<img class="notion-media-image" src="${url}" alt="" />`
        } else {
          const frameClass = notionIsSpotifyUrl(url) ? 'notion-media-frame notion-media-frame-spotify' : 'notion-media-frame'
          preview = `<div class="${frameClass}"><iframe src="${notionMediaEmbedSrc(block.type, url)}" loading="lazy" allowfullscreen></iframe></div>`
        }
      } else if (block.type === 'embed') {
        preview = notionEmbedGalleryHtml()
      }
      return `
        <div class="notion-block-wrap" id="notion-block-${block.id}">
          <div class="notion-block notion-block-media" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="text" class="notion-block-input" data-notion-block-url="${block.id}" value="${url}" placeholder="${placeholder}" />
            ${actions}
          </div>
          ${preview ? `<div class="notion-media-preview">${preview}</div>` : ''}
        </div>`
    }

    // -------------------------------------------- Notion math block
    // Renders LaTeX via KaTeX (loaded from CDN), synchronously to an HTML
    // string — no separate DOM step needed. The text input reuses the same
    // [data-notion-block-text] wiring every other text-bearing block uses;
    // that handler also refreshes this block's own preview live as you type
    // (see wireNotionBody), since a formula is worth watching update.
    function notionRenderMath(text) {
      if (!text || !text.trim()) return '<span class="section-empty">Type a LaTeX expression above, e.g. E = mc^2</span>'
      try {
        return katex.renderToString(text, { throwOnError: false, displayMode: true })
      } catch (e) {
        return '<span class="section-empty">Could not render this expression.</span>'
      }
    }

    function renderNotionMathBlock(block, dragHandle, actions) {
      return `
        <div class="notion-block-wrap" id="notion-block-${block.id}">
          <div class="notion-block notion-block-math" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="text" class="notion-block-input code" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="LaTeX, e.g. E = mc^2" />
            ${actions}
          </div>
          <div class="notion-math-preview">${notionRenderMath(block.text)}</div>
        </div>`
    }

    // -------------------------------------------- Notion table of contents
    // Purely computed from the page's own heading/heading2 blocks — stores
    // no data of its own. Jumping to a heading scrolls + briefly highlights
    // it; it deliberately isn't a real <a href="#..."> link, since that
    // would rewrite window.location.hash, which this very page already
    // parses as "#applicationId:tab" for routing.
    function renderNotionTocBlock(block, dragHandle, actions, page) {
      const headings = (page ? page.blocks : []).filter((b) => b.type === 'heading' || b.type === 'heading2')
      const list = headings.length === 0
        ? '<span class="section-empty">No headings on this page yet.</span>'
        : headings
            .map(
              (h) => `<button type="button" class="notion-toc-item${h.type === 'heading2' ? ' notion-toc-indent' : ''}" data-notion-toc-jump="${h.id}">${h.text || 'Untitled heading'}</button>`,
            )
            .join('')
      return `
        <div class="notion-block-wrap" id="notion-block-${block.id}">
          <div class="notion-block notion-block-toc" data-notion-block-id="${block.id}">
            ${dragHandle}
            <span class="notion-toc-label">${notionSettingsIcon()}Table of contents</span>
            ${actions}
          </div>
          <div class="notion-toc-list">${list}</div>
        </div>`
    }

    // -------------------------------------------- Notion live widgets
    // Clock, Pomodoro timer, and Countdown all tick every second via one
    // shared setInterval (notionTickLiveWidgets, wired once in
    // wireNotionBody) that updates their DOM text directly — never through
    // renderPage(), so a running timer never gets reset by an unrelated
    // re-render and typing elsewhere never stutters against a 1s redraw.
    function renderNotionClockBlock(block, dragHandle, actions) {
      return `
        <div class="notion-block-wrap" id="notion-block-${block.id}">
          <div class="notion-block notion-block-clock" data-notion-block-id="${block.id}">
            ${dragHandle}
            <div class="notion-clock-face" data-notion-clock>
              <span class="notion-clock-time"></span>
              <span class="notion-clock-date"></span>
            </div>
            ${actions}
          </div>
        </div>`
    }

    function notionFormatClock(now) {
      return { time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }), date: now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }) }
    }

    function renderNotionTimerBlock(block, dragHandle, actions) {
      const state = notionTimerState[block.id] || (notionTimerState[block.id] = { remaining: (block.minutes || 25) * 60, running: false })
      return `
        <div class="notion-block-wrap" id="notion-block-${block.id}">
          <div class="notion-block notion-block-timer" data-notion-block-id="${block.id}">
            ${dragHandle}
            <div class="notion-timer-widget">
              <div class="notion-timer-presets">
                ${NOTION_TIMER_PRESETS.map((p) => `<button type="button" class="notion-timer-preset${block.minutes === p.minutes ? ' active' : ''}" data-notion-timer-preset="${block.id}:${p.minutes}">${p.label}</button>`).join('')}
              </div>
              <span class="notion-timer-display" data-notion-timer>${notionFormatTimer(state.remaining)}</span>
              <div class="notion-timer-controls">
                <button type="button" class="notion-add-block-btn" data-notion-timer-toggle="${block.id}">${state.running ? 'Pause' : 'Start'}</button>
                <button type="button" class="notion-add-block-btn" data-notion-timer-reset="${block.id}">Reset</button>
              </div>
            </div>
            ${actions}
          </div>
        </div>`
    }

    function notionFormatTimer(totalSeconds) {
      const s = Math.max(0, totalSeconds)
      const m = Math.floor(s / 60)
      const sec = s % 60
      return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0')
    }

    function renderNotionCountdownBlock(block, dragHandle, actions) {
      return `
        <div class="notion-block-wrap" id="notion-block-${block.id}">
          <div class="notion-block notion-block-countdown" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="text" class="notion-block-input" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="What are you counting down to?" />
            <input type="datetime-local" class="notion-countdown-target-input" data-notion-countdown-target="${block.id}" value="${block.target || ''}" />
            ${actions}
          </div>
          <div class="notion-countdown-display" data-notion-countdown="${block.target || ''}"></div>
        </div>`
    }

    function notionFormatCountdown(targetIso) {
      if (!targetIso) return 'Set a target date above.'
      const diff = new Date(targetIso).getTime() - Date.now()
      if (Number.isNaN(diff)) return 'Set a target date above.'
      if (diff <= 0) return 'Countdown reached!'
      const totalSeconds = Math.floor(diff / 1000)
      const days = Math.floor(totalSeconds / 86400)
      const hours = Math.floor((totalSeconds % 86400) / 3600)
      const minutes = Math.floor((totalSeconds % 3600) / 60)
      const seconds = totalSeconds % 60
      return `${days}d ${hours}h ${minutes}m ${seconds}s remaining`
    }

    function renderNotionHabitBlock(block, dragHandle, actions) {
      const days = block.days && block.days.length === 7 ? block.days : NOTION_HABIT_DAYS.map(() => false)
      return `
        <div class="notion-block-wrap" id="notion-block-${block.id}">
          <div class="notion-block notion-block-habit" data-notion-block-id="${block.id}">
            ${dragHandle}
            <input type="text" class="notion-block-input" data-notion-block-text="${block.id}" value="${block.text || ''}" placeholder="Habit name" />
            ${actions}
          </div>
          <div class="notion-habit-days">
            ${NOTION_HABIT_DAYS.map(
              (label, i) => `
              <button type="button" class="notion-habit-day${days[i] ? ' done' : ''}" data-notion-habit-toggle="${block.id}:${i}">
                <span class="notion-habit-day-label">${label}</span>
                <span class="notion-habit-day-check">${days[i] ? '✓' : ''}</span>
              </button>`,
            ).join('')}
          </div>
        </div>`
    }

    // Runs once a second (attached once, guarded by
    // notionLiveWidgetIntervalAttached) and updates every currently-rendered
    // clock/timer/countdown directly via the DOM — re-querying elements each
    // tick means it naturally follows whatever's on screen after a
    // renderPage(), an add/delete block, or switching pages, with no
    // per-block cleanup needed.
    function notionTickLiveWidgets() {
      document.querySelectorAll('[data-notion-clock]').forEach((el) => {
        const now = new Date()
        const formatted = notionFormatClock(now)
        el.querySelector('.notion-clock-time').textContent = formatted.time
        el.querySelector('.notion-clock-date').textContent = formatted.date
      })
      document.querySelectorAll('[data-notion-timer]').forEach((el) => {
        const wrap = el.closest('.notion-block-wrap')
        const blockId = wrap && wrap.id.replace('notion-block-', '')
        const state = blockId && notionTimerState[blockId]
        if (!state) return
        if (state.running && state.remaining > 0) state.remaining -= 1
        el.textContent = notionFormatTimer(state.remaining)
        if (state.running && state.remaining <= 0) {
          state.running = false
          const toggleBtn = wrap.querySelector('[data-notion-timer-toggle]')
          if (toggleBtn) toggleBtn.textContent = 'Start'
        }
      })
      document.querySelectorAll('[data-notion-countdown]').forEach((el) => {
        el.textContent = notionFormatCountdown(el.getAttribute('data-notion-countdown'))
      })
    }

    // ------------------------------------------------- Notion database block
    // A "database" block embeds a small structured item list (title/status/
    // tag/date/endDate) that can be displayed through 7 different views —
    // Table, Board, List, Calendar, Timeline, Gallery, Chart — all reading
    // the same underlying items. Items are only added/edited in Table view;
    // the other views are read-only visualizations (Board also supports
    // dragging a card to a different status column).
    // Table view has a per-database, user-editable schema (block.properties):
    // add a column (choose Text/Date/Select + a name), rename one by typing
    // in its header, or delete one via its header's dropdown — everything
    // except the required "Title" column, which every database keeps.
    function notionPropertyCellHtml(block, item, prop) {
      const key = `${block.id}:${item.id}:${prop.id}`
      if (prop.type === 'select') {
        const options = prop.options || []
        return `<select data-notion-db-field="${key}">${options.map((o) => `<option value="${o}" ${item[prop.id] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`
      }
      if (prop.type === 'date') {
        return `<input type="date" data-notion-db-field="${key}" value="${item[prop.id] || ''}" />`
      }
      return `<input type="text" data-notion-db-field="${key}" value="${item[prop.id] || ''}" placeholder="${prop.id === 'title' ? 'Untitled' : ''}" />`
    }

    // Table view supports renaming a column inline (click its header,
    // type) — the one property action Notion itself keeps in the table
    // header. Adding/deleting properties is centralized in the single
    // "Properties" panel below instead, reachable from every view, matching
    // how Board/List/Gallery/Calendar/Timeline all manage the schema through
    // one settings surface rather than per-column header chrome.
    function notionColumnHeaderHtml(block, prop) {
      return `<th class="notion-db-th"><input type="text" class="notion-db-col-name-input" data-notion-db-rename-col="${block.id}:${prop.id}" value="${prop.name || ''}" /></th>`
    }

    function renderNotionDbTable(block) {
      const items = block.items || []
      const properties = notionDbProperties(block)
      const rows = items
        .map(
          (item) => `
        <tr>
          ${properties.map((prop) => `<td>${notionPropertyCellHtml(block, item, prop)}</td>`).join('')}
          <td><button type="button" class="notion-block-action-btn" data-notion-db-delete-item="${block.id}:${item.id}" aria-label="Delete item" title="Delete item">${notionTrashIcon()}</button></td>
        </tr>`,
        )
        .join('')
      return `
        <div class="table-scroll">
          <table class="data-table notion-db-table">
            <thead><tr>${properties.map((prop) => notionColumnHeaderHtml(block, prop)).join('')}<th></th></tr></thead>
            <tbody>${rows || `<tr><td colspan="${properties.length + 1}" class="empty-table-note">No items yet.</td></tr>`}</tbody>
          </table>
        </div>
        <button type="button" class="notion-add-block-btn" data-notion-db-add-item="${block.id}">${notionAddIcon()}Add item</button>`
    }

    // Shared "Properties" panel — available from every view's toolbar, not
    // just Table — for adding, renaming, and deleting the database's
    // properties. Rendered as a `position: fixed` overlay (see
    // notionPositionFloatingPanel) so .table-scroll's overflow clipping,
    // and Board/Gallery's own horizontal scroll, never cut it off.
    function notionPropertiesPanelHtml(block) {
      const properties = notionDbProperties(block)
      const rows = properties
        .map(
          (prop) => `
        <div class="notion-db-properties-row">
          <span class="notion-db-properties-type-badge" title="${prop.type} property">${prop.type}</span>
          <input type="text" class="notion-db-col-name-input" data-notion-db-rename-col="${block.id}:${prop.id}" value="${prop.name || ''}" />
          ${prop.id === 'title' ? '' : `<button type="button" class="notion-block-action-btn" data-notion-db-delete-col="${block.id}:${prop.id}" aria-label="Delete property" title="Delete property">${notionTrashIcon()}</button>`}
        </div>`,
        )
        .join('')
      return `
        <div class="notion-db-properties-panel" data-notion-db-properties-panel="${block.id}" style="display:none;">
          <p class="notion-db-properties-panel-title">Properties</p>
          <div class="notion-db-properties-list">${rows}</div>
          <div class="notion-db-properties-add">
            <div class="modal-field"><label>Property name</label><input type="text" data-notion-db-new-col-name="${block.id}" placeholder="Property name" /></div>
            <div class="modal-field">
              <label>Type</label>
              <select data-notion-db-new-col-type="${block.id}">
                <option value="text">Text</option>
                <option value="date">Date</option>
                <option value="select">Select</option>
              </select>
            </div>
            <div class="modal-field" data-notion-db-new-col-options-field="${block.id}" style="display:none;">
              <label>Options (comma separated)</label>
              <input type="text" data-notion-db-new-col-options="${block.id}" placeholder="Option 1, Option 2" />
            </div>
            <button type="button" class="notion-add-block-btn" data-notion-db-add-col-confirm="${block.id}">Add property</button>
          </div>
        </div>`
    }

    function renderNotionDbList(block, items) {
      const rows = items
        .map(
          (i) => `
        <div class="notion-db-list-row" data-notion-db-open-item="${block.id}:${i.id}" title="${i.status || 'No status'} — click to open">
          <span class="notion-db-status-dot" style="background:${notionDbStatusColor(i.status)};" title="${i.status || 'No status'}"></span>
          <span class="notion-db-list-title">${i.title || 'Untitled'}</span>
          ${i.tag ? `<span class="notion-db-tag-pill">${i.tag}</span>` : ''}
          ${i.date ? `<span class="notion-db-list-date">${i.date}</span>` : ''}
        </div>`,
        )
        .join('')
      return `
        <div class="notion-db-list">${rows || '<span class="section-empty">No items yet.</span>'}</div>
        <button type="button" class="notion-add-block-btn" data-notion-db-quick-add="${block.id}">${notionAddIcon()}Add item</button>`
    }

    function renderNotionDbBoard(block, items) {
      return `<div class="notion-db-board">
        ${NOTION_DB_STATUSES.map(
          (status) => `
          <div class="notion-db-board-col" data-notion-db-board-col="${block.id}:${status}" style="border-top-color:${notionDbStatusColor(status)};">
            <p class="notion-db-board-col-title">${status}<span class="notion-db-board-count">${items.filter((i) => i.status === status).length}</span></p>
            <div class="notion-db-board-cards">
              ${items
                .filter((i) => i.status === status)
                .map(
                  (i) => `
                <div class="notion-db-board-card" draggable="true" data-notion-db-card="${block.id}:${i.id}" data-notion-db-open-item="${block.id}:${i.id}" title="${i.title || 'Untitled'} — drag to move, click to open">
                  <p class="notion-db-board-card-title">${i.title || 'Untitled'}</p>
                  ${i.tag ? `<span class="notion-db-tag-pill">${i.tag}</span>` : ''}
                </div>`,
                )
                .join('')}
            </div>
            <button type="button" class="notion-db-add-card-btn" data-notion-db-quick-add="${block.id}:${status}">${notionAddIcon()}Add card</button>
          </div>`,
        ).join('')}
      </div>`
    }

    function notionDbCurrentMonth(block) {
      if (!notionDbCalendarMonth[block.id]) {
        const withDates = (block.items || []).filter((i) => i.date).sort((a, b) => (a.date < b.date ? -1 : 1))
        notionDbCalendarMonth[block.id] = withDates.length > 0 ? withDates[0].date.slice(0, 7) : new Date().toISOString().slice(0, 7)
      }
      return notionDbCalendarMonth[block.id]
    }

    function renderNotionDbCalendar(block, items) {
      const monthKey = notionDbCurrentMonth(block)
      const [year, month] = monthKey.split('-').map(Number)
      const firstDay = new Date(year, month - 1, 1)
      const daysInMonth = new Date(year, month, 0).getDate()
      const startWeekday = firstDay.getDay()
      const itemsByDay = {}
      items.forEach((i) => {
        if (i.date && i.date.slice(0, 7) === monthKey) {
          const d = Number(i.date.slice(8, 10))
          itemsByDay[d] = itemsByDay[d] || []
          itemsByDay[d].push(i)
        }
      })
      const cells = []
      for (let i = 0; i < startWeekday; i++) cells.push('<div class="notion-db-cal-cell empty"></div>')
      for (let d = 1; d <= daysInMonth; d++) {
        const dayItems = itemsByDay[d] || []
        const dateStr = monthKey + '-' + String(d).padStart(2, '0')
        cells.push(`
          <div class="notion-db-cal-cell" data-notion-db-cal-cell="${block.id}:${dateStr}" title="Add item on ${dateStr}">
            <p class="notion-db-cal-daynum">${d}</p>
            ${dayItems
              .map(
                (i) => `<span class="notion-db-cal-item" draggable="true" data-notion-db-cal-item="${block.id}:${i.id}" data-notion-db-open-item="${block.id}:${i.id}" title="${i.title || ''}">${i.title || 'Untitled'}</span>`,
              )
              .join('')}
          </div>`)
      }
      const monthLabel = firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
      return `
        <div class="notion-db-cal-header">
          <button type="button" class="icon-button" data-notion-db-cal-nav="${block.id}:prev" aria-label="Previous month" title="Previous month">&lsaquo;</button>
          <p class="notion-db-cal-month">${monthLabel}</p>
          <button type="button" class="icon-button" data-notion-db-cal-nav="${block.id}:next" aria-label="Next month" title="Next month">&rsaquo;</button>
        </div>
        <div class="notion-db-cal-grid">
          ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<div class="notion-db-cal-weekday">${d}</div>`).join('')}
          ${cells.join('')}
        </div>
        <p class="notion-db-hint">Click a day to add an item, click an item to edit it, or drag an item to reschedule it.</p>`
    }

    function renderNotionDbTimeline(block, items) {
      const dated = items.filter((i) => i.date)
      if (dated.length === 0) return '<span class="section-empty">No dated items yet — add a date in Table view.</span>'
      const toTime = (s) => new Date(s + 'T00:00:00').getTime()
      const dayMs = 86400000
      const minTime = Math.min(...dated.map((i) => toTime(i.date)))
      const maxTime = Math.max(...dated.map((i) => toTime(i.endDate || i.date)))
      const totalDays = Math.max(1, Math.round((maxTime - minTime) / dayMs) + 1)
      const dayWidth = NOTION_TIMELINE_DAY_WIDTH
      const trackWidth = totalDays * dayWidth
      return `
        <p class="notion-db-hint">Drag a bar to reschedule it, drag its right edge to resize, or click a title to edit.</p>
        <div class="notion-db-timeline-scroll">
          <div class="notion-db-timeline" style="min-width:${trackWidth}px;">
            ${dated
              .map((i) => {
                const startOffset = Math.round((toTime(i.date) - minTime) / dayMs)
                const duration = Math.max(1, Math.round((toTime(i.endDate || i.date) - toTime(i.date)) / dayMs) + 1)
                return `
                <div class="notion-db-timeline-row">
                  <span class="notion-db-timeline-label" data-notion-db-open-item="${block.id}:${i.id}">${i.title || 'Untitled'}</span>
                  <div class="notion-db-timeline-track" style="width:${trackWidth}px;">
                    <span class="notion-db-timeline-bar" data-notion-db-timeline-bar="${block.id}:${i.id}" style="left:${startOffset * dayWidth}px; width:${duration * dayWidth}px; background:${notionDbStatusColor(i.status)};" title="${i.title || 'Untitled'} (${i.status || 'No status'}): ${i.date}${i.endDate ? ' – ' + i.endDate : ''}">
                      <span class="notion-db-timeline-handle" title="Drag to resize"></span>
                    </span>
                  </div>
                </div>`
              })
              .join('')}
          </div>
        </div>`
    }

    function renderNotionDbGallery(block, items) {
      const cards = items
        .map(
          (i) => `
        <div class="notion-db-gallery-card" data-notion-db-open-item="${block.id}:${i.id}" title="${i.title || 'Untitled'} — click to open">
          <div class="notion-db-gallery-cover" style="--notion-db-cover-color:${notionDbStatusColor(i.status)};" title="${i.status || 'No status'}"></div>
          <p class="notion-db-gallery-title">${i.title || 'Untitled'}</p>
          <div class="notion-db-gallery-meta">
            <span class="notion-db-status-pill" style="background:${notionDbStatusColor(i.status)};">${i.status}</span>
            ${i.tag ? `<span class="notion-db-tag-pill">${i.tag}</span>` : ''}
          </div>
        </div>`,
        )
        .join('')
      return `<div class="notion-db-gallery">
        ${cards}
        <button type="button" class="notion-db-gallery-add-card" data-notion-db-quick-add="${block.id}">${notionAddIcon()}<span>Add card</span></button>
      </div>`
    }

    function renderNotionDatabaseBlock(block, dragHandle, actions) {
      const items = block.items || []
      const view = block.view || 'table'
      let content
      if (view === 'board') content = renderNotionDbBoard(block, items)
      else if (view === 'list') content = renderNotionDbList(block, items)
      else if (view === 'calendar') content = renderNotionDbCalendar(block, items)
      else if (view === 'timeline') content = renderNotionDbTimeline(block, items)
      else if (view === 'gallery') content = renderNotionDbGallery(block, items)
      else if (view === 'chart') content = `<div class="notion-db-chart" data-notion-db-chart="${block.id}"></div>`
      else content = renderNotionDbTable(block)
      return `
        <div class="notion-block-wrap" id="notion-block-${block.id}">
          <div class="notion-block notion-block-database" data-notion-block-id="${block.id}">
            ${dragHandle}
            <div class="notion-db-views">
              ${NOTION_DB_VIEWS.map((v) => `<button type="button" class="notion-db-view-tab${view === v.key ? ' active' : ''}" data-notion-db-view="${block.id}:${v.key}">${v.label}</button>`).join('')}
            </div>
            <button type="button" class="notion-db-properties-btn" data-notion-db-properties-toggle="${block.id}">${notionSettingsIcon()}Properties</button>
            ${actions}
          </div>
          <div class="notion-db-content">${content}</div>
          ${notionPropertiesPanelHtml(block)}
        </div>`
    }

    function renderNotionEditor(page) {
      let numberedCounter = 0
      const blocksHtml = page.blocks
        .map((b, i) => {
          numberedCounter = b.type === 'numbered' ? numberedCounter + 1 : 0
          return renderNotionBlock(b, i, page.blocks.length, numberedCounter, page)
        })
        .join('')
      return `
        <div class="notion-editor-header">
          <div class="notion-icon-picker-wrap">
            <button type="button" class="notion-page-icon-btn" id="notion-page-icon-btn" aria-label="Change page icon" title="Change page icon">${page.icon || '📄'}</button>
            <div class="notion-icon-picker-menu" id="notion-icon-picker-menu" style="display:none;">
              ${NOTION_PAGE_ICONS.map((e) => `<button type="button" class="notion-icon-option" data-notion-icon-pick="${e}">${e}</button>`).join('')}
            </div>
          </div>
          <input type="text" class="notion-title-input" id="notion-title-input" value="${page.title || ''}" placeholder="Untitled" />
          <button type="button" class="icon-button" id="notion-delete-page-btn" aria-label="Delete page" title="Delete page">${notionTrashIcon()}</button>
        </div>
        <p class="notion-updated-note">Last edited ${page.updatedDate || page.createdDate || ''}</p>
        <div class="notion-blocks" id="notion-blocks">
          ${page.blocks.length === 0
            ? '<span class="section-empty">No content yet — add a block below, or type "/" in a block to pick a type.</span>'
            : blocksHtml}
        </div>
        <div class="notion-add-block-row">
          ${NOTION_BLOCK_TYPES.map((t) => `<button type="button" class="notion-add-block-btn" data-notion-add-block="${t.type}">${notionAddIcon()}${t.label}</button>`).join('')}
        </div>`
    }

    function renderNotionBody() {
      const allPages = Store.get().notionPages || []
      if (!notionActivePageId || !allPages.some((p) => p.id === notionActivePageId)) {
        notionActivePageId = allPages.length > 0 ? allPages[0].id : null
      }
      const term = notionPageSearch.trim().toLowerCase()
      const pages = term ? allPages.filter((p) => (p.title || 'Untitled').toLowerCase().includes(term)) : allPages
      const activePage = allPages.find((p) => p.id === notionActivePageId) || null
      return `
        <div class="detail-card">
          <div class="notion-workspace">
            <aside class="notion-sidebar">
              <button type="button" class="solid-action-button" id="notion-new-page-btn">${notionAddIcon()}New page</button>
              <div class="table-search-wrap" style="margin-bottom:0;">${emsSearchIcon()}<input type="text" id="notion-page-search" placeholder="Search pages" value="${notionPageSearch}" /></div>
              <div class="notion-page-list">
                ${pages.length === 0
                  ? '<span class="section-empty">No pages found</span>'
                  : pages
                      .map(
                        (p) => `
                  <button type="button" class="notion-page-item${p.id === notionActivePageId ? ' active' : ''}" data-notion-page="${p.id}">
                    <span class="notion-page-icon">${p.icon || '📄'}</span>
                    <span class="notion-page-title">${p.title || 'Untitled'}</span>
                  </button>`,
                      )
                      .join('')}
              </div>
            </aside>
            <div class="notion-editor">
              ${activePage ? renderNotionEditor(activePage) : '<span class="section-empty">No page selected. Create a page to get started.</span>'}
            </div>
          </div>
        </div>`
    }

    function wireNotionBody() {
      document.querySelectorAll('[data-notion-page]').forEach((btn) =>
        btn.addEventListener('click', () => {
          notionActivePageId = btn.getAttribute('data-notion-page')
          renderPage()
        }),
      )
      document.getElementById('notion-new-page-btn')?.addEventListener('click', () => {
        const page = Store.addNotionPage({ title: 'Untitled' })
        notionActivePageId = page.id
        renderPage()
      })
      document.getElementById('notion-page-search')?.addEventListener('input', (event) => {
        notionPageSearch = event.target.value
        notionRefocusSearch = true
        renderPage()
      })
      if (notionRefocusSearch) {
        notionRefocusSearch = false
        const searchInput = document.getElementById('notion-page-search')
        if (searchInput) {
          searchInput.focus()
          searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length)
        }
      }

      const titleInput = document.getElementById('notion-title-input')
      if (titleInput) {
        titleInput.addEventListener('input', () => {
          Store.updateNotionPage(notionActivePageId, { title: titleInput.value })
          const sidebarTitle = document.querySelector(`[data-notion-page="${notionActivePageId}"] .notion-page-title`)
          if (sidebarTitle) sidebarTitle.textContent = titleInput.value.trim() || 'Untitled'
        })
      }
      document.getElementById('notion-delete-page-btn')?.addEventListener('click', () => {
        const page = (Store.get().notionPages || []).find((p) => p.id === notionActivePageId)
        if (!page) return
        UI.confirm({
          message: `Delete <strong>${page.title || 'Untitled'}</strong>? This can't be undone.`,
          onConfirm: () => {
            Store.removeNotionPage(page.id)
            notionActivePageId = null
            renderPage()
            UI.toast('Page deleted successfully!')
          },
        })
      })

      document.getElementById('notion-page-icon-btn')?.addEventListener('click', (event) => {
        event.stopPropagation()
        const menu = document.getElementById('notion-icon-picker-menu')
        if (menu) menu.style.display = menu.style.display === 'none' ? '' : 'none'
      })
      document.querySelectorAll('[data-notion-icon-pick]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          Store.updateNotionPage(notionActivePageId, { icon: btn.getAttribute('data-notion-icon-pick') })
          renderPage()
        }),
      )
      if (!notionGlobalClickListenerAttached) {
        notionGlobalClickListenerAttached = true
        document.addEventListener('click', notionCloseFloatingPanels)
        // `position: fixed` panels don't move when their scroll-parent
        // scrolls (only the viewport, not the content, would move them) —
        // closing on any scroll, rather than tracking it, is simpler and
        // matches how most dropdowns behave. The capture phase is required
        // since scroll events don't bubble, so this is the only way to
        // hear scrolling on a nested container like .table-scroll.
        document.addEventListener('scroll', notionCloseFloatingPanels, true)
      }
      if (!notionLiveWidgetIntervalAttached) {
        notionLiveWidgetIntervalAttached = true
        setInterval(notionTickLiveWidgets, 1000)
        notionTickLiveWidgets()
      }

      // ---- Live widgets: clock (no config), Pomodoro timer, countdown, habit
      document.querySelectorAll('[data-notion-timer-preset]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [blockId, minutes] = btn.getAttribute('data-notion-timer-preset').split(':')
          Store.updateNotionBlock(notionActivePageId, blockId, { minutes: Number(minutes) })
          notionTimerState[blockId] = { remaining: Number(minutes) * 60, running: false }
          renderPage()
        }),
      )
      document.querySelectorAll('[data-notion-timer-toggle]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const blockId = btn.getAttribute('data-notion-timer-toggle')
          const state = notionTimerState[blockId]
          if (!state) return
          state.running = !state.running
          btn.textContent = state.running ? 'Pause' : 'Start'
        }),
      )
      document.querySelectorAll('[data-notion-timer-reset]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const blockId = btn.getAttribute('data-notion-timer-reset')
          const page = (Store.get().notionPages || []).find((p) => p.id === notionActivePageId)
          const block = page && page.blocks.find((b) => b.id === blockId)
          notionTimerState[blockId] = { remaining: (block ? block.minutes : 25) * 60, running: false }
          notionTickLiveWidgets()
          const wrap = document.getElementById('notion-block-' + blockId)
          const toggleBtn = wrap && wrap.querySelector('[data-notion-timer-toggle]')
          if (toggleBtn) toggleBtn.textContent = 'Start'
        }),
      )
      document.querySelectorAll('[data-notion-countdown-target]').forEach((input) =>
        input.addEventListener('change', () => {
          const blockId = input.getAttribute('data-notion-countdown-target')
          Store.updateNotionBlock(notionActivePageId, blockId, { target: input.value })
          const display = document.querySelector(`#notion-block-${blockId} [data-notion-countdown]`)
          if (display) {
            display.setAttribute('data-notion-countdown', input.value)
            display.textContent = notionFormatCountdown(input.value)
          }
        }),
      )
      document.querySelectorAll('[data-notion-habit-toggle]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [blockId, dayIndex] = btn.getAttribute('data-notion-habit-toggle').split(':')
          const page = (Store.get().notionPages || []).find((p) => p.id === notionActivePageId)
          const block = page && page.blocks.find((b) => b.id === blockId)
          if (!block) return
          const days = block.days && block.days.length === 7 ? block.days.slice() : NOTION_HABIT_DAYS.map(() => false)
          days[Number(dayIndex)] = !days[Number(dayIndex)]
          Store.updateNotionBlock(notionActivePageId, blockId, { days })
          btn.classList.toggle('done', days[Number(dayIndex)])
          btn.querySelector('.notion-habit-day-check').textContent = days[Number(dayIndex)] ? '✓' : ''
        }),
      )

      document.querySelectorAll('[data-notion-block-text]').forEach((input) => {
        input.addEventListener('input', () => {
          const blockId = input.getAttribute('data-notion-block-text')
          Store.updateNotionBlock(notionActivePageId, blockId, { text: input.value })
          const mathPreview = document.querySelector(`#notion-block-${blockId} .notion-math-preview`)
          if (mathPreview) mathPreview.innerHTML = notionRenderMath(input.value)
          const menu = document.querySelector(`[data-notion-slash-menu="${blockId}"]`)
          if (!menu) return
          if (input.value.startsWith('/')) {
            const filter = input.value.slice(1).toLowerCase()
            let anyVisible = false
            menu.querySelectorAll('[data-notion-slash-pick]').forEach((item) => {
              const match = item.getAttribute('data-label').includes(filter)
              item.style.display = match ? '' : 'none'
              if (match) anyVisible = true
            })
            menu.style.display = anyVisible ? '' : 'none'
          } else {
            menu.style.display = 'none'
          }
        })
        input.addEventListener('keydown', (event) => {
          const blockId = input.getAttribute('data-notion-block-text')
          if (event.key === 'Enter') {
            event.preventDefault()
            const page = (Store.get().notionPages || []).find((p) => p.id === notionActivePageId)
            if (!page) return
            const current = page.blocks.find((b) => b.id === blockId)
            const nextType = current && NOTION_CONTINUABLE_TYPES.includes(current.type) ? current.type : 'text'
            const nextData = nextType === 'todo' ? { type: nextType, text: '', checked: false } : { type: nextType, text: '' }
            Store.insertNotionBlockAfter(notionActivePageId, blockId, nextData)
            const updated = Store.get().notionPages.find((p) => p.id === notionActivePageId)
            const idx = updated.blocks.findIndex((b) => b.id === blockId)
            notionFocusBlockId = updated.blocks[idx + 1] ? updated.blocks[idx + 1].id : null
            renderPage()
          } else if (event.key === 'Backspace' && input.value === '') {
            event.preventDefault()
            const page = (Store.get().notionPages || []).find((p) => p.id === notionActivePageId)
            if (!page) return
            const idx = page.blocks.findIndex((b) => b.id === blockId)
            Store.removeNotionBlock(notionActivePageId, blockId)
            notionFocusBlockId = idx > 0 ? page.blocks[idx - 1].id : null
            renderPage()
          }
        })
      })

      document.querySelectorAll('[data-notion-slash-pick]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [blockId, type] = btn.getAttribute('data-notion-slash-pick').split(':')
          Store.updateNotionBlock(notionActivePageId, blockId, notionBlockData(type))
          notionFocusBlockId = blockId
          renderPage()
        }),
      )
      document.querySelectorAll('[data-notion-block-checked]').forEach((checkbox) =>
        checkbox.addEventListener('change', () => {
          const blockId = checkbox.getAttribute('data-notion-block-checked')
          Store.updateNotionBlock(notionActivePageId, blockId, { checked: checkbox.checked })
          checkbox.closest('.notion-block-todo')?.classList.toggle('checked', checkbox.checked)
        }),
      )
      // Image/video/embed URL: commit on blur/Enter (not every keystroke) so
      // pasting a link doesn't fight for focus, then re-render once to show
      // the preview immediately.
      document.querySelectorAll('[data-notion-block-url]').forEach((input) => {
        input.addEventListener('change', () => {
          Store.updateNotionBlock(notionActivePageId, input.getAttribute('data-notion-block-url'), { url: input.value })
          renderPage()
        })
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault()
            input.blur()
          }
        })
      })
      document.querySelectorAll('[data-notion-toc-jump]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const target = document.getElementById('notion-block-' + btn.getAttribute('data-notion-toc-jump'))
          if (!target) return
          target.scrollIntoView({ behavior: 'smooth', block: 'center' })
          target.classList.add('notion-block-highlight')
          setTimeout(() => target.classList.remove('notion-block-highlight'), 1200)
        }),
      )
      document.querySelectorAll('[data-notion-move]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [blockId, direction] = btn.getAttribute('data-notion-move').split(':')
          Store.moveNotionBlock(notionActivePageId, blockId, direction)
          renderPage()
        }),
      )
      document.querySelectorAll('[data-notion-delete-block]').forEach((btn) =>
        btn.addEventListener('click', () => {
          Store.removeNotionBlock(notionActivePageId, btn.getAttribute('data-notion-delete-block'))
          renderPage()
        }),
      )
      document.querySelectorAll('[data-notion-add-block]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const type = btn.getAttribute('data-notion-add-block')
          Store.addNotionBlock(notionActivePageId, notionBlockData(type))
          renderPage()
        }),
      )

      // ---- Database block: view switcher, item CRUD, calendar nav, chart
      document.querySelectorAll('[data-notion-db-view]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [blockId, view] = btn.getAttribute('data-notion-db-view').split(':')
          Store.updateNotionBlock(notionActivePageId, blockId, { view })
          renderPage()
        }),
      )
      document.querySelectorAll('[data-notion-db-add-item]').forEach((btn) =>
        btn.addEventListener('click', () => {
          Store.addNotionDatabaseItem(notionActivePageId, btn.getAttribute('data-notion-db-add-item'), { title: '', status: 'Not started', tag: '', date: '', endDate: '' })
          renderPage()
        }),
      )
      document.querySelectorAll('[data-notion-db-delete-item]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [blockId, itemId] = btn.getAttribute('data-notion-db-delete-item').split(':')
          Store.removeNotionDatabaseItem(notionActivePageId, blockId, itemId)
          renderPage()
        }),
      )
      document.querySelectorAll('[data-notion-db-field]').forEach((el) => {
        el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
          const [blockId, itemId, field] = el.getAttribute('data-notion-db-field').split(':')
          Store.updateNotionDatabaseItem(notionActivePageId, blockId, itemId, { [field]: el.value })
        })
      })

      // ---- Table view: dynamic columns (add/rename/delete properties)
      document.querySelectorAll('[data-notion-db-rename-col]').forEach((input) =>
        input.addEventListener('input', () => {
          const [blockId, propId] = input.getAttribute('data-notion-db-rename-col').split(':')
          Store.updateNotionDatabaseProperty(notionActivePageId, blockId, propId, { name: input.value })
        }),
      )
      document.querySelectorAll('[data-notion-db-properties-panel]').forEach((panel) =>
        panel.addEventListener('click', (event) => event.stopPropagation()),
      )
      document.querySelectorAll('[data-notion-db-properties-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const blockId = btn.getAttribute('data-notion-db-properties-toggle')
          document.querySelectorAll('[data-notion-db-properties-panel]').forEach((panel) => {
            const isTarget = panel.getAttribute('data-notion-db-properties-panel') === blockId
            if (isTarget && panel.style.display === 'none') {
              panel.style.display = ''
              notionPositionFloatingPanel(btn, panel)
            } else {
              panel.style.display = 'none'
            }
          })
        }),
      )
      document.querySelectorAll('[data-notion-db-delete-col]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const [blockId, propId] = btn.getAttribute('data-notion-db-delete-col').split(':')
          Store.removeNotionDatabaseProperty(notionActivePageId, blockId, propId)
          renderPage()
        }),
      )
      document.querySelectorAll('[data-notion-db-new-col-type]').forEach((select) =>
        select.addEventListener('change', () => {
          const blockId = select.getAttribute('data-notion-db-new-col-type')
          const optionsField = document.querySelector(`[data-notion-db-new-col-options-field="${blockId}"]`)
          if (optionsField) optionsField.style.display = select.value === 'select' ? '' : 'none'
        }),
      )
      document.querySelectorAll('[data-notion-db-add-col-confirm]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const blockId = btn.getAttribute('data-notion-db-add-col-confirm')
          const name = document.querySelector(`[data-notion-db-new-col-name="${blockId}"]`).value.trim()
          if (!name) return
          const type = document.querySelector(`[data-notion-db-new-col-type="${blockId}"]`).value
          const property = { name, type }
          if (type === 'select') {
            const raw = document.querySelector(`[data-notion-db-new-col-options="${blockId}"]`).value
            property.options = raw.split(',').map((s) => s.trim()).filter(Boolean)
            if (property.options.length === 0) property.options = ['Option 1']
          }
          Store.addNotionDatabaseProperty(notionActivePageId, blockId, property)
          renderPage()
        }),
      )

      // Shared "open the edit modal" click, used by Board/List/Calendar/
      // Timeline/Gallery. stopPropagation so it doesn't also trigger a
      // parent's own click handler (e.g. a calendar day cell's "add on
      // empty area" handler, or a draggable card's ancestor).
      document.querySelectorAll('[data-notion-db-open-item]').forEach((el) =>
        el.addEventListener('click', (event) => {
          event.stopPropagation()
          const [blockId, itemId] = el.getAttribute('data-notion-db-open-item').split(':')
          notionOpenItemModal(blockId, itemId)
        }),
      )
      // Shared "add + open modal immediately" used by List/Board/Gallery —
      // Table view uses [data-notion-db-add-item] instead, adding a blank
      // inline row since it already edits every property in place.
      document.querySelectorAll('[data-notion-db-quick-add]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [blockId, status] = btn.getAttribute('data-notion-db-quick-add').split(':')
          notionAddDbItemAndEdit(blockId, status ? { status } : {})
        }),
      )
      document.querySelectorAll('[data-notion-db-cal-nav]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const [blockId, dir] = btn.getAttribute('data-notion-db-cal-nav').split(':')
          const [y, m] = notionDbCalendarMonth[blockId].split('-').map(Number)
          const next = new Date(y, m - 1 + (dir === 'next' ? 1 : -1), 1)
          notionDbCalendarMonth[blockId] = next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0')
          renderPage()
        }),
      )
      // Calendar: click empty day space to add an item on that date; drag an
      // item chip onto another day to reschedule it (reuses notionDraggedDbCard,
      // the same "which item is being dragged" flag Board uses).
      document.querySelectorAll('[data-notion-db-cal-cell]').forEach((cell) => {
        cell.addEventListener('click', () => {
          const [blockId, dateStr] = cell.getAttribute('data-notion-db-cal-cell').split(':')
          notionAddDbItemAndEdit(blockId, { date: dateStr })
        })
        cell.addEventListener('dragover', (event) => {
          event.preventDefault()
          cell.classList.add('drag-over')
        })
        cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'))
        cell.addEventListener('drop', (event) => {
          event.preventDefault()
          cell.classList.remove('drag-over')
          if (!notionDraggedDbCard) return
          const [cardBlockId, itemId] = notionDraggedDbCard.split(':')
          const [cellBlockId, dateStr] = cell.getAttribute('data-notion-db-cal-cell').split(':')
          if (cellBlockId === cardBlockId) Store.updateNotionDatabaseItem(notionActivePageId, cardBlockId, itemId, { date: dateStr })
          notionDraggedDbCard = null
          renderPage()
        })
      })
      document.querySelectorAll('[data-notion-db-cal-item]').forEach((chip) => {
        chip.addEventListener('dragstart', (event) => {
          event.stopPropagation()
          notionDraggedDbCard = chip.getAttribute('data-notion-db-cal-item')
          chip.classList.add('dragging')
        })
        chip.addEventListener('dragend', (event) => {
          event.stopPropagation()
          chip.classList.remove('dragging')
        })
      })
      // Timeline: mouse-based drag (reschedule) and resize (change duration)
      // — needs pixel-level tracking, so it uses mousedown/move/up rather
      // than native HTML5 drag-and-drop.
      document.querySelectorAll('[data-notion-db-timeline-bar]').forEach((bar) => {
        bar.addEventListener('mousedown', (event) => {
          if (event.button !== 0) return
          const [blockId, itemId] = bar.getAttribute('data-notion-db-timeline-bar').split(':')
          const found = notionFindDbItem(blockId, itemId)
          if (!found) return
          event.preventDefault()
          const isHandle = event.target.classList.contains('notion-db-timeline-handle')
          notionTimelineDrag = {
            blockId, itemId, el: bar,
            mode: isHandle ? 'resize' : 'move',
            startX: event.clientX,
            originalDate: found.item.date,
            originalEndDate: found.item.endDate || '',
            originalLeft: parseFloat(bar.style.left) || 0,
            originalWidth: parseFloat(bar.style.width) || NOTION_TIMELINE_DAY_WIDTH,
            deltaDays: 0,
          }
          document.addEventListener('mousemove', notionTimelineOnMouseMove)
          document.addEventListener('mouseup', notionTimelineOnMouseUp)
        })
      })
      document.querySelectorAll('[data-notion-db-chart]').forEach((el) => {
        const blockId = el.getAttribute('data-notion-db-chart')
        if (notionDbChartInstances[blockId]) {
          try { notionDbChartInstances[blockId].destroy() } catch (e) { /* already gone */ }
          delete notionDbChartInstances[blockId]
        }
        const page = (Store.get().notionPages || []).find((p) => p.id === notionActivePageId)
        const block = page && page.blocks.find((b) => b.id === blockId)
        if (!block) return
        const counts = NOTION_DB_STATUSES.map((s) => (block.items || []).filter((i) => i.status === s).length)
        const chart = new ApexCharts(el, {
          chart: { type: 'bar', height: 260, toolbar: { show: false } },
          series: [{ name: 'Items', data: counts }],
          xaxis: { categories: NOTION_DB_STATUSES },
          colors: ['#7c3aed'],
          plotOptions: { bar: { borderRadius: 6, columnWidth: '45%' } },
          dataLabels: { enabled: true },
        })
        chart.render()
        notionDbChartInstances[blockId] = chart
      })

      // Board view: drag a card onto another status column to reassign it.
      // stopPropagation everywhere so this nested drag never bubbles into
      // the outer block-reordering drag handlers below.
      document.querySelectorAll('[data-notion-db-card]').forEach((el) => {
        el.addEventListener('dragstart', (event) => {
          event.stopPropagation()
          notionDraggedDbCard = el.getAttribute('data-notion-db-card')
          el.classList.add('dragging')
        })
        el.addEventListener('dragend', (event) => {
          event.stopPropagation()
          el.classList.remove('dragging')
        })
      })
      document.querySelectorAll('[data-notion-db-board-col]').forEach((col) => {
        col.addEventListener('dragover', (event) => {
          event.preventDefault()
          event.stopPropagation()
          col.classList.add('drag-over')
        })
        col.addEventListener('dragleave', (event) => {
          event.stopPropagation()
          col.classList.remove('drag-over')
        })
        col.addEventListener('drop', (event) => {
          event.preventDefault()
          event.stopPropagation()
          col.classList.remove('drag-over')
          if (!notionDraggedDbCard) return
          const [cardBlockId, itemId] = notionDraggedDbCard.split(':')
          const [colBlockId, status] = col.getAttribute('data-notion-db-board-col').split(':')
          if (colBlockId === cardBlockId) Store.updateNotionDatabaseItem(notionActivePageId, cardBlockId, itemId, { status })
          notionDraggedDbCard = null
          renderPage()
        })
      })

      // Only the drag handle icon is draggable="true" (not the whole row) —
      // otherwise a browser can hijack a click-drag started inside a block's
      // own text input as "drag the block" instead of "select this text",
      // since the drag surface would overlap the text itself. The block row
      // stays a plain (non-draggable) drop target for dragover/drop.
      document.querySelectorAll('.notion-drag-handle').forEach((handle) => {
        handle.addEventListener('dragstart', () => {
          const block = handle.closest('.notion-block')
          notionDraggedBlockId = block && block.getAttribute('data-notion-block-id')
          block && block.classList.add('dragging')
        })
        handle.addEventListener('dragend', () => {
          const block = handle.closest('.notion-block')
          block && block.classList.remove('dragging')
        })
      })
      document.querySelectorAll('.notion-block').forEach((el) => {
        el.addEventListener('dragover', (event) => {
          if (!notionDraggedBlockId) return
          event.preventDefault()
          el.classList.add('drag-over')
        })
        el.addEventListener('dragleave', () => el.classList.remove('drag-over'))
        el.addEventListener('drop', (event) => {
          event.preventDefault()
          el.classList.remove('drag-over')
          const targetId = el.getAttribute('data-notion-block-id')
          if (!notionDraggedBlockId || notionDraggedBlockId === targetId) return
          const page = (Store.get().notionPages || []).find((p) => p.id === notionActivePageId)
          if (!page) return
          const ids = page.blocks.map((b) => b.id)
          const fromIdx = ids.indexOf(notionDraggedBlockId)
          if (fromIdx === -1) return
          ids.splice(fromIdx, 1)
          const toIdx = ids.indexOf(targetId)
          ids.splice(toIdx, 0, notionDraggedBlockId)
          Store.reorderNotionBlocks(notionActivePageId, ids)
          notionDraggedBlockId = null
          renderPage()
        })
      })

      if (notionFocusBlockId) {
        const focusEl = document.querySelector(`[data-notion-block-text="${notionFocusBlockId}"]`)
        if (focusEl) {
          focusEl.focus()
          focusEl.setSelectionRange(focusEl.value.length, focusEl.value.length)
        }
        notionFocusBlockId = null
      }
    }

    // ------------------------------------------------------------- EMS
    // EMS is the other built-in system application (alongside PMS above):
    // its detail page shows TOD grid readings, a meter list, and monthly
    // energy data instead of the generic device/asset/metadata summary.
    const EMS_PER_PAGE = 10
    const EMS_TOD_SLOTS = ['t1', 't2', 't3', 't4', 't5']
    const EMS_TAB_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
    const EMS_TABS = [
      { key: 'meters', label: 'Meter List' },
      { key: 'todgrid', label: 'TOD Grid' },
      { key: 'energy', label: 'Energy Data' },
    ]
    const EMS_METER_FIELD_IDS = {
      name: 'ems-meter-name',
      meterId: 'ems-meter-id',
      location: 'ems-meter-location',
      partNumber: 'ems-meter-part-number',
      model: 'ems-meter-model',
      modelNumber: 'ems-meter-model-number',
      unit: 'ems-meter-unit',
      vpnMin: 'ems-meter-vpn-min',
      vpnMax: 'ems-meter-vpn-max',
      vppMin: 'ems-meter-vpp-min',
      vppMax: 'ems-meter-vpp-max',
      iMin: 'ems-meter-i-min',
      iMax: 'ems-meter-i-max',
      kwMin: 'ems-meter-kw-min',
      kwMax: 'ems-meter-kw-max',
      kvaMin: 'ems-meter-kva-min',
      kvaMax: 'ems-meter-kva-max',
      freqMin: 'ems-meter-freq-min',
      freqMax: 'ems-meter-freq-max',
    }

    }

    function emsPaginate(rows, page, perPage) {
      const totalPages = Math.max(1, Math.ceil(rows.length / perPage))
      const clampedPage = Math.min(Math.max(1, page), totalPages)
      const start = (clampedPage - 1) * perPage
      return { pageRows: rows.slice(start, start + perPage), totalPages, page: clampedPage }
    }

    function emsPaginationHtml(page, totalPages, prefix) {
      const pages = Array.from({ length: totalPages }, (_, i) => i + 1)
      return `
        <div class="pagination">
          <button type="button" class="page-btn" data-ems-page="${prefix}:${page - 1}" ${page <= 1 ? 'disabled' : ''}>Previous</button>
          ${pages.map((p) => `<button type="button" class="page-btn${p === page ? ' active' : ''}" data-ems-page="${prefix}:${p}">${p}</button>`).join('')}
          <button type="button" class="page-btn" data-ems-page="${prefix}:${page + 1}" ${page >= totalPages ? 'disabled' : ''}>Next</button>
        </div>`
    }
