          ${pages.map((p) => `<button type="button" class="page-btn${p === page ? ' active' : ''}" data-cms-page="${p}">${p}</button>`).join('')}
          <button type="button" class="page-btn" data-cms-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''}>Next</button>
        </div>`
    }

    function cmsMachineStatusPill(machine) {
      return `<span class="status-pill status-${machine.connected ? 'active' : 'offline'}" title="${machine.connected ? 'Online' : 'Offline'}">${machine.connected ? 'Online' : 'Offline'}</span>`
    }

    function cmsEnergyIcon() {
      return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    }
    function cmsCostIcon() {
      return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 8h4a2 2 0 1 1 0 4H9m0-4v9m0-5h5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    }
    function cmsActiveIcon() {
      return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    }
    function cmsIdleIcon() {
      return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg>'
    }

    // ------------------------------------------------------- CMS: machine
    function renderCmsMachinePanel() {
      const term = cmsMachineSearch.trim().toLowerCase()
      const all = Store.get().cmsMachines
      const filtered = term
        ? all.filter((m) => m.name.toLowerCase().includes(term) || m.machineId.toLowerCase().includes(term) || (m.line || '').toLowerCase().includes(term))
        : all
      const { pageRows, totalPages, page } = emsPaginate(filtered, cmsMachinePage, CMS_PER_PAGE)
      cmsMachinePage = page
      const rowsHtml =
        pageRows.length === 0
          ? '<tr><td colspan="9" class="empty-table-note">No machines match your search.</td></tr>'
          : pageRows
              .map(
                (m, i) => `
        <tr>
          <td>${(page - 1) * CMS_PER_PAGE + i + 1}</td>
          <td>${m.machineId}</td>
          <td>${m.deviceId || '—'}</td>
          <td>${m.name}</td>
          <td>${m.manufacturer || '—'}</td>
          <td>${m.model || '—'}</td>
          <td>${m.line || '—'}</td>
          <td>${cmsMachineStatusPill(m)}</td>
          <td>
            <button type="button" class="ems-row-action-btn" data-cms-machine-edit="${m.id}" aria-label="Edit machine" title="Edit machine">${emsEditIcon()}</button>
            <button type="button" class="ems-row-action-btn" data-cms-machine-delete="${m.id}" aria-label="Delete machine" title="Delete machine">${emsDeleteIcon()}</button>
            <button type="button" class="ems-row-action-btn" data-cms-machine-view="${m.id}" aria-label="Open machine dashboard" title="Open machine dashboard">${emsViewIcon()}</button>
          </td>
        </tr>`,
              )
              .join('')
      return `
        <div class="detail-toolbar-row">
          <div class="table-search-wrap" style="margin-bottom:0;">${emsSearchIcon()}<input type="text" id="cms-machine-search" placeholder="Search machines" value="${cmsMachineSearch}" /></div>
          <div class="detail-toolbar-actions">
            <button type="button" class="solid-action-button" id="cms-machine-add-btn">${emsAddIcon()}Add</button>
          </div>
        </div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>S.No</th><th>Machine ID</th><th>Device ID</th><th>Name</th><th>Manufacturer</th><th>Model</th><th>Line</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        ${cmsPaginationHtml(page, totalPages)}`
    }

    function cmsOpenMachineAdd() {
      document.getElementById('cms-machine-modal-title').textContent = 'Add Machine'
      document.getElementById('cms-machine-save-btn').textContent = 'Add Machine'
      document.getElementById('cms-machine-form').dataset.editingId = ''
      Object.values(CMS_MACHINE_FIELD_IDS).forEach((id) => {
        document.getElementById(id).value = ''
      })
      UI.openModal('cms-machine-modal')
    }

    function cmsOpenMachineEdit(id) {
      const machine = Store.get().cmsMachines.find((m) => m.id === id)
      if (!machine) return
      document.getElementById('cms-machine-modal-title').textContent = 'Edit Machine'
      document.getElementById('cms-machine-save-btn').textContent = 'Save changes'
      document.getElementById('cms-machine-form').dataset.editingId = id
      Object.entries(CMS_MACHINE_FIELD_IDS).forEach(([field, elId]) => {
        document.getElementById(elId).value = machine[field] ?? ''
      })
      UI.openModal('cms-machine-modal')
    }

    function wireCmsMachinePanel() {
      document.getElementById('cms-machine-search').addEventListener('input', (event) => {
        cmsMachineSearch = event.target.value
        cmsMachinePage = 1
        renderPage()
      })
      document.getElementById('cms-machine-add-btn').addEventListener('click', cmsOpenMachineAdd)
      document.querySelectorAll('[data-cms-machine-edit]').forEach((btn) => btn.addEventListener('click', () => cmsOpenMachineEdit(btn.getAttribute('data-cms-machine-edit'))))
      document.querySelectorAll('[data-cms-machine-delete]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-cms-machine-delete')
          const machine = Store.get().cmsMachines.find((m) => m.id === id)
          UI.confirm({
            message: `Delete "${machine ? machine.name : 'this machine'}"? This can't be undone.`,
            onConfirm: () => {
              Store.removeCmsMachine(id)
              UI.toast('Machine deleted successfully!')
              renderPage()
            },
          })
        }),
      )
      document.querySelectorAll('[data-cms-machine-view]').forEach((btn) =>
        btn.addEventListener('click', () => {
          window.location.href = 'cms-machine-dashboard.html#' + btn.getAttribute('data-cms-machine-view')
        }),
      )
      document.querySelectorAll('[data-cms-page]').forEach((btn) =>
        btn.addEventListener('click', () => {
          cmsMachinePage = Number(btn.getAttribute('data-cms-page'))
          renderPage()
        }),
      )
    }

    // ----------------------------------------------------- CMS: dashboard
    // A bespoke crane-fleet overview (quick stats, OEE-style gauges, a
    // state filter, and per-crane cards) — built from this project's own
    // detail-card/status-pill/count-tile components, not a copy of any
    // reference screenshot's color scheme.
    let cmsDashboardStateFilter = 'all'
    const CMS_STATE_FILTERS = [
      { key: 'all', label: 'All Cranes' },
      { key: 'working', label: 'Working' },
      { key: 'idle', label: 'Idle' },
      { key: 'off', label: 'Off' },
      { key: 'overload', label: 'Overload' },
      { key: 'errors', label: 'Errors' },
    ]
    const cmsOeeChartInstances = {}

    function cmsMachineState(machine) {
      if (!machine.connected) return 'off'
      if ((machine.alerts || []).length > 0) return 'errors'
      const pct = machine.maxCapacity ? (machine.currentLoad / machine.maxCapacity) * 100 : 0
      if (pct >= (machine.upperThreshold || 95)) return 'overload'
      if ((machine.currentLoad || 0) > 0 || (machine.power || 0) > 0) return 'working'
      return 'idle'
    }

    function cmsStatePill(state) {
      const variant = state === 'working' ? 'active' : state === 'idle' ? 'maintenance' : 'suspended'
      return `<span class="status-pill status-${variant}" title="${state.toUpperCase()}">${state.toUpperCase()}</span>`
    }

    const CMS_STATE_COLORS = { working: '#16a34a', idle: '#d97706', off: '#dc2626', overload: '#dc2626', errors: '#7e22ce' }

    function renderCmsDashboardPanel() {
      const all = Store.get().cmsMachines
      const withState = all.map((m) => ({ machine: m, state: cmsMachineState(m) }))
      const activeCount = withState.filter((s) => s.state === 'working').length
      const idleCount = withState.filter((s) => s.state === 'idle').length
      const connectedCount = all.filter((m) => m.connected).length
      const todayEnergy = all.reduce((sum, m) => sum + (m.power || 0), 0)
      const todayCost = all.reduce((sum, m) => sum + (m.power || 0) * (m.energyCost || 0), 0)
      const availability = all.length ? (connectedCount / all.length) * 100 : 0
      const productivity = connectedCount ? (activeCount / connectedCount) * 100 : 0
      const oee = (availability / 100) * (productivity / 100) * 100

      const filtered = cmsDashboardStateFilter === 'all' ? withState : withState.filter((s) => s.state === cmsDashboardStateFilter)

      return `
        <div class="detail-overview-row">
          <div class="detail-card detail-overview-card">
            <h2><span class="section-icon">${iconSvg('report')}</span>Quick Stats<a href="#" id="cms-refresh-btn" style="margin-left:auto;font-size:0.78rem;font-weight:700;text-decoration:none;">Refresh</a></h2>
            <div class="cms-quickstat-grid">
              <div class="cms-quickstat-card" style="--cms-stat-accent:#7c3aed;--cms-stat-icon-bg:#ede9fe;" title="Total energy consumed across all cranes today">
                <span class="cms-quickstat-icon">${cmsEnergyIcon()}</span>
                <span><p class="cms-quickstat-value">${todayEnergy.toFixed(1)}<small>kWh</small></p><p class="cms-quickstat-label">Today's Energy</p></span>
              </div>
              <div class="cms-quickstat-card" style="--cms-stat-accent:#0284c7;--cms-stat-icon-bg:#e0f2fe;" title="Total energy cost across all cranes today">
                <span class="cms-quickstat-icon">${cmsCostIcon()}</span>
                <span><p class="cms-quickstat-value">${todayCost.toFixed(1)}<small>Rs</small></p><p class="cms-quickstat-label">Today's Cost</p></span>
              </div>
              <div class="cms-quickstat-card" style="--cms-stat-accent:#16a34a;--cms-stat-icon-bg:#dcfce7;" title="Cranes currently working, out of all cranes">
                <span class="cms-quickstat-icon">${cmsActiveIcon()}</span>
                <span><p class="cms-quickstat-value">${activeCount}<small>/ ${all.length}</small></p><p class="cms-quickstat-label">Active Cranes</p></span>
              </div>
              <div class="cms-quickstat-card" style="--cms-stat-accent:#d97706;--cms-stat-icon-bg:#fef3c7;" title="Cranes currently idle, out of all cranes">
                <span class="cms-quickstat-icon">${cmsIdleIcon()}</span>
                <span><p class="cms-quickstat-value">${idleCount}<small>/ ${all.length}</small></p><p class="cms-quickstat-label">Idle Cranes</p></span>
              </div>
            </div>
          </div>
          <div class="detail-card detail-overview-stats">
            <h2><span class="section-icon">${iconSvg('dashboard')}</span>Overall Equipment Effectiveness</h2>
            <div class="cms-oee-grid">
              <div class="cms-oee-item">
                <div id="cms-oee-chart"></div>
                <h4 style="color:#4f46e5;">OEE</h4>
                <p>Overall equipment effectiveness</p>
              </div>
              <div class="cms-oee-item">
                <div id="cms-availability-chart"></div>
                <h4 style="color:#0ea5e9;">Availability</h4>
                <p>Uptime vs planned production</p>
              </div>
              <div class="cms-oee-item">
                <div id="cms-productivity-chart"></div>
                <h4 style="color:#2563eb;">Productivity</h4>
                <p>Speed vs ideal cycle time</p>
              </div>
            </div>
          </div>
        </div>

        <div class="cms-state-filter-row">
          ${CMS_STATE_FILTERS.map((f) => `<button type="button" class="cms-filter-chip${cmsDashboardStateFilter === f.key ? ' active' : ''}" data-cms-state-filter="${f.key}">${f.label}</button>`).join('')}
        </div>

        <div class="cms-crane-grid">
          ${
            filtered.length === 0
              ? '<p class="empty-table-note">No cranes match this filter.</p>'
              : filtered
                  .map(
                    ({ machine: m, state }) => `
          <div class="detail-card cms-crane-card" data-cms-crane-id="${m.id}" role="button" tabindex="0" title="Open ${m.name} dashboard" style="--cms-card-accent:${CMS_STATE_COLORS[state]};">
            <div class="cms-crane-card-header">
              <span class="cms-status-dot cms-status-dot-${state}" title="${state.charAt(0).toUpperCase() + state.slice(1)}"></span>
              <h3>${m.name}</h3>
              ${cmsStatePill(state)}
            </div>
            <span class="cms-crane-id-badge">ID: ${m.machineId}</span>
            <div class="cms-load-strip">
              <div class="cms-load-strip-track"><div class="cms-load-strip-fill" style="width:${cmsLoadPct(m)}%;background:${CMS_STATE_COLORS[state]};"></div></div>
              <div class="cms-load-strip-label"><span>${m.currentLoad} kg load</span><span>${m.maxCapacity} kg cap.</span></div>
            </div>
            <div class="detail-meta-grid" style="margin-top:0.85rem;">
              <div class="detail-meta-item"><p class="label">Power</p><p class="value no-transform">${m.power} kW</p></div>
              <div class="detail-meta-item"><p class="label">Current Operation</p><p class="value">${m.currentOperation || '—'}</p></div>
            </div>
            <div class="cms-crane-card-footer">
              <span>${m.lastUpdated || '—'}</span>
              <span class="cms-details-link">Details &rarr;</span>
            </div>
          </div>`,
                  )
                  .join('')
          }
        </div>`
    }

    function cmsLoadPct(machine) {
      return machine.maxCapacity ? Math.max(0, Math.min(100, (machine.currentLoad / machine.maxCapacity) * 100)) : 0
    }

    function cmsRenderOeeGauge(elId, pct, color) {
      if (cmsOeeChartInstances[elId]) {
        cmsOeeChartInstances[elId].destroy()
        delete cmsOeeChartInstances[elId]
      }
      const el = document.querySelector('#' + elId)
      if (!el) return
      cmsOeeChartInstances[elId] = new ApexCharts(el, {
        chart: { type: 'radialBar', height: 170, toolbar: { show: false } },
        series: [Math.round(pct)],
        colors: [color],
        // A round line cap draws a filled dot at the arc's start point even
        // at 0% (a zero-length "round" stroke is still a circle) — floating
        // above the track with nothing connecting it. Flat caps avoid that.
        stroke: { lineCap: 'butt' },
        plotOptions: {
          radialBar: {
            hollow: { size: '62%' },
            track: { background: '#e7e5e4' },
            dataLabels: { name: { show: false }, value: { show: true, fontSize: '1.15rem', fontWeight: 800, color: '#1c1917', formatter: (v) => v + '%' } },
          },
        },
      })
      cmsOeeChartInstances[elId].render()
    }

    function wireCmsDashboardPanel() {
      const all = Store.get().cmsMachines
      const withState = all.map((m) => ({ machine: m, state: cmsMachineState(m) }))
      const activeCount = withState.filter((s) => s.state === 'working').length
      const connectedCount = all.filter((m) => m.connected).length
      const availability = all.length ? (connectedCount / all.length) * 100 : 0
      const productivity = connectedCount ? (activeCount / connectedCount) * 100 : 0
      const oee = (availability / 100) * (productivity / 100) * 100
      cmsRenderOeeGauge('cms-oee-chart', oee, '#4f46e5')
      cmsRenderOeeGauge('cms-availability-chart', availability, '#0ea5e9')
      cmsRenderOeeGauge('cms-productivity-chart', productivity, '#2563eb')

      document.getElementById('cms-refresh-btn').addEventListener('click', (event) => {
        event.preventDefault()
        renderPage()
      })
      document.querySelectorAll('[data-cms-state-filter]').forEach((btn) =>
        btn.addEventListener('click', () => {
          cmsDashboardStateFilter = btn.getAttribute('data-cms-state-filter')
          renderPage()
        }),
      )
      document.querySelectorAll('[data-cms-crane-id]').forEach((card) => {
        const go = () => {
          window.location.href = 'cms-machine-dashboard.html#' + card.getAttribute('data-cms-crane-id')
        }
        card.addEventListener('click', go)
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault()
            go()
          }
        })
      })
    }

    function renderCmsBody() {
      const panel = cmsActiveTab === 'machine' ? renderCmsMachinePanel() : renderCmsDashboardPanel()
      return `
        <div class="detail-tabs">
          ${CMS_TABS.map((t) => `<button type="button" class="detail-tab-button${cmsActiveTab === t.key ? ' active' : ''}" data-cms-tab="${t.key}">${t.label}</button>`).join('')}
        </div>
        ${cmsActiveTab === 'machine' ? `<div class="detail-card">${panel}</div>` : panel}`
    }

    function wireCmsBody() {
      document.querySelectorAll('[data-cms-tab]').forEach((btn) =>
        btn.addEventListener('click', () => {
          cmsActiveTab = btn.getAttribute('data-cms-tab')
          renderPage()
        }),
      )
      if (cmsActiveTab === 'machine') wireCmsMachinePanel()
      else wireCmsDashboardPanel()
    }

    document.getElementById('cms-machine-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const data = {}
      Object.entries(CMS_MACHINE_FIELD_IDS).forEach(([field, elId]) => {
        const raw = document.getElementById(elId).value
        data[field] = CMS_MACHINE_NUMERIC_FIELDS.includes(field) ? (raw === '' ? 0 : Number(raw)) : raw.trim()
      })
      if (!data.name || !data.machineId) return
      const editingId = this.dataset.editingId
      if (editingId) {
        Store.updateCmsMachine(editingId, data)
        UI.toast('Machine updated successfully!')
      } else {
        Store.addCmsMachine(data)
        UI.toast('Machine added successfully!')
      }
      UI.closeModal('cms-machine-modal')
      renderPage()
    })

    function renderPage() {
      const app = getApp()
      const root = document.getElementById('app-detail-root')
      if (!app) {
        root.innerHTML = `
          <div class="not-found-block">
            <h2>Application not found</h2>
            <p>It may have been deleted.</p>
            <a class="detail-back-link" href="applications.html">Back to Applications</a>
          </div>`
        return
      }

      const isPms = app.name === 'PMS'
      const isEms = app.name === 'EMS'
      const isNotion = app.name === 'Notion'
      const isCms = app.name === 'CMS'
      const isCustomDashboard = !isPms && !isEms && !isNotion && !isCms && Boolean(app.hasCustomDashboard)
      const data = Store.get()
      const devices = (app.deviceIds || []).map((id) => data.devices.find((d) => d.id === id)).filter(Boolean)
      const assets = (app.assetIds || []).map((id) => data.assets.find((a) => a.id === id)).filter(Boolean)

      root.innerHTML = `
        <a class="detail-back-link" href="applications.html">&larr; Back to Applications</a>
        <div class="page-header">
          <div>
            <h1 class="page-title">${app.name}${app.isDefault ? ' <span class="default-profile-badge" title="Built-in default application">Default</span>' : ''}</h1>
            <p class="page-subtitle">${app.description || 'No description provided.'}</p>
          </div>
          <div class="page-header-actions">
            <span class="status-pill status-${app.status}" title="${app.status}">${app.status}</span>
            <button type="button" class="modal-button secondary" id="toggle-status-btn">${app.status === 'active' ? 'Suspend' : 'Activate'}</button>
            <button type="button" class="modal-button secondary" id="edit-app-btn">Edit</button>
            ${app.isDefault ? '' : '<button type="button" class="modal-button danger" id="delete-app-btn">Delete</button>'}
          </div>
        </div>

        ${isPms ? renderPmsBody() : isEms ? renderEmsBody() : isNotion ? renderNotionBody() : isCms ? renderCmsBody() : isCustomDashboard ? renderCustomDashboardBody() : renderGenericBody(app, devices, assets)}`

      document.getElementById('toggle-status-btn').addEventListener('click', () => {
        Store.toggleApplicationStatus(app.id)
        UI.toast(`"${app.name}" status updated successfully!`)
        renderPage()
      })
      document.getElementById('edit-app-btn').addEventListener('click', openEdit)
      document.getElementById('delete-app-btn')?.addEventListener('click', confirmDelete)
      if (isPms) wirePmsBody()
      else if (isEms) wireEmsBody()
      else if (isNotion) wireNotionBody()
      else if (isCms) wireCmsBody()
      else if (isCustomDashboard) wireCustomDashboardBody(app)
      else wireGenericBody()
      // The palette FAB lives outside #app-detail-root (see the modal/FAB
      // markup near the bottom of <body>) so it survives this rewrite —
      // only show it for a "Custom dashboard" application's own page.
      document.getElementById('widget-palette-fab').classList.toggle('hidden', !isCustomDashboard)
    }

    renderPage()
  </script>
</body>
</html>
