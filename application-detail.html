<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <title>Application — Univa</title>
  <style>
    .detail-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .detail-card h2 {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0 0 1.1rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .section-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: var(--accent-soft);
      color: var(--accent);
      flex-shrink: 0;
    }
    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.1rem 1rem;
    }
    .detail-meta-item .label {
      margin: 0 0 0.3rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .detail-meta-item .value {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      text-transform: capitalize;
    }
    .detail-overview-card,
    .detail-overview-stats {
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border-color: var(--accent-soft-border);
    }
    .detail-overview-card::before,
    .detail-overview-stats::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
    }
    .count-tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.85rem;
    }
    .count-tile {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.95rem 1rem;
      border-radius: 14px;
      background: var(--tile-bg);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .count-tile:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .count-tile-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--tile-icon-bg);
      color: var(--tile-icon-color);
      flex-shrink: 0;
    }
    .count-tile-value {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
    }
    .count-tile-label {
      margin: 0.15rem 0 0;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-subtle);
    }
    .count-tile-breakdown {
      margin: 0.2rem 0 0;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-faint);
    }
    .detail-tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.85rem;
    }
    .detail-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      aspect-ratio: 1 / 1;
      padding: 1rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    a.detail-tile:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
      border-color: var(--accent-soft-border);
    }
    .detail-tile-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .detail-tile-name {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }
    .detail-tile-sub {
      margin: 0;
      font-size: 0.78rem;
      color: var(--text-subtle);
      word-break: break-word;
    }
    .detail-subheading {
      margin: 0 0 0.75rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-subtle);
    }
    .detail-subheading:not(:first-child) {
      margin-top: 1.5rem;
    }
    .not-found-block {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-subtle);
    }

    .detail-overview-row {
      display: flex;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      align-items: stretch;
    }
    .detail-overview-card,
    .detail-overview-stats {
      flex: 1 1 0;
      min-width: 0;
      margin-bottom: 0;
    }
    .detail-meta-item .value.with-icon {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-transform: capitalize;
    }
    .detail-meta-item .value.no-transform {
      text-transform: none;
    }
    @media (max-width: 720px) {
      .detail-overview-row {
        flex-direction: column;
      }
      .detail-overview-card,
      .detail-overview-stats {
        flex: 1 1 auto;
      }
    }

    .detail-tabs {
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin: 0 0 1.25rem;
    }
    .detail-tab-button {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 0.1rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-faint);
      cursor: pointer;
    }
    .detail-tab-button.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* -------------------------------------------------- PMS / EMS
       Both built-in applications reuse the page's existing .detail-tabs /
       .detail-card / .data-table / .table-scroll components (same ones the
       generic tabs above use) — these rules only cover the bits those
       components don't already provide. */
    .detail-toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .detail-toolbar-row:last-child {
      margin-bottom: 0;
    }
    .detail-toolbar-actions,
    .detail-toolbar-filters {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .detail-toolbar-row input,
    .detail-toolbar-row select {
      width: auto;
    }
    .total-row td {
      font-weight: 700;
      color: var(--text);
    }
    .highlight-cell {
      font-weight: 700;
      color: var(--accent-strong-text);
    }
    .ems-cell-btn {
      border: none;
      background: none;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      color: var(--accent-strong-text);
      font-weight: 600;
      cursor: pointer;
    }
    .ems-cell-btn:hover {
      background: var(--accent-soft);
    }
    .ems-row-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: none;
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 6px;
    }
    .ems-row-action-btn:hover {
      background: var(--surface-alt);
      color: var(--accent-strong-text);
    }

    /* ----------------------------------------------------------------- CMS
       Machine management table reuses the EMS row-action/table styles above;
       the Dashboard tab is a bespoke crane-fleet overview built from the
       same detail-card/status-pill components used everywhere else on this
       page, plus its own accent-bordered quick-stat cards below (matching
       the Key Metrics cards on the per-machine dashboard page). */
    .cms-quickstat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
    }
    .cms-quickstat-card {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 1rem 1.1rem;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--cms-stat-accent, var(--border));
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cms-quickstat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .cms-quickstat-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--cms-stat-icon-bg, var(--surface-alt));
      color: var(--cms-stat-accent, var(--text-secondary));
      flex-shrink: 0;
    }
    .cms-quickstat-value {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.1;
    }
    .cms-quickstat-value small {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-faint);
      margin-left: 0.25rem;
    }
    .cms-quickstat-label {
      margin: 0.3rem 0 0;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-subtle);
    }
    .cms-oee-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .cms-oee-item {
      position: relative;
      text-align: center;
      padding-top: 0.25rem;
    }
    .cms-oee-item + .cms-oee-item::before {
      content: '';
      position: absolute;
      left: -0.5rem;
      top: 12%;
      bottom: 28%;
      width: 1px;
      background: var(--border);
    }
    .cms-oee-item h4 {
      margin: 0.5rem 0 0.15rem;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .cms-oee-item p {
      margin: 0;
      font-size: 0.7rem;
      color: var(--text-faint);
    }
    .cms-state-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin: 0 0 1.25rem;
    }
    .cms-filter-chip {
      padding: 0.5rem 1.15rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }
    .cms-filter-chip:hover {
      background: var(--surface-alt);
      transform: translateY(-1px);
    }
    .cms-filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.3);
    }
    .cms-filter-chip[data-cms-state-filter='working'].active {
      background: #16a34a;
      border-color: #16a34a;
    }
    .cms-filter-chip[data-cms-state-filter='idle'].active {
      background: #d97706;
      border-color: #d97706;
    }
    .cms-filter-chip[data-cms-state-filter='off'].active {
      background: #57534e;
      border-color: #57534e;
    }
    .cms-filter-chip[data-cms-state-filter='overload'].active {
      background: #dc2626;
      border-color: #dc2626;
    }
    .cms-filter-chip[data-cms-state-filter='errors'].active {
      background: #7e22ce;
      border-color: #7e22ce;
    }
    .cms-crane-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.1rem;
    }
    .cms-crane-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cms-crane-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--cms-card-accent, var(--accent));
    }
    .cms-crane-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .cms-crane-card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .cms-crane-card-header h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      flex: 1;
    }
    .cms-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
    }
    .cms-status-dot-working {
      background: #16a34a;
      color: #16a34a;
    }
    .cms-status-dot-idle {
      background: #d97706;
      color: #d97706;
    }
    .cms-status-dot-off,
    .cms-status-dot-overload {
      background: #dc2626;
      color: #dc2626;
    }
    .cms-status-dot-errors {
      background: #7e22ce;
      color: #7e22ce;
    }
    .cms-crane-id-badge {
      display: inline-flex;
      margin-top: 0.4rem;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      background: var(--surface-alt);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
    }
    .cms-load-strip {
      margin-top: 0.9rem;
    }
    .cms-load-strip-track {
      height: 6px;
      border-radius: 999px;
      background: var(--surface-alt);
      overflow: hidden;
    }
    .cms-load-strip-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .cms-load-strip-label {
      display: flex;
      justify-content: space-between;
      margin-top: 0.35rem;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-faint);
    }
    .cms-crane-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-faint);
    }
    .cms-details-link {
      display: inline-flex;
      align-items: center;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      background: var(--accent-soft);
      font-weight: 700;
      color: var(--accent-strong-text);
      font-size: 0.75rem;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .cms-crane-card:hover .cms-details-link {
      background: var(--accent);
      color: #fff;
    }

    /* ------------------------------------------------------------- Notion
       A lightweight page-workspace: a sidebar of pages plus a block editor
       (heading/text/to-do/bullet/divider) for the selected page. Sits inside
       the same .detail-card used elsewhere on this page. */
    .notion-workspace {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
    }
    .notion-sidebar {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 220px;
      flex-shrink: 0;
      padding-right: 1.25rem;
      border-right: 1px solid var(--border);
    }
    .notion-sidebar .solid-action-button {
      width: 100%;
      justify-content: center;
    }
    .notion-page-list {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      max-height: 420px;
      overflow-y: auto;
    }
    .notion-page-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.5rem 0.6rem;
      border: none;
      border-left: 2px solid transparent;
      border-radius: 8px;
      background: none;
      color: var(--text-subtle);
      font-size: 0.85rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
    }
    .notion-page-item:hover {
      background: var(--surface-alt);
      transform: translateX(1px);
    }
    .notion-page-item.active {
      background: var(--accent-soft);
      border-left-color: var(--accent);
      color: var(--text);
      font-weight: 700;
    }
    .notion-page-icon {
      flex-shrink: 0;
      font-size: 1rem;
      line-height: 1;
    }
    .notion-page-title {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .notion-editor {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .notion-editor-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .notion-icon-picker-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .notion-page-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: none;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .notion-page-icon-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent-soft-border);
      transform: scale(1.06);
    }
    .notion-icon-picker-menu {
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.2rem;
      margin-top: 0.3rem;
      padding: 0.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      animation: notionPanelFadeIn 0.12s ease;
    }
    .notion-icon-option {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: none;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .notion-icon-option:hover {
      background: var(--surface-alt);
    }
    .notion-title-input {
      flex: 1 1 auto;
      min-width: 0;
      border: none;
      background: none;
      padding: 0.2rem 0;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--text);
      border-bottom: 2px solid transparent;
      transition: border-color 0.15s ease;
    }
    .notion-title-input:hover {
      border-bottom-color: var(--border);
    }
    .notion-title-input:focus-visible {
      outline: none;
      border-bottom-color: var(--accent);
    }
    .notion-updated-note {
      margin: -0.5rem 0 0;
      font-size: 0.72rem;
      color: var(--text-faint);
    }
    .notion-blocks {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .notion-block-wrap {
      display: flex;
      flex-direction: column;
    }
    .notion-block {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.15rem 0.4rem;
      margin: 0 -0.4rem;
      border-radius: 8px;
      transition: background 0.12s ease;
    }
    .notion-block:hover {
      background: var(--surface-alt);
    }
    .notion-block.drag-over {
      box-shadow: 0 -2px 0 0 var(--accent) inset;
    }
    .notion-block.dragging {
      opacity: 0.4;
    }
    /* Drag handle + move/delete controls stay out of the way until you
       hover the row, like Notion's own minimal block chrome. */
    .notion-drag-handle,
    .notion-block-actions {
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .notion-block:hover .notion-drag-handle,
    .notion-block:hover .notion-block-actions,
    .notion-block-actions:focus-within {
      opacity: 1;
    }
    .notion-drag-handle {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      color: var(--text-faint);
      cursor: grab;
    }
    .notion-block-input {
      flex: 1 1 auto;
      min-width: 0;
      border: none;
      background: none;
      padding: 0.35rem 0.4rem;
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text);
      border-bottom: 2px solid transparent;
    }
    .notion-block-input:hover {
      background: var(--surface-alt);
    }
    .notion-block-input:focus-visible {
      outline: none;
      background: var(--surface-alt);
      border-bottom-color: var(--accent);
    }
    .notion-block-input.heading1 {
      font-size: 1.3rem;
      font-weight: 800;
    }
    .notion-block-input.heading2 {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .notion-block-input.quote {
      font-size: 0.98rem;
      font-style: italic;
      color: var(--text-subtle);
    }
    .notion-block-input.code {
      background: #1c1917;
      color: #f4f4f5;
      border-radius: 6px;
      padding: 0.5rem 0.7rem;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
    }
    .notion-block-input.code::placeholder {
      color: #78716c;
    }
    .notion-block-input.code:hover,
    .notion-block-input.code:focus-visible {
      background: #292524;
    }
    .notion-block-divider hr {
      flex: 1 1 auto;
      height: 1px;
      margin: 0.5rem 0;
      border: none;
      background: linear-gradient(90deg, transparent, var(--border-strong) 20%, var(--border-strong) 80%, transparent);
    }
    .notion-bullet-dot,
    .notion-number-marker {
      flex-shrink: 0;
      min-width: 1.2em;
      text-align: center;
      color: var(--accent);
      font-weight: 700;
    }
    .notion-block-quote {
      border-left: 3px solid var(--accent);
      padding: 0.35rem 0 0.35rem 0.75rem;
      background: linear-gradient(90deg, var(--accent-soft), transparent 70%);
      border-radius: 0 8px 8px 0;
    }
    .notion-block-callout {
      padding: 0.55rem 0.7rem;
      background: var(--accent-soft);
      border: 1px solid var(--accent-soft-border);
      border-radius: 10px;
      box-shadow: var(--shadow-sm);
    }
    /* Quote/callout already carry their own background — the generic
       .notion-block:hover fill would otherwise flatten it on hover, since
       it's declared later and matches with equal specificity. */
    .notion-block-quote:hover {
      background: linear-gradient(90deg, var(--accent-soft), transparent 70%);
    }
    .notion-block-callout:hover {
      background: var(--accent-soft);
      box-shadow: var(--shadow-md);
    }
    .notion-callout-emoji {
      flex-shrink: 0;
      font-size: 1.1rem;
    }
    .notion-block-todo.checked .notion-block-input {
      color: var(--text-faint);
      text-decoration: line-through;
    }
    .notion-slash-menu {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      margin: 0.2rem 0 0.4rem 1.9rem;
      padding: 0.3rem;
      max-height: 190px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      animation: notionPanelFadeIn 0.12s ease;
    }
    .notion-slash-item {
      padding: 0.4rem 0.6rem;
      border: none;
      border-radius: 6px;
      background: none;
      color: var(--text-subtle);
      font-size: 0.82rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .notion-slash-item:hover {
      background: var(--surface-alt);
      color: var(--text);
    }
    .notion-block-actions {
      display: flex;
      align-items: center;
      gap: 0.1rem;
      flex-shrink: 0;
    }
    .notion-block-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: none;
      color: var(--text-faint);
      cursor: pointer;
    }
    .notion-block-action-btn:hover {
      background: var(--surface-alt);
      color: var(--accent-strong-text);
    }
    .notion-block-action-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .notion-block-action-btn:disabled:hover {
      background: none;
      color: var(--text-faint);
    }
    .notion-add-block-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .notion-add-block-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-subtle);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .notion-add-block-btn:hover {
      background: var(--accent-soft);
      color: var(--accent-strong-text);
      border-color: var(--accent-soft-border);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    /* -------------------------------------------------- Notion database
       A "database" block: a view-switcher row (Table/Board/List/Calendar/
       Timeline/Gallery/Chart) plus whichever view is currently active,
       all reading the same block.items array. */
    .notion-block-database {
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .notion-db-views {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      flex: 1 1 auto;
      min-width: 0;
    }
    .notion-db-view-tab {
      padding: 0.3rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-subtle);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .notion-db-view-tab:hover {
      background: var(--surface-alt);
    }
    .notion-db-view-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 10px -2px rgba(124, 58, 237, 0.45);
    }
    .notion-db-content {
      margin: 0.6rem 0 0.4rem 1.9rem;
    }
    .notion-db-table input,
    .notion-db-table select {
      width: 100%;
      min-width: 110px;
      padding: 0.35rem 0.5rem;
      font-size: 0.82rem;
      border: 1px solid transparent;
      border-radius: 6px;
      background: none;
    }
    .notion-db-table input:hover,
    .notion-db-table select:hover,
    .notion-db-table input:focus,
    .notion-db-table select:focus {
      background: var(--surface-alt);
      border-color: var(--border);
    }
    .notion-db-tag-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--text-subtle);
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .notion-db-status-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .notion-db-list {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .notion-db-list-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 0.5rem;
      border-radius: 8px;
    }
    .notion-db-list-row:hover {
      background: var(--surface-alt);
    }
    .notion-db-status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .notion-db-list-title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .notion-db-list-date {
      font-size: 0.75rem;
      color: var(--text-faint);
      flex-shrink: 0;
    }
    .notion-db-board {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 0.3rem;
    }
    .notion-db-board-col {
      flex-shrink: 0;
      width: 200px;
      padding: 0.6rem;
      background: var(--surface-alt);
      border-radius: 10px;
      border-top: 3px solid var(--border);
    }
    .notion-db-board-col.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
    }
    .notion-db-board-col-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
    }
    .notion-db-board-count {
      color: var(--text-faint);
      font-size: 0.72rem;
      font-weight: 600;
    }
    .notion-db-board-cards {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-height: 40px;
    }
    .notion-db-board-card {
      padding: 0.5rem 0.6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      cursor: grab;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .notion-db-board-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-soft-border);
    }
    .notion-db-board-card.dragging {
      opacity: 0.4;
    }
    .notion-db-board-card-title {
      margin: 0 0 0.3rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }
    .notion-db-cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }
    .notion-db-cal-month {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }
    .notion-db-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.3rem;
    }
    .notion-db-cal-weekday {
      text-align: center;
      padding-bottom: 0.3rem;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-faint);
    }
    .notion-db-cal-cell {
      min-height: 72px;
      padding: 0.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .notion-db-cal-cell.empty {
      background: var(--surface-alt);
      border-color: transparent;
      cursor: default;
    }
    .notion-db-cal-cell.empty:hover {
      background: var(--surface-alt);
      border-color: transparent;
    }
    .notion-db-cal-daynum {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-faint);
    }
    .notion-db-cal-item {
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent-strong-text);
      font-size: 0.66rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .notion-db-timeline-scroll {
      overflow-x: auto;
    }
    .notion-db-timeline-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .notion-db-timeline-label {
      width: 150px;
      flex-shrink: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .notion-db-timeline-track {
      position: relative;
      height: 22px;
      background: var(--surface-alt);
      border-radius: 6px;
    }
    .notion-db-timeline-bar {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 6px;
    }
    .notion-db-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    .notion-db-gallery-card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .notion-db-gallery-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-soft-border);
    }
    .notion-db-gallery-cover {
      height: 56px;
      background-color: var(--notion-db-cover-color, var(--text-faint));
      background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.25), transparent 60%);
    }
    .notion-db-gallery-title {
      margin: 0.55rem 0.6rem 0.3rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
    }
    .notion-db-gallery-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin: 0 0.6rem 0.6rem;
    }
    .notion-db-list-row,
    .notion-db-board-card,
    .notion-db-gallery-card,
    .notion-db-timeline-label {
      cursor: pointer;
    }
    .notion-db-add-card-btn {
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.4rem;
      border: 1px dashed var(--border-strong);
      border-radius: 8px;
      background: none;
      color: var(--text-faint);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }
    .notion-db-add-card-btn:hover {
      background: var(--surface);
      color: var(--accent-strong-text);
    }
    .notion-db-gallery-add-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      min-height: 110px;
      border: 1.5px dashed var(--border-strong);
      border-radius: 10px;
      background: none;
      color: var(--text-faint);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .notion-db-gallery-add-card:hover {
      background: var(--surface-alt);
      color: var(--accent-strong-text);
    }
    .notion-db-hint {
      margin: 0 0 0.5rem;
      font-size: 0.74rem;
      color: var(--text-faint);
    }
    .notion-db-cal-item {
      cursor: grab;
    }
    .notion-db-cal-cell {
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .notion-db-cal-cell:hover {
      background: var(--accent-soft);
      border-color: var(--accent-soft-border);
    }
    .notion-db-cal-cell.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
    }
    .notion-db-timeline-bar {
      position: relative;
      cursor: grab;
    }
    .notion-db-timeline-handle {
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      border-radius: 0 6px 6px 0;
      background: rgba(255, 255, 255, 0.45);
      cursor: ew-resize;
    }

    /* Table view's column header: rename inline by typing (adding/deleting
       properties happens in the shared "Properties" panel below instead). */
    .notion-db-th {
      white-space: nowrap;
    }
    .notion-db-col-name-input {
      width: auto;
      min-width: 60px;
      padding: 0.2rem 0.3rem;
      border: 1px solid transparent;
      border-radius: 5px;
      background: none;
      color: inherit;
      font-size: inherit;
      font-weight: 700;
    }
    .notion-db-col-name-input:hover,
    .notion-db-col-name-input:focus {
      background: var(--surface);
      border-color: var(--border);
    }

    /* Shared "Properties" panel (add/rename/delete) — a `position: fixed`
       overlay so it always escapes Table's .table-scroll and Board/Gallery's
       own horizontal scroll clipping (see notionPositionFloatingPanel). */
    .notion-db-properties-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-subtle);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .notion-db-properties-btn:hover {
      background: var(--surface-alt);
    }
    .notion-db-properties-panel {
      position: fixed;
      z-index: 40;
      padding: 0.75rem;
      width: 260px;
      max-height: 70vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      text-align: left;
      white-space: normal;
      font-weight: 400;
      animation: notionPanelFadeIn 0.12s ease;
    }
    .notion-db-properties-panel-title {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text);
    }
    .notion-db-properties-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 0.6rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }
    .notion-db-properties-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .notion-db-properties-row .notion-db-col-name-input {
      flex: 1 1 auto;
      min-width: 0;
    }
    .notion-db-properties-type-badge {
      flex-shrink: 0;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--text-faint);
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .notion-db-properties-add .modal-field {
      margin-bottom: 0.5rem;
    }
    .notion-db-properties-add .modal-field label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Image/Video/Embed */
    .notion-media-preview {
      margin: 0.3rem 0 0 1.9rem;
    }
    .notion-media-image {
      max-width: 100%;
      border-radius: 8px;
    }
    .notion-media-frame {
      position: relative;
      width: 100%;
      max-width: 640px;
      padding-top: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface-alt);
    }
    .notion-media-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .notion-media-frame-spotify {
      padding-top: 0;
      height: 152px;
      max-width: 100%;
    }
    .notion-embed-gallery-title {
      margin: 0 0 0.6rem;
      font-size: 0.8rem;
      color: var(--text-subtle);
    }
    .notion-embed-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.5rem;
    }
    .notion-embed-gallery-chip {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.5rem 0.6rem;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .notion-embed-gallery-icon {
      flex-shrink: 0;
      font-size: 1.1rem;
      line-height: 1.2;
    }
    .notion-embed-gallery-text {
      font-size: 0.76rem;
      color: var(--text-subtle);
      line-height: 1.4;
    }
    .notion-embed-gallery-text strong {
      color: var(--text);
    }

    /* Math (KaTeX) */
    .notion-math-preview {
      margin: 0.3rem 0 0 1.9rem;
      padding: 0.6rem 0.8rem;
      overflow-x: auto;
      background: var(--surface-alt);
      border-radius: 8px;
    }

    /* Table of contents */
    .notion-toc-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 1 1 auto;
      color: var(--text-subtle);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .notion-toc-list {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      margin: 0.3rem 0 0 1.9rem;
    }
    .notion-toc-item {
      align-self: flex-start;
      padding: 0.2rem 0.4rem;
      border: none;
      border-radius: 6px;
      background: none;
      color: var(--accent-strong-text);
      font-size: 0.85rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .notion-toc-item:hover {
      background: var(--surface-alt);
      text-decoration: underline;
    }
    .notion-toc-item.notion-toc-indent {
      margin-left: 1.2rem;
      font-weight: 500;
    }

    /* Brief flash when a Table of Contents link scrolls a block into view */
    .notion-block-highlight {
      animation: notionBlockFlash 1.2s ease;
    }
    @keyframes notionBlockFlash {
      0% { background: var(--accent-soft); }
      100% { background: transparent; }
    }
    @keyframes notionPanelFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Live widgets: Clock, Pomodoro timer, Countdown, Habit tracker */
    .notion-clock-face {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      flex: 1 1 auto;
      padding: 0.3rem 0;
    }
    .notion-clock-time {
      font-size: 1.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .notion-clock-date {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-faint);
    }
    .notion-timer-widget {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      flex: 1 1 auto;
      padding: 0.4rem 0;
    }
    .notion-timer-presets {
      display: flex;
      gap: 0.3rem;
    }
    .notion-timer-preset {
      padding: 0.25rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-faint);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;

  <script>
    // The application id travels in the URL hash — see device-detail.html
    // for why (a hash survives a static-file server in a way a query string
    // used with clean-URL rewriting might not). Unlike device-detail.html,
    // this page is also linked to from itself (every other application's
    // sidebar entry points here too), so a click only changes the hash on
    // an already-loaded document — the browser treats that as a
    // same-document navigation and never reloads. 'hashchange' below is
    // what makes clicking from one application to another actually update
    // the page instead of requiring a manual refresh.
    // The hash can also carry an EMS sub-tab after a colon (e.g.
    // "app_ems:meters"), so a link back from a meter's own dashboard page
    // lands on the Meter List tab instead of always resetting to TOD Grid.
    const initialHashParts = window.location.hash.slice(1).split(':')
    let applicationId = initialHashParts[0]
    let pendingEmsTab = initialHashParts[1] || null
    let pendingCmsTab = initialHashParts[1] || null

    function getApp() {
      return Store.get().applications.find((a) => a.id === applicationId)
    }

    function breadcrumbsForApp(app) {
      return app
        ? [
            { label: 'Home', href: 'dashboard.html' },
            { label: 'Applications', href: 'applications.html' },
            { label: app.name },
          ]
        : [
            { label: 'Home', href: 'dashboard.html' },
            { label: 'Applications', href: 'applications.html' },

      document.getElementById('metadata-add-btn').addEventListener('click', () => {
        metadataRows.push({ id: metadataNextId++, key: '', value: '' })

      })
      document.querySelectorAll('[data-remove]').forEach((btn) =>
        btn.addEventListener('click', () => {
          metadataRows = metadataRows.filter((r) => r.id !== Number(btn.getAttribute('data-remove')))
          renderMetadataEditor()
        }),
      )
      document.querySelectorAll('[data-key]').forEach((input) =>
        input.addEventListener('input', () => { metadataRows.find((r) => r.id === Number(input.getAttribute('data-key'))).key = input.value }),
      )
      document.querySelectorAll('[data-value]').forEach((input) =>
        input.addEventListener('input', () => { metadataRows.find((r) => r.id === Number(input.getAttribute('data-value'))).value = input.value }),

    function filterChecklist(listId, term) {
      const container = document.getElementById(listId)
      if (!container) return
      const t = term.trim().toLowerCase()
      const labels = Array.from(container.querySelectorAll('.modal-checkbox'))
      let visibleCount = 0
      labels.forEach((label) => {
        const match = !t || label.textContent.trim().toLowerCase().includes(t)
        label.style.display = match ? '' : 'none'
        if (match) visibleCount++
      })
      let emptyNote = container.querySelector('.checklist-no-match')
      if (labels.length > 0 && visibleCount === 0) {
        if (!emptyNote) {
          emptyNote = document.createElement('p')
          emptyNote.className = 'section-empty checklist-no-match'
          emptyNote.textContent = 'No matches found.'
          container.appendChild(emptyNote)
        }
      } else if (emptyNote) {
        emptyNote.remove()
      }
    }

    document.getElementById('app-groups-search').addEventListener('input', (e) => filterChecklist('app-groups-list', e.target.value))

      selectedIcon = app.icon || 'app'

      document.getElementById('app-assets-search').value = ''

      renderIconPicker()
      renderDevicesChecklist(app.deviceIds || [])

    document.getElementById('app-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const app = getApp()
      if (!app) return
      const name = document.getElementById('app-name').value.trim()
      if (!name) return
      const description = document.getElementById('app-description').value.trim()
      const deviceIds = Array.from(document.querySelectorAll('#app-devices-list input:checked')).map((el) => el.getAttribute('data-device'))
      const assetIds = Array.from(document.querySelectorAll('#app-assets-list input:checked')).map((el) => el.getAttribute('data-asset'))
      const groupNames = Array.from(document.querySelectorAll('#app-groups-list input:checked')).map((el) => el.getAttribute('data-group'))
      const metadata = metadataRows.filter((r) => r.key.trim()).map((r) => ({ key: r.key.trim(), value: r.value.trim() }))
      Store.updateApplication(app.id, { name, description, deviceIds, assetIds, groupNames, metadata, icon: selectedIcon })
      UI.toast(`"${name}" updated successfully!`)
      UI.closeModal('app-modal')
      renderPage()

    document.getElementById('notion-db-item-form').addEventListener('submit', function (event) {
      event.preventDefault()
      if (!notionEditingDbItem) return
      const { blockId, itemId } = notionEditingDbItem
      Store.updateNotionDatabaseItem(notionActivePageId, blockId, itemId, {
        title: document.getElementById('notion-db-item-title').value.trim(),
        status: document.getElementById('notion-db-item-status').value,

    function renderGenericTabPanel(tab, app, devices, assets, groupNames, metadata) {

        return devices.length === 0

          : `<div class="detail-tile-grid">${devices

              </a>`,
              )

      }
      if (tab === 'assets') {
        return assets.length === 0
          ? '<span class="section-empty">No assets linked to this application</span>'
          : `<div class="detail-tile-grid">${assets
              .map(
                (a) => `
              <a class="detail-tile" href="asset-detail.html#${a.id}">
                <span class="detail-tile-icon">${iconSvg('asset')}</span>
                <p class="detail-tile-name">${a.name}</p>
                <span class="status-pill status-${a.status}" title="${a.status}">${a.status}</span>

      if (tab === 'groups') {
        if (groupNames.length === 0) return '<span class="section-empty">No asset groups linked to this application</span>'

        return groupNames
          .map((name) => {

              <a class="detail-tile" href="asset-detail.html#${a.id}">

                <p class="detail-tile-name">${a.name}</p>

            .join('')}</div>`
    }

    const PMS_SHIFT_SLOTS = {

    let notionActivePageId = null
    let notionPageSearch = ''
    let notionRefocusSearch = false
    let notionFocusBlockId = null
    let notionDraggedBlockId = null
    let notionGlobalClickListenerAttached = false

    const NOTION_BLOCK_TYPES = [
      { type: 'heading', label: 'Heading 1' },
      { type: 'heading2', label: 'Heading 2' },
      { type: 'text', label: 'Text' },
