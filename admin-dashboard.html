<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/admin.css" />
  <title>Control Center — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content admin-page" id="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Control Center</h1>
            <p class="page-subtitle">Platform-wide overview across every tenant</p>
          </div>
        </div>

        <div class="admin-stat-grid" id="stat-grid"></div>

        <div class="admin-section-card">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <p class="admin-section-card-header">Recently created tenants</p>
            <div id="view-toggle-slot"></div>
          </div>
          <div class="table-scroll" id="table-scroll">
            <table class="data-table">
              <thead><tr><th>Title</th><th>Tenant profile</th><th>Devices</th><th>Status</th><th>Created Date</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
        </div>

        <p class="admin-dashboard-link-row"><a href="admin-tenants.html" class="link">View all tenants</a></p>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    Layout.mountAdmin({
      active: 'dashboard',
      breadcrumbs: [{ label: 'Control Center' }],
    })

    const data = Store.get()
    const totalDevices = data.tenants.reduce((sum, t) => sum + t.deviceCount, 0)
    const suspendedTenants = data.tenants.filter((t) => t.status === 'suspended').length

    document.getElementById('stat-grid').innerHTML = `
      <div class="admin-stat-card"><p class="admin-stat-label">Tenants</p><p class="admin-stat-value">${data.tenants.length}</p></div>
      <div class="admin-stat-card"><p class="admin-stat-label">Total devices</p><p class="admin-stat-value">${totalDevices}</p></div>
      <div class="admin-stat-card"><p class="admin-stat-label">Tenant profiles</p><p class="admin-stat-value">${data.tenantProfiles.length}</p></div>
      <div class="admin-stat-card"><p class="admin-stat-label">Suspended tenants</p><p class="admin-stat-value${suspendedTenants > 0 ? ' warning' : ''}">${suspendedTenants}</p></div>`

    const recentTenants = [...data.tenants].sort((a, b) => b.createdDate.localeCompare(a.createdDate)).slice(0, 5)
    document.getElementById('tbody').innerHTML = recentTenants
      .map(
        (t) => `
      <tr>
        <td class="card-title-cell">${t.title}</td>
        <td data-label="Tenant profile">${t.tenantProfileName}</td>
        <td data-label="Devices">${t.deviceCount}</td>
        <td data-label="Status"><span class="status-pill status-${t.status}">${t.status}</span></td>
        <td data-label="Created Date">${t.createdDate}</td>
      </tr>`,
      )
      .join('')

    document.getElementById('view-toggle-slot').innerHTML = UI.viewToggleHtml('admin-dashboard-tenants')
    UI.wireViewToggle('admin-dashboard-tenants', document.getElementById('table-scroll'))
  </script>
</body>
</html>
