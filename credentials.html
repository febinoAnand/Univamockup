<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/credentials.css" />
  <title>Credentials — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Credentials</h1>
            <p class="page-subtitle">Security credentials used by devices or gateways for authentication when connecting to the platform</p>
          </div>
        </div>

        <div class="credentials-tabs">
          <button type="button" class="tab-button active" id="tab-basic">Basic credentials</button>
          <button type="button" class="tab-button" id="tab-tls">TLS client certificates</button>
        </div>

        <div id="basic-view">
          <div class="credentials-toolbar">
            <div class="table-search-wrap" style="flex:1; max-width:400px;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
              <input type="text" id="basic-search" placeholder="Search" />
            </div>
            <div class="credentials-toolbar-icons">
              <button type="button" class="icon-toggle" aria-label="Basic auth credentials">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h8" stroke-linecap="round"/></svg>
              </button>
              <button type="button" class="icon-toggle" aria-label="Verified credentials">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button type="button" class="icon-toggle" aria-label="Unverified credentials">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 4l16 16" stroke-linecap="round"/></svg>
              </button>
            </div>
            <button type="button" class="solid-action-button" id="add-basic-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
              Add basic credentials
            </button>
          </div>
          <div class="credentials-card" id="basic-card"></div>
        </div>

        <div id="tls-view" class="hidden">
          <div class="credentials-toolbar">
            <div class="table-search-wrap" style="flex:1; max-width:400px;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
              <input type="text" id="tls-search" placeholder="Search" />
            </div>
            <div class="credentials-toolbar-icons">
              <button type="button" class="icon-toggle" aria-label="TLS certificates">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <button type="button" class="solid-action-button" id="add-tls-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
              Add TLS client certificate
            </button>
          </div>
          <div class="credentials-card" id="tls-card"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="basic-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="basic-modal-title">Add basic credentials</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('basic-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="basic-form">
          <div class="modal-field">
            <label for="basic-username">
              Username
              <span class="help-icon" title="The username devices will authenticate with"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 1 1 3.4 2.3c-.8.4-1.4 1-1.4 1.9v.3" stroke-linecap="round"/><circle cx="12" cy="16.8" r="0.4" fill="currentColor" stroke="none"/></svg></span>
            </label>
            <input id="basic-username" type="text" required />
          </div>
          <div class="modal-field">
            <label for="basic-password">
              Password
              <span class="help-icon" title="The password devices will authenticate with"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 1 1 3.4 2.3c-.8.4-1.4 1-1.4 1.9v.3" stroke-linecap="round"/><circle cx="12" cy="16.8" r="0.4" fill="currentColor" stroke="none"/></svg></span>
            </label>
            <input id="basic-password" type="password" required />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('basic-modal')">Cancel</button>
        <button type="submit" form="basic-form" class="modal-button primary" id="basic-save-btn">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="tls-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="tls-modal-title">Add TLS client certificate</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('tls-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="tls-form">
          <div class="modal-field"><label for="tls-name">Name*</label><input id="tls-name" type="text" required /></div>
          <div class="modal-field"><label for="tls-cert">Certificate (PEM)*</label><textarea id="tls-cert" rows="6" placeholder="-----BEGIN CERTIFICATE-----" required></textarea></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('tls-modal')">Cancel</button>
        <button type="submit" form="tls-form" class="modal-button primary" id="tls-save-btn">Create</button>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    const TAB_LABELS = { basic: 'Basic credentials', tls: 'TLS client certificates' }
    function credentialsBreadcrumbs(tab) {
      return [
        { label: 'Home', href: 'dashboard.html' },
        { label: 'Device management', href: 'devices.html' },
        { label: 'Credentials', href: 'credentials.html' },
        { label: TAB_LABELS[tab] },
      ]
    }

    Layout.mount({
      active: 'credentials',
      breadcrumbs: credentialsBreadcrumbs('basic'),
    })

    // Mirrors CredentialsPage.jsx's plain useState([]) (no Context/provider) — these lists
    // are page-local and intentionally reset every time this page loads, unlike every other
    // entity in this app which persists via Store.
    let basicCredentials = []
    let tlsCertificates = []
    let editingBasicId = null
    let editingTlsId = null

    document.getElementById('tab-basic').addEventListener('click', () => {
      document.getElementById('tab-basic').classList.add('active')
      document.getElementById('tab-tls').classList.remove('active')
      document.getElementById('basic-view').classList.remove('hidden')
      document.getElementById('tls-view').classList.add('hidden')
      Layout.setBreadcrumbs(credentialsBreadcrumbs('basic'))
    })
    document.getElementById('tab-tls').addEventListener('click', () => {
      document.getElementById('tab-tls').classList.add('active')
      document.getElementById('tab-basic').classList.remove('active')
      document.getElementById('tls-view').classList.remove('hidden')
      document.getElementById('basic-view').classList.add('hidden')
      Layout.setBreadcrumbs(credentialsBreadcrumbs('tls'))
    })

    function renderBasic() {
      const term = document.getElementById('basic-search').value.trim().toLowerCase()
      const all = basicCredentials
      const rows = term ? all.filter((c) => c.username.toLowerCase().includes(term)) : all
      const card = document.getElementById('basic-card')

      if (all.length === 0) {
        card.innerHTML = '<div class="no-data-wrap"><p class="no-data">No data available</p></div>'
        return
      }
      if (rows.length === 0) {
        card.innerHTML = '<div class="no-data-wrap"><p class="no-data">No credentials match your search</p></div>'
        return
      }
      card.innerHTML = `
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Username</th><th class="data-table-menu-col"></th></tr></thead>
            <tbody>
              ${rows
                .map(
                  (c) => `
                <tr>
                  <td>${c.username}</td>
                  <td class="data-table-menu-col">
                    <div class="row-menu">
                      <button type="button" class="row-menu-button" data-menu-toggle>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
                      </button>
                      <div class="row-menu-dropdown">
                        <button type="button" class="row-menu-item" data-edit-basic="${c.id}">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                          Edit
                        </button>
                        <button type="button" class="row-menu-item danger" data-delete-basic="${c.id}">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                          Delete
                        </button>
                      </div>
                    </div>
                  </td>
                </tr>`,
                )
                .join('')}
            </tbody>
          </table>
        </div>`

      document.querySelectorAll('[data-edit-basic]').forEach((btn) => btn.addEventListener('click', () => openEditBasic(btn.getAttribute('data-edit-basic'))))
      document.querySelectorAll('[data-delete-basic]').forEach((btn) => btn.addEventListener('click', () => confirmDeleteBasic(btn.getAttribute('data-delete-basic'))))
      wireMenus()
    }

    function renderTls() {
      const term = document.getElementById('tls-search').value.trim().toLowerCase()
      const all = tlsCertificates
      const rows = term ? all.filter((c) => c.name.toLowerCase().includes(term)) : all
      const card = document.getElementById('tls-card')

      if (all.length === 0) {
        card.innerHTML = '<div class="no-data-wrap"><p class="no-data">No data available</p></div>'
        return
      }
      if (rows.length === 0) {
        card.innerHTML = '<div class="no-data-wrap"><p class="no-data">No certificates match your search</p></div>'
        return
      }
      card.innerHTML = `
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Name</th><th class="data-table-menu-col"></th></tr></thead>
            <tbody>
              ${rows
                .map(
                  (c) => `
                <tr>
                  <td>${c.name}</td>
                  <td class="data-table-menu-col">
                    <div class="row-menu">
                      <button type="button" class="row-menu-button" data-menu-toggle>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
                      </button>
                      <div class="row-menu-dropdown">
                        <button type="button" class="row-menu-item" data-edit-tls="${c.id}">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                          Edit
                        </button>
                        <button type="button" class="row-menu-item danger" data-delete-tls="${c.id}">
                          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                          Delete
                        </button>
                      </div>
                    </div>
                  </td>
                </tr>`,
                )
                .join('')}
            </tbody>
          </table>
        </div>`

      document.querySelectorAll('[data-edit-tls]').forEach((btn) => btn.addEventListener('click', () => openEditTls(btn.getAttribute('data-edit-tls'))))
      document.querySelectorAll('[data-delete-tls]').forEach((btn) => btn.addEventListener('click', () => confirmDeleteTls(btn.getAttribute('data-delete-tls'))))
      wireMenus()
    }

    function wireMenus() {
      document.querySelectorAll('[data-menu-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const menu = btn.closest('.row-menu')
          const wasOpen = menu.classList.contains('open')
          UI.closeRowMenus()
          if (!wasOpen) UI.openRowMenu(btn)
        }),
      )
    }
    document.addEventListener('click', () => UI.closeRowMenus())

    document.getElementById('add-basic-btn').addEventListener('click', () => {
      editingBasicId = null
      document.getElementById('basic-modal-title').textContent = 'Add basic credentials'
      document.getElementById('basic-save-btn').textContent = 'Create'
      document.getElementById('basic-username').value = ''
      document.getElementById('basic-password').value = ''
      UI.openModal('basic-modal')
    })
    function openEditBasic(id) {
      const c = basicCredentials.find((x) => x.id === id)
      if (!c) return
      editingBasicId = id
      document.getElementById('basic-modal-title').textContent = 'Edit basic credentials'
      document.getElementById('basic-save-btn').textContent = 'Save'
      document.getElementById('basic-username').value = c.username
      document.getElementById('basic-password').value = c.password
      UI.openModal('basic-modal')
    }
    function confirmDeleteBasic(id) {
      const c = basicCredentials.find((x) => x.id === id)
      if (!c) return
      UI.confirm({
        message: `Delete credentials for <strong>${c.username}</strong>? This can't be undone.`,
        onConfirm: () => {
          basicCredentials = basicCredentials.filter((x) => x.id !== id)
          renderBasic()
        },
      })
    }
    document.getElementById('basic-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const username = document.getElementById('basic-username').value.trim()
      const password = document.getElementById('basic-password').value.trim()
      if (!username || !password) return
      if (editingBasicId) {
        const c = basicCredentials.find((x) => x.id === editingBasicId)
        if (c) { c.username = username; c.password = password }
      } else {
        basicCredentials.push({ id: crypto.randomUUID(), username, password })
      }
      UI.closeModal('basic-modal')
      renderBasic()
    })

    document.getElementById('add-tls-btn').addEventListener('click', () => {
      editingTlsId = null
      document.getElementById('tls-modal-title').textContent = 'Add TLS client certificate'
      document.getElementById('tls-save-btn').textContent = 'Create'
      document.getElementById('tls-name').value = ''
      document.getElementById('tls-cert').value = ''
      UI.openModal('tls-modal')
    })
    function openEditTls(id) {
      const c = tlsCertificates.find((x) => x.id === id)
      if (!c) return
      editingTlsId = id
      document.getElementById('tls-modal-title').textContent = 'Edit TLS client certificate'
      document.getElementById('tls-save-btn').textContent = 'Save'
      document.getElementById('tls-name').value = c.name
      document.getElementById('tls-cert').value = c.certificate
      UI.openModal('tls-modal')
    }
    function confirmDeleteTls(id) {
      const c = tlsCertificates.find((x) => x.id === id)
      if (!c) return
      UI.confirm({
        message: `Delete <strong>${c.name}</strong>? This can't be undone.`,
        onConfirm: () => {
          tlsCertificates = tlsCertificates.filter((x) => x.id !== id)
          renderTls()
        },
      })
    }
    document.getElementById('tls-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const name = document.getElementById('tls-name').value.trim()
      const certificate = document.getElementById('tls-cert').value.trim()
      if (!name || !certificate) return
      if (editingTlsId) {
        const c = tlsCertificates.find((x) => x.id === editingTlsId)
        if (c) { c.name = name; c.certificate = certificate }
      } else {
        tlsCertificates.push({ id: crypto.randomUUID(), name, certificate })
      }
      UI.closeModal('tls-modal')
      renderTls()
    })

    document.getElementById('basic-search').addEventListener('input', renderBasic)
    document.getElementById('tls-search').addEventListener('input', renderTls)

    renderBasic()
    renderTls()
  </script>
</body>
</html>
