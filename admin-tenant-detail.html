<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/admin.css" />
  <title>Tenant details — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content admin-page" id="app-content">
        <a href="admin-tenants.html" class="text-link">&larr; Back to Tenants</a>

        <div id="not-found" class="hidden">
          <p class="device-not-found">Tenant not found.</p>
        </div>

        <div id="tenant-body">
          <div class="page-header">
            <div>
              <h1 class="page-title" id="tenant-title">&mdash;</h1>
              <p class="page-subtitle" id="tenant-subtitle">&mdash;</p>
            </div>
            <div class="page-header-actions">
              <span class="status-pill" id="tenant-status-pill"></span>
            </div>
          </div>

          <div class="admin-section-card" style="padding: 1.1rem 1.25rem; margin-bottom: 1.5rem;">
            <div class="tenant-meta-grid" id="tenant-meta"></div>
          </div>

          <div class="tenant-detail-tabs">
            <button type="button" class="tab-button active" id="tab-users">Users</button>
            <button type="button" class="tab-button" id="tab-devices">Devices</button>
            <button type="button" class="tab-button" id="tab-applications">Applications</button>
          </div>

          <!-- Users -->
          <div id="users-view">
            <div class="page-header-actions" style="justify-content: space-between; display: flex; margin-bottom: 1rem;">
              <div class="table-search-wrap" style="margin: 0;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
                <input type="text" id="users-search" placeholder="Search users" />
              </div>
              <button type="button" class="solid-action-button" id="add-user-btn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
                Add user
              </button>
            </div>
            <div class="table-scroll">
              <table class="data-table">
                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Created Date</th><th class="data-table-menu-col"></th></tr></thead>
                <tbody id="users-tbody"></tbody>
              </table>
            </div>
          </div>

          <!-- Devices -->
          <div id="devices-view" class="hidden">
            <div class="page-header-actions" style="justify-content: space-between; display: flex; margin-bottom: 1rem;">
              <div class="table-search-wrap" style="margin: 0;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
                <input type="text" id="devices-search" placeholder="Search devices" />
              </div>
              <button type="button" class="solid-action-button" id="add-device-btn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
                Add device
              </button>
            </div>
            <div class="table-scroll">
              <table class="data-table">
                <thead><tr><th>Name</th><th>Status</th><th>Created Date</th><th class="data-table-menu-col"></th></tr></thead>
                <tbody id="devices-tbody"></tbody>
              </table>
            </div>
          </div>

          <!-- Applications -->
          <div id="applications-view" class="hidden">
            <div class="page-header-actions" style="justify-content: space-between; display: flex; margin-bottom: 1rem;">
              <div class="table-search-wrap" style="margin: 0;">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
                <input type="text" id="applications-search" placeholder="Search applications" />
              </div>
              <button type="button" class="solid-action-button" id="add-application-btn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
                Add application
              </button>
            </div>
            <div class="table-scroll">
              <table class="data-table">
                <thead><tr><th>Name</th><th>Status</th><th>Created Date</th><th class="data-table-menu-col"></th></tr></thead>
                <tbody id="applications-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit user modal -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="user-modal-title">Add user</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('user-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="user-form">
          <div class="modal-field"><label for="tu-name">Full name*</label><input id="tu-name" type="text" required /></div>
          <div class="modal-field"><label for="tu-email">Email address*</label><input id="tu-email" type="email" required /></div>
          <div class="modal-field">
            <label for="tu-role">Role</label>
            <select id="tu-role">
              <option>Owner</option>
              <option>Admin</option>
              <option>Member</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('user-modal')">Cancel</button>
        <button type="submit" form="user-form" class="modal-button primary" id="user-save-btn">Create</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit device modal -->
  <div class="modal-overlay" id="device-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="device-modal-title">Add device</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('device-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="device-form">
          <div class="modal-field"><label for="td-name">Device name*</label><input id="td-name" type="text" required /></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('device-modal')">Cancel</button>
        <button type="submit" form="device-form" class="modal-button primary" id="device-save-btn">Create</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit application modal -->
  <div class="modal-overlay" id="application-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="application-modal-title">Add application</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('application-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="application-form">
          <div class="modal-field"><label for="ta-name">Application name*</label><input id="ta-name" type="text" required /></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('application-modal')">Cancel</button>
        <button type="submit" form="application-form" class="modal-button primary" id="application-save-btn">Create</button>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    Layout.mountAdmin({ active: 'tenants' })

    const tenantId = window.location.hash.slice(1)
    let editingUserId = null
    let editingDeviceId = null
    let editingApplicationId = null

    function getTenant() {
      return Store.get().tenants.find((t) => t.id === tenantId)
    }

    function renderHeader() {
      const t = getTenant()
      document.getElementById('tenant-title').textContent = t.title
      document.getElementById('tenant-subtitle').textContent = t.email || 'No contact email on file'
      const pill = document.getElementById('tenant-status-pill')
      pill.textContent = t.status
      pill.className = `status-pill status-${t.status}`
      document.getElementById('tenant-meta').innerHTML = [
        ['Phone', t.phone || '—'],
        ['Country', t.country || '—'],
        ['Tenant profile', t.tenantProfileName || '—'],
        ['Registered devices', t.deviceCount],
        ['Created date', t.createdDate],
      ]
        .map(([label, value]) => `<div class="tenant-meta-item"><p class="label">${label}</p><p class="value">${value}</p></div>`)
        .join('')
    }

    function wireMenuToggles(container) {
      container.querySelectorAll('[data-menu-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const menu = btn.closest('.row-menu')
          const wasOpen = menu.classList.contains('open')
          UI.closeRowMenus()
          if (!wasOpen) UI.openRowMenu(btn)
        }),
      )
    }
    document.addEventListener('click', () => UI.closeRowMenus())

    // ------------------------------------------------------------- tabs
    const TABS = ['users', 'devices', 'applications']
    function showTab(tab) {
      TABS.forEach((key) => {
        document.getElementById(`tab-${key}`).classList.toggle('active', key === tab)
        document.getElementById(`${key}-view`).classList.toggle('hidden', key !== tab)
      })
    }
    TABS.forEach((key) => document.getElementById(`tab-${key}`).addEventListener('click', () => showTab(key)))

    // ------------------------------------------------------------- users
    function renderUsers() {
      const t = getTenant()
      const term = document.getElementById('users-search').value.trim().toLowerCase()
      const users = term ? t.users.filter((u) => u.name.toLowerCase().includes(term) || u.email.toLowerCase().includes(term)) : t.users
      const tbody = document.getElementById('users-tbody')
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-table-note">No users for this tenant yet.</td></tr>'
        return
      }
      tbody.innerHTML = users
        .map(
          (u) => `
        <tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td><span class="status-pill status-${u.status}">${u.status}</span></td>
          <td>${u.createdDate}</td>
          <td class="data-table-menu-col">
            <div class="row-menu">
              <button type="button" class="row-menu-button" data-menu-toggle>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
              </button>
              <div class="row-menu-dropdown">
                <button type="button" class="row-menu-item" data-user-toggle="${u.id}">
                  ${u.status === 'active'
                    ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
                    : '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 5l12 7-12 7V5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
                  ${u.status === 'active' ? 'Suspend' : 'Activate'}
                </button>
                <button type="button" class="row-menu-item" data-user-edit="${u.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Edit
                </button>
                <button type="button" class="row-menu-item danger" data-user-delete="${u.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                  Remove
                </button>
              </div>
            </div>
          </td>
        </tr>`,
        )
        .join('')

      document.querySelectorAll('[data-user-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const id = btn.getAttribute('data-user-toggle')
          const user = getTenant().users.find((x) => x.id === id)
          Store.toggleTenantUserStatus(tenantId, id)
          renderUsers()
          UI.toast(`"${user.name}" ${user.status === 'active' ? 'suspended' : 'activated'} successfully!`)
        }),
      )
      document.querySelectorAll('[data-user-edit]').forEach((btn) =>
        btn.addEventListener('click', (event) => { event.stopPropagation(); openUserEdit(btn.getAttribute('data-user-edit')) }),
      )
      document.querySelectorAll('[data-user-delete]').forEach((btn) =>
        btn.addEventListener('click', (event) => { event.stopPropagation(); confirmUserDelete(btn.getAttribute('data-user-delete')) }),
      )
      wireMenuToggles(tbody)
    }

    function openUserAdd() {
      editingUserId = null
      document.getElementById('user-modal-title').textContent = 'Add user'
      document.getElementById('user-save-btn').textContent = 'Create'
      document.getElementById('tu-name').value = ''
      document.getElementById('tu-email').value = ''
      document.getElementById('tu-role').value = 'Admin'
      UI.openModal('user-modal')
    }

    function openUserEdit(id) {
      const user = getTenant().users.find((u) => u.id === id)
      if (!user) return
      editingUserId = id
      document.getElementById('user-modal-title').textContent = 'Edit user'
      document.getElementById('user-save-btn').textContent = 'Save changes'
      document.getElementById('tu-name').value = user.name
      document.getElementById('tu-email').value = user.email
      document.getElementById('tu-role').value = user.role
      UI.openModal('user-modal')
    }

    function confirmUserDelete(id) {
      const user = getTenant().users.find((u) => u.id === id)
      if (!user) return
      UI.confirm({
        title: 'Remove user',
        confirmLabel: 'Remove',
        message: `Remove <strong>${user.name}</strong> from this tenant? This can't be undone.`,
        onConfirm: () => {
          Store.removeTenantUser(tenantId, id)
          renderUsers()
          UI.toast(`"${user.name}" removed successfully!`)
        },
      })
    }

    document.getElementById('add-user-btn').addEventListener('click', openUserAdd)
    document.getElementById('users-search').addEventListener('input', renderUsers)
    document.getElementById('user-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const name = document.getElementById('tu-name').value.trim()
      const email = document.getElementById('tu-email').value.trim()
      if (!name || !email) return
      const role = document.getElementById('tu-role').value
      if (editingUserId) {
        Store.updateTenantUser(tenantId, editingUserId, { name, email, role })
        UI.toast(`"${name}" updated successfully!`)
      } else {
        Store.addTenantUser(tenantId, { name, email, role })
        UI.toast(`"${name}" added successfully!`)
      }
      UI.closeModal('user-modal')
      renderUsers()
    })

    // ----------------------------------------------------------- devices
    function renderDevices() {
      const t = getTenant()
      const term = document.getElementById('devices-search').value.trim().toLowerCase()
      const devices = term ? t.devices.filter((d) => d.name.toLowerCase().includes(term)) : t.devices
      const tbody = document.getElementById('devices-tbody')
      if (devices.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-table-note">No devices for this tenant yet.</td></tr>'
        return
      }
      tbody.innerHTML = devices
        .map(
          (d) => `
        <tr>
          <td>${d.name}</td>
          <td><span class="status-pill status-${d.status}">${d.status}</span></td>
          <td>${d.createdDate}</td>
          <td class="data-table-menu-col">
            <div class="row-menu">
              <button type="button" class="row-menu-button" data-menu-toggle>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
              </button>
              <div class="row-menu-dropdown">
                <button type="button" class="row-menu-item" data-device-toggle="${d.id}">
                  ${d.status === 'operational'
                    ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
                    : '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 5l12 7-12 7V5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
                  ${d.status === 'operational' ? 'Mark offline' : 'Mark operational'}
                </button>
                <button type="button" class="row-menu-item" data-device-edit="${d.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Edit
                </button>
                <button type="button" class="row-menu-item danger" data-device-delete="${d.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                  Delete
                </button>
              </div>
            </div>
          </td>
        </tr>`,
        )
        .join('')

      document.querySelectorAll('[data-device-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const id = btn.getAttribute('data-device-toggle')
          const device = getTenant().devices.find((x) => x.id === id)
          Store.toggleTenantDeviceStatus(tenantId, id)
          renderDevices()
          UI.toast(`"${device.name}" status updated successfully!`)
        }),
      )
      document.querySelectorAll('[data-device-edit]').forEach((btn) =>
        btn.addEventListener('click', (event) => { event.stopPropagation(); openDeviceEdit(btn.getAttribute('data-device-edit')) }),
      )
      document.querySelectorAll('[data-device-delete]').forEach((btn) =>
        btn.addEventListener('click', (event) => { event.stopPropagation(); confirmDeviceDelete(btn.getAttribute('data-device-delete')) }),
      )
      wireMenuToggles(tbody)
    }

    function openDeviceAdd() {
      editingDeviceId = null
      document.getElementById('device-modal-title').textContent = 'Add device'
      document.getElementById('device-save-btn').textContent = 'Create'
      document.getElementById('td-name').value = ''
      UI.openModal('device-modal')
    }

    function openDeviceEdit(id) {
      const device = getTenant().devices.find((d) => d.id === id)
      if (!device) return
      editingDeviceId = id
      document.getElementById('device-modal-title').textContent = 'Edit device'
      document.getElementById('device-save-btn').textContent = 'Save changes'
      document.getElementById('td-name').value = device.name
      UI.openModal('device-modal')
    }

    function confirmDeviceDelete(id) {
      const device = getTenant().devices.find((d) => d.id === id)
      if (!device) return
      UI.confirm({
        message: `Delete <strong>${device.name}</strong>? This can't be undone.`,
        onConfirm: () => {
          Store.removeTenantDevice(tenantId, id)
          renderDevices()
          UI.toast(`"${device.name}" deleted successfully!`)
        },
      })
    }

    document.getElementById('add-device-btn').addEventListener('click', openDeviceAdd)
    document.getElementById('devices-search').addEventListener('input', renderDevices)
    document.getElementById('device-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const name = document.getElementById('td-name').value.trim()
      if (!name) return
      if (editingDeviceId) {
        Store.updateTenantDevice(tenantId, editingDeviceId, { name })
        UI.toast(`"${name}" updated successfully!`)
      } else {
        Store.addTenantDevice(tenantId, { name })
        UI.toast(`"${name}" device added successfully!`)
      }
      UI.closeModal('device-modal')
      renderDevices()
    })

    // ------------------------------------------------------- applications
    function renderApplications() {
      const t = getTenant()
      const term = document.getElementById('applications-search').value.trim().toLowerCase()
      const apps = term ? t.applications.filter((a) => a.name.toLowerCase().includes(term)) : t.applications
      const tbody = document.getElementById('applications-tbody')
      if (apps.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-table-note">No applications for this tenant yet.</td></tr>'
        return
      }
      tbody.innerHTML = apps
        .map(
          (a) => `
        <tr>
          <td>${a.name}</td>
          <td><span class="status-pill status-${a.status}">${a.status}</span></td>
          <td>${a.createdDate}</td>
          <td class="data-table-menu-col">
            <div class="row-menu">
              <button type="button" class="row-menu-button" data-menu-toggle>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
              </button>
              <div class="row-menu-dropdown">
                <button type="button" class="row-menu-item" data-app-toggle="${a.id}">
                  ${a.status === 'active'
                    ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
                    : '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 5l12 7-12 7V5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
                  ${a.status === 'active' ? 'Suspend' : 'Activate'}
                </button>
                <button type="button" class="row-menu-item" data-app-edit="${a.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Edit
                </button>
                <button type="button" class="row-menu-item danger" data-app-delete="${a.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                  Delete
                </button>
              </div>
            </div>
          </td>
        </tr>`,
        )
        .join('')

      document.querySelectorAll('[data-app-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const id = btn.getAttribute('data-app-toggle')
          const app = getTenant().applications.find((x) => x.id === id)
          Store.toggleTenantApplicationStatus(tenantId, id)
          renderApplications()
          UI.toast(`"${app.name}" status updated successfully!`)
        }),
      )
      document.querySelectorAll('[data-app-edit]').forEach((btn) =>
        btn.addEventListener('click', (event) => { event.stopPropagation(); openApplicationEdit(btn.getAttribute('data-app-edit')) }),
      )
      document.querySelectorAll('[data-app-delete]').forEach((btn) =>
        btn.addEventListener('click', (event) => { event.stopPropagation(); confirmApplicationDelete(btn.getAttribute('data-app-delete')) }),
      )
      wireMenuToggles(tbody)
    }

    function openApplicationAdd() {
      editingApplicationId = null
      document.getElementById('application-modal-title').textContent = 'Add application'
      document.getElementById('application-save-btn').textContent = 'Create'
      document.getElementById('ta-name').value = ''
      UI.openModal('application-modal')
    }

    function openApplicationEdit(id) {
      const app = getTenant().applications.find((a) => a.id === id)
      if (!app) return
      editingApplicationId = id
      document.getElementById('application-modal-title').textContent = 'Edit application'
      document.getElementById('application-save-btn').textContent = 'Save changes'
      document.getElementById('ta-name').value = app.name
      UI.openModal('application-modal')
    }

    function confirmApplicationDelete(id) {
      const app = getTenant().applications.find((a) => a.id === id)
      if (!app) return
      UI.confirm({
        message: `Delete <strong>${app.name}</strong>? This can't be undone.`,
        onConfirm: () => {
          Store.removeTenantApplication(tenantId, id)
          renderApplications()
          UI.toast(`"${app.name}" deleted successfully!`)
        },
      })
    }

    document.getElementById('add-application-btn').addEventListener('click', openApplicationAdd)
    document.getElementById('applications-search').addEventListener('input', renderApplications)
    document.getElementById('application-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const name = document.getElementById('ta-name').value.trim()
      if (!name) return
      if (editingApplicationId) {
        Store.updateTenantApplication(tenantId, editingApplicationId, { name })
        UI.toast(`"${name}" updated successfully!`)
      } else {
        Store.addTenantApplication(tenantId, { name })
        UI.toast(`"${name}" application added successfully!`)
      }
      UI.closeModal('application-modal')
      renderApplications()
    })

    // ------------------------------------------------------------- init
    if (!getTenant()) {
      document.getElementById('tenant-body').classList.add('hidden')
      document.getElementById('not-found').classList.remove('hidden')
    } else {
      renderHeader()
      renderUsers()
      renderDevices()
      renderApplications()
    }
  </script>
</body>
</html>
