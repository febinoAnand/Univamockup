<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <title>Shift — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Shift</h1>
            <p class="page-subtitle">Define reusable shift time windows</p>
          </div>
          <div class="page-header-actions">
            <button type="button" class="solid-action-button" id="add-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
              Add shift
            </button>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem;">
          <div class="table-search-wrap" style="margin-bottom:0;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
            <input type="text" id="search" placeholder="Search shifts" />
          </div>
          <div id="view-toggle-slot"></div>
        </div>

        <div class="table-scroll" id="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th><button type="button" class="th-sort-button" data-sort="name">Name<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="name"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
                <th>From</th>
                <th>To</th>
                <th>Midnight crossed</th>
                <th>Status</th>
                <th><button type="button" class="th-sort-button" data-sort="createdDate">Created Date<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="createdDate"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
                <th class="data-table-menu-col"></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="shift-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Add shift</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('shift-modal')" aria-label="Close" title="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="shift-form">
          <div class="modal-field"><label for="shift-name">Shift name*</label><input id="shift-name" type="text" required /></div>
          <div class="modal-field-grid">
            <div class="modal-field"><label for="shift-start">From*</label><input id="shift-start" type="time" required /></div>
            <div class="modal-field"><label for="shift-end">To*</label><input id="shift-end" type="time" required /></div>
          </div>
          <div class="modal-field">
            <label class="checkbox-label">
              <input type="checkbox" id="shift-midnight-crossed" style="width:15px; height:15px;" />
              This shift crosses midnight (e.g. 22:00 – 06:00)
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('shift-modal')">Cancel</button>
        <button type="submit" form="shift-form" class="modal-button primary" id="save-btn">Create</button>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    Layout.mount({
      active: 'shift-management',
      breadcrumbs: [
        { label: 'Home', href: 'dashboard.html' },
        { label: 'Shift management', href: 'shift-management.html' },
        { label: 'Shift' },
      ],
    })

    let editingId = null
    let sort = { key: null, direction: 'asc' }

    function compareValues(a, b, direction) {
      const result = String(a).localeCompare(String(b))
      return direction === 'asc' ? result : -result
    }

    function formatTime(t) {
      if (!t) return '—'
      const [hStr, mStr] = t.split(':')
      let h = parseInt(hStr, 10)
      const period = h >= 12 ? 'PM' : 'AM'
      h = h % 12
      if (h === 0) h = 12
      return `${h}:${mStr} ${period}`
    }

    document.querySelectorAll('[data-sort]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-sort')
        sort = sort.key === key ? { key, direction: sort.direction === 'asc' ? 'desc' : 'asc' } : { key, direction: 'asc' }
        render()
      })
    })

    function render() {
      const data = Store.get()
      const term = document.getElementById('search').value.trim().toLowerCase()
      let shifts = term ? data.shifts.filter((s) => s.name.toLowerCase().includes(term)) : data.shifts
      if (sort.key) shifts = [...shifts].sort((a, b) => compareValues(a[sort.key], b[sort.key], sort.direction))

      document.querySelectorAll('[data-sort-icon]').forEach((icon) => {
        const key = icon.getAttribute('data-sort-icon')
        icon.classList.toggle('flipped', sort.key === key && sort.direction === 'desc')
      })

      const tbody = document.getElementById('tbody')
      if (shifts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-table-note">No shifts match your search.</td></tr>'
        return
      }
      tbody.innerHTML = shifts
        .map(
          (s) => `
        <tr>
          <td class="card-title-cell">${s.name}</td>
          <td data-label="From">${formatTime(s.startTime)}</td>
          <td data-label="To">${formatTime(s.endTime)}</td>
          <td data-label="Midnight crossed">${s.midnightCrossed ? '<span class="day-chip">Crosses midnight</span>' : '—'}</td>
          <td data-label="Status"><span class="status-pill status-${s.status}" title="${s.status}">${s.status}</span></td>
          <td data-label="Created Date">${s.createdDate}</td>
          <td class="data-table-menu-col">
            <div class="row-menu">
              <button type="button" class="row-menu-button" data-menu-toggle>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
              </button>
              <div class="row-menu-dropdown">
                <button type="button" class="row-menu-item" data-toggle-status="${s.id}">
                  ${s.status === 'active'
                    ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
                    : '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 5l12 7-12 7V5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
                  ${s.status === 'active' ? 'Suspend' : 'Activate'}
                </button>
                <button type="button" class="row-menu-item" data-edit="${s.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Edit
                </button>
                <button type="button" class="row-menu-item danger" data-delete="${s.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                  Delete
                </button>
              </div>
            </div>
          </td>
        </tr>`,
        )
        .join('')

      document.querySelectorAll('[data-toggle-status]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-toggle-status')
          const s = Store.get().shifts.find((x) => x.id === id)
          Store.toggleShiftStatus(id)
          render()
          UI.toast(`"${s.name}" status updated successfully!`)
        }),
      )
      document.querySelectorAll('[data-edit]').forEach((btn) => btn.addEventListener('click', () => openEdit(btn.getAttribute('data-edit'))))
      document.querySelectorAll('[data-delete]').forEach((btn) => btn.addEventListener('click', () => confirmDelete(btn.getAttribute('data-delete'))))
      document.querySelectorAll('[data-menu-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const menu = btn.closest('.row-menu')
          const wasOpen = menu.classList.contains('open')
          UI.closeRowMenus()
          if (!wasOpen) UI.openRowMenu(btn)
        }),
      )
    }
    document.addEventListener('click', () => UI.closeRowMenus())

    function openAdd() {
      editingId = null
      document.getElementById('modal-title').textContent = 'Add shift'
      document.getElementById('save-btn').textContent = 'Create'
      document.getElementById('shift-name').value = ''
      document.getElementById('shift-start').value = '09:00'
      document.getElementById('shift-end').value = '17:00'
      document.getElementById('shift-midnight-crossed').checked = false
      UI.openModal('shift-modal')
    }

    function openEdit(id) {
      const s = Store.get().shifts.find((x) => x.id === id)
      if (!s) return
      editingId = id
      document.getElementById('modal-title').textContent = 'Edit shift'
      document.getElementById('save-btn').textContent = 'Save changes'
      document.getElementById('shift-name').value = s.name
      document.getElementById('shift-start').value = s.startTime
      document.getElementById('shift-end').value = s.endTime
      document.getElementById('shift-midnight-crossed').checked = !!s.midnightCrossed
      UI.openModal('shift-modal')
    }

    function confirmDelete(id) {
      const s = Store.get().shifts.find((x) => x.id === id)
      if (!s) return
      const inUseBy = Store.shiftInUseBy(id)
      if (inUseBy.length > 0) {
        UI.toast(`Remove "${s.name}" from ${inUseBy.join(', ')} before deleting it.`)
        return
      }
      UI.confirm({
        message: `Delete <strong>${s.name}</strong>? This can't be undone.`,
        onConfirm: () => {
          Store.removeShift(id)
          render()
          UI.toast(`"${s.name}" deleted successfully!`)
        },
      })
    }

    document.getElementById('view-toggle-slot').innerHTML = UI.viewToggleHtml('shift-management')
    UI.wireViewToggle('shift-management', document.getElementById('table-scroll'))

    document.getElementById('add-btn').addEventListener('click', openAdd)
    document.getElementById('search').addEventListener('input', render)

    document.getElementById('shift-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const name = document.getElementById('shift-name').value.trim()
      if (!name) return
      const startTime = document.getElementById('shift-start').value
      const endTime = document.getElementById('shift-end').value
      const midnightCrossed = document.getElementById('shift-midnight-crossed').checked

      if (editingId) {
        Store.updateShift(editingId, { name, startTime, endTime, midnightCrossed })
        UI.toast(`"${name}" updated successfully!`)
      } else {
        Store.addShift({ name, startTime, endTime, midnightCrossed })
        UI.toast(`"${name}" shift created successfully!`)
      }
      UI.closeModal('shift-modal')
      render()
    })

    render()
  </script>
</body>
</html>
