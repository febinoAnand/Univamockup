<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/auth.css" />
  <link rel="stylesheet" href="shared/signup.css" />
  <title>Sign up — Univa</title>
</head>
<body>
  <div class="login-page">
    <div class="login-card signup-card" id="form-card">
      <img src="assets/favicon.png" alt="Univa" class="auth-logo" />

      <form id="signup-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="username">Username <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.8 4.4-6 7.5-6s6.1 2.2 7.5 6" stroke-linecap="round"/></svg>
              </span>
              <input id="username" type="text" placeholder="Choose a username" required />
            </div>
            <div class="username-check-row">
              <button type="button" class="check-availability-button" id="check-availability-btn" disabled>Check availability</button>
              <span class="username-status hidden" id="username-status"></span>
            </div>
          </div>

          <div class="field">
            <label for="email">Email Address <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="m4 6.5 8 6.5 8-6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <input id="email" type="email" placeholder="your@email.com" required />
            </div>
          </div>

          <div class="field">
            <label for="companyName">Company Name <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1" stroke-linecap="round"/><path d="M10 21v-3h4v3"/></svg>
              </span>
              <input id="companyName" type="text" placeholder="Your company name" required />
            </div>
          </div>

          <div class="field">
            <label for="companyWebsite">Company Website</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.3 3.8 5.3 3.8 8.5s-1.3 6.2-3.8 8.5c-2.5-2.3-3.8-5.3-3.8-8.5S9.5 5.8 12 3.5Z"/></svg>
              </span>
              <input id="companyWebsite" type="url" placeholder="https://example.com" />
            </div>
          </div>

          <div class="field">
            <label for="contactNumber">Contact Number <span class="required">*</span></label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5.5 4h3l1.5 4-2 1.5a11 11 0 0 0 5.5 5.5l1.5-2 4 1.5v3a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 4 5.6 1.5 1.5 0 0 1 5.5 4Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <input id="contactNumber" type="tel" placeholder="Your phone number" required />
            </div>
          </div>

          <div class="field">
            <label for="teamSize">Team Size <span class="required">*</span></label>
            <select id="teamSize" class="select-field" required>
              <option value="" disabled selected>Select team size</option>
              <option>1-10</option>
              <option>11-50</option>
              <option>51-200</option>
              <option>201-500</option>
              <option>500+</option>
            </select>
          </div>

          <div class="field field-full">
            <label for="industry">Industry <span class="required">*</span></label>
            <select id="industry" class="select-field" required>
              <option value="" disabled selected>Select industry</option>
              <option>Construction</option>
              <option>Manufacturing</option>
              <option>Mining</option>
              <option>Logistics</option>
              <option>Energy</option>
              <option>Ports & Shipping</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field">
            <label for="password">Password <span class="required">*</span></label>
            <div class="input-wrap with-suffix">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              </span>
              <input id="password" type="password" placeholder="Create a password" required />
              <button type="button" class="suffix-button" id="toggle-password">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8"/></svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
            <div class="input-wrap with-suffix">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              </span>
              <input id="confirmPassword" type="password" placeholder="Re-enter your password" required />
              <button type="button" class="suffix-button" id="toggle-confirm-password">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8"/></svg>
              </button>
            </div>
            <p class="field-error hidden" id="password-mismatch">Passwords do not match</p>
          </div>
        </div>

        <div class="requirements-box">
          <p class="requirements-title">Password Requirements:</p>
          <ul class="requirements-list" id="requirements-list"></ul>
        </div>

        <button type="submit" class="login-button" id="create-account-btn" disabled>Create Account</button>
      </form>

      <p class="signup-row">Already have an account? <a href="login.html" class="link">Sign in</a></p>
      <p class="login-footer">© 2026 All rights reserved.</p>
    </div>

    <div class="login-card signup-card hidden" id="verify-card">
      <img src="assets/favicon.png" alt="Univa" class="auth-logo" />

      <div class="success-banner">
        <span class="success-banner-icon">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Account Created Successfully!
      </div>

      <form id="verify-email-form" novalidate>
        <h2 class="login-title">Verify email</h2>
        <p class="login-subtitle">Enter the email you signed up with to continue.</p>

        <div class="field">
          <label for="verifyEmail">Email Address <span class="required">*</span></label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="m4 6.5 8 6.5 8-6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <input id="verifyEmail" type="email" disabled />
          </div>
        </div>

        <button type="submit" class="login-button">Verify</button>
      </form>

      <p class="return-link-row"><a href="login.html" class="return-link">Return to Login</a></p>
    </div>
  </div>

  <script src="shared/ui.js"></script>
  <script>
    const RESERVED_USERNAMES = new Set(['admin', 'root', 'test', 'user', 'demo', 'support'])

    function isUsernameTaken(value) {
      const normalized = value.trim().toLowerCase()
      if (RESERVED_USERNAMES.has(normalized)) return true
      let hash = 0
      for (let i = 0; i < normalized.length; i++) {
        hash = (hash * 31 + normalized.charCodeAt(i)) >>> 0
      }
      return hash % 5 === 0
    }

    let usernameStatus = 'idle'
    const usernameInput = document.getElementById('username')
    const checkBtn = document.getElementById('check-availability-btn')
    const statusEl = document.getElementById('username-status')

    usernameInput.addEventListener('input', () => {
      usernameStatus = 'idle'
      checkBtn.disabled = !usernameInput.value.trim()
      statusEl.classList.add('hidden')
      updateSubmitState()
    })

    checkBtn.addEventListener('click', () => {
      if (!usernameInput.value.trim() || usernameStatus === 'checking') return
      usernameStatus = 'checking'
      checkBtn.disabled = true
      checkBtn.textContent = 'Checking…'
      statusEl.classList.add('hidden')
      setTimeout(() => {
        usernameStatus = isUsernameTaken(usernameInput.value) ? 'taken' : 'available'
        checkBtn.disabled = false
        checkBtn.textContent = 'Check availability'
        statusEl.classList.remove('hidden')
        if (usernameStatus === 'available') {
          statusEl.className = 'username-status available'
          statusEl.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg> Username is available'
        } else {
          statusEl.className = 'username-status taken'
          statusEl.innerHTML = '<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg> Username is already taken'
        }
        updateSubmitState()
      }, 500)
    })

    UI.wireShowHideToggle('password', 'toggle-password')
    UI.wireShowHideToggle('confirmPassword', 'toggle-confirm-password')

    const passwordInput = document.getElementById('password')
    const confirmPasswordInput = document.getElementById('confirmPassword')
    const createAccountBtn = document.getElementById('create-account-btn')
    const mismatchEl = document.getElementById('password-mismatch')

    function allRequirementsMet() {
      return UI.allPasswordRequirementsMet(passwordInput.value)
    }
    function passwordsMatch() {
      return confirmPasswordInput.value.length > 0 && passwordInput.value === confirmPasswordInput.value
    }

    function updateSubmitState() {
      document.getElementById('requirements-list').innerHTML = UI.passwordRequirementsHtml(passwordInput.value)
      mismatchEl.classList.toggle('hidden', !(confirmPasswordInput.value.length > 0 && !passwordsMatch()))
      createAccountBtn.disabled = !(usernameStatus === 'available' && allRequirementsMet() && passwordsMatch())
    }
    passwordInput.addEventListener('input', updateSubmitState)
    confirmPasswordInput.addEventListener('input', updateSubmitState)
    updateSubmitState()

    document.getElementById('signup-form').addEventListener('submit', function (event) {
      event.preventDefault()
      if (usernameStatus !== 'available' || !allRequirementsMet() || !passwordsMatch()) return
      document.getElementById('verifyEmail').value = document.getElementById('email').value
      document.getElementById('form-card').classList.add('hidden')
      document.getElementById('verify-card').classList.remove('hidden')
    })

    document.getElementById('verify-email-form').addEventListener('submit', function (event) {
      event.preventDefault()
      window.location.href = 'awaiting-approval.html'
    })
  </script>
</body>
</html>
