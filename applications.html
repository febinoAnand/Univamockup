<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <title>Applications — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Applications</h1>
            <p class="page-subtitle">Software applications and services running on your platform</p>
          </div>
          <div class="page-header-actions">
            <button type="button" class="solid-action-button" id="add-btn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
              Add application
            </button>
          </div>
        </div>

        <div class="table-search-wrap">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
          <input type="text" id="search" placeholder="Search applications" />
        </div>

        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th><button type="button" class="th-sort-button" data-sort="name">Name<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="name"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
                <th><button type="button" class="th-sort-button" data-sort="profileName">Profile<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="profileName"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
                <th>Description</th>
                <th>Status</th>
                <th><button type="button" class="th-sort-button" data-sort="createdDate">Created Date<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" class="sort-icon" data-sort-icon="createdDate"><path d="M12 5v14M7 10l5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></th>
                <th class="data-table-menu-col"></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="app-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Add application</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('app-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="app-form">
          <div class="modal-field"><label for="app-name">Application name*</label><input id="app-name" type="text" required /></div>
          <div class="modal-field"><label for="app-profile">Application profile</label><select id="app-profile"></select></div>
          <div class="modal-field"><label for="app-description">Description</label><textarea id="app-description" rows="3"></textarea></div>
          <div class="modal-field"><label>Metadata attributes</label><div class="metadata-fields" id="metadata-fields"></div></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('app-modal')">Cancel</button>
        <button type="submit" form="app-form" class="modal-button primary" id="save-btn">Create</button>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    Layout.mount({
      active: 'applications',
      breadcrumbs: [
        { label: 'Home', href: 'dashboard.html' },
        { label: 'Application management', href: 'applications.html' },
        { label: 'Applications' },
      ],
    })

    let editingId = null
    let metadataRows = []
    let metadataNextId = 1
    let sort = { key: null, direction: 'asc' }

    function compareValues(a, b, direction) {
      const result = String(a).localeCompare(String(b))
      return direction === 'asc' ? result : -result
    }

    document.querySelectorAll('[data-sort]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-sort')
        sort = sort.key === key ? { key, direction: sort.direction === 'asc' ? 'desc' : 'asc' } : { key, direction: 'asc' }
        render()
      })
    })

    function renderMetadata() {
      document.getElementById('metadata-fields').innerHTML = metadataRows
        .map(
          (row) => `
        <div class="metadata-row">
          <button type="button" class="metadata-remove" data-remove="${row.id}" aria-label="Remove attribute">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
          </button>
          <div class="modal-field"><label>Key*</label><input type="text" data-key="${row.id}" value="${row.key}" /></div>
          <div class="modal-field"><label>Value</label><input type="text" data-value="${row.id}" value="${row.value}" /></div>
        </div>`,
        )
        .join('') + `<button type="button" class="metadata-add" id="metadata-add-btn">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
          Add
        </button>`
      document.getElementById('metadata-add-btn').addEventListener('click', () => {
        metadataRows.push({ id: metadataNextId++, key: '', value: '' })
        renderMetadata()
      })
      document.querySelectorAll('[data-remove]').forEach((btn) =>
        btn.addEventListener('click', () => {
          metadataRows = metadataRows.filter((r) => r.id !== Number(btn.getAttribute('data-remove')))
          renderMetadata()
        }),
      )
      document.querySelectorAll('[data-key]').forEach((input) =>
        input.addEventListener('input', () => { metadataRows.find((r) => r.id === Number(input.getAttribute('data-key'))).key = input.value }),
      )
      document.querySelectorAll('[data-value]').forEach((input) =>
        input.addEventListener('input', () => { metadataRows.find((r) => r.id === Number(input.getAttribute('data-value'))).value = input.value }),
      )
    }

    function render() {
      const data = Store.get()
      const term = document.getElementById('search').value.trim().toLowerCase()
      let apps = term ? data.applications.filter((a) => a.name.toLowerCase().includes(term)) : data.applications
      if (sort.key) apps = [...apps].sort((a, b) => compareValues(a[sort.key], b[sort.key], sort.direction))

      document.querySelectorAll('[data-sort-icon]').forEach((icon) => {
        const key = icon.getAttribute('data-sort-icon')
        icon.classList.toggle('flipped', sort.key === key && sort.direction === 'desc')
      })

      const tbody = document.getElementById('tbody')
      if (apps.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-table-note">No applications match your search.</td></tr>'
        return
      }
      tbody.innerHTML = apps
        .map(
          (a) => `
        <tr>
          <td>${a.name}</td>
          <td>${a.profileName || '—'}</td>
          <td>${a.description || '—'}</td>
          <td><span class="status-pill status-${a.status}">${a.status}</span></td>
          <td>${a.createdDate}</td>
          <td class="data-table-menu-col">
            <div class="row-menu">
              <button type="button" class="row-menu-button" data-menu-toggle>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
              </button>
              <div class="row-menu-dropdown">
                <button type="button" class="row-menu-item" data-toggle-status="${a.id}">
                  ${a.status === 'active'
                    ? '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
                    : '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 5l12 7-12 7V5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
                  ${a.status === 'active' ? 'Suspend' : 'Activate'}
                </button>
                <button type="button" class="row-menu-item" data-edit="${a.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Edit
                </button>
                <button type="button" class="row-menu-item danger" data-delete="${a.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                  Delete
                </button>
              </div>
            </div>
          </td>
        </tr>`,
        )
        .join('')

      document.querySelectorAll('[data-toggle-status]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-toggle-status')
          const a = Store.get().applications.find((x) => x.id === id)
          Store.toggleApplicationStatus(id)
          render()
          UI.toast(`"${a.name}" status updated successfully!`)
        }),
      )
      document.querySelectorAll('[data-edit]').forEach((btn) => btn.addEventListener('click', () => openEdit(btn.getAttribute('data-edit'))))
      document.querySelectorAll('[data-delete]').forEach((btn) => btn.addEventListener('click', () => confirmDelete(btn.getAttribute('data-delete'))))
      document.querySelectorAll('[data-menu-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const menu = btn.closest('.row-menu')
          const wasOpen = menu.classList.contains('open')
          UI.closeRowMenus()
          if (!wasOpen) UI.openRowMenu(btn)
        }),
      )
    }
    document.addEventListener('click', () => UI.closeRowMenus())

    function populateForm(profileName) {
      const data = Store.get()
      document.getElementById('app-profile').innerHTML = data.applicationProfiles.map((p) => `<option value="${p.name}">${p.name}</option>`).join('')
      document.getElementById('app-profile').value = profileName
    }

    function openAdd() {
      editingId = null
      metadataRows = []
      metadataNextId = 1
      document.getElementById('modal-title').textContent = 'Add application'
      document.getElementById('save-btn').textContent = 'Create'
      document.getElementById('app-name').value = ''
      document.getElementById('app-description').value = ''
      const data = Store.get()
      populateForm(data.applicationProfiles[0]?.name ?? '')
      renderMetadata()
      UI.openModal('app-modal')
    }

    function openEdit(id) {
      const a = Store.get().applications.find((x) => x.id === id)
      if (!a) return
      editingId = id
      metadataRows = (a.metadata || []).map((f, i) => ({ id: i + 1, key: f.key, value: f.value }))
      metadataNextId = metadataRows.length + 1
      document.getElementById('modal-title').textContent = 'Edit application'
      document.getElementById('save-btn').textContent = 'Save changes'
      document.getElementById('app-name').value = a.name
      document.getElementById('app-description').value = a.description || ''
      populateForm(a.profileName)
      renderMetadata()
      UI.openModal('app-modal')
    }

    function confirmDelete(id) {
      const a = Store.get().applications.find((x) => x.id === id)
      if (!a) return
      UI.confirm({
        message: `Delete <strong>${a.name}</strong>? This can't be undone.`,
        onConfirm: () => {
          Store.removeApplication(id)
          render()
          UI.toast(`"${a.name}" deleted successfully!`)
        },
      })
    }

    document.getElementById('add-btn').addEventListener('click', openAdd)
    document.getElementById('search').addEventListener('input', render)

    document.getElementById('app-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const name = document.getElementById('app-name').value.trim()
      if (!name) return
      const profileName = document.getElementById('app-profile').value
      const description = document.getElementById('app-description').value.trim()
      const metadata = metadataRows.filter((r) => r.key.trim()).map((r) => ({ key: r.key.trim(), value: r.value.trim() }))

      if (editingId) {
        Store.updateApplication(editingId, { name, profileName, description, metadata })
        UI.toast(`"${name}" updated successfully!`)
      } else {
        Store.addApplication({ name, profileName, description, metadata })
        UI.toast(`"${name}" application created successfully!`)
      }
      UI.closeModal('app-modal')
      render()
    })

    render()
  </script>
</body>
</html>
