<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/rule-engine.css" />
  <title>Rule engine reports — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Rule engine reports</h1>
            <p class="page-subtitle">History of rule engine executions triggered by device activity</p>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem;">
          <div class="table-search-wrap" style="margin-bottom:0;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
            <input type="text" id="search" placeholder="Search by rule engine name" />
          </div>
          <div id="view-toggle-slot"></div>
        </div>

        <div class="table-scroll" id="table-scroll">
          <table class="data-table">
            <thead><tr><th>Rule engine</th><th>Triggered at</th><th>Trigger</th><th>Condition</th><th>Action</th><th>Outcome</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="execution-detail-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Execution details</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('execution-detail-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="execution-detail-grid" id="execution-detail-grid"></div>
        <div class="execution-fail-box hidden" id="execution-fail-box">
          <strong>Failure reason</strong>
          <p id="execution-fail-reason"></p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('execution-detail-modal')">Close</button>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    Layout.mount({
      active: 'rule-engine-reports',
      breadcrumbs: [
        { label: 'Home', href: 'dashboard.html' },
        { label: 'Rule engines', href: 'rule-engines.html' },
        { label: 'Reports' },
      ],
    })

    function render() {
      const data = Store.get()
      const term = document.getElementById('search').value.trim().toLowerCase()
      const rows = term ? data.ruleEngineExecutions.filter((e) => e.ruleEngineName.toLowerCase().includes(term)) : data.ruleEngineExecutions
      const tbody = document.getElementById('tbody')
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-table-note">No executions match your search.</td></tr>'
        return
      }
      tbody.innerHTML = rows
        .map(
          (e) => `
        <tr class="clickable-row" data-open="${e.id}">
          <td class="card-title-cell">${e.ruleEngineName}</td>
          <td data-label="Triggered at">${e.triggeredAt}</td>
          <td data-label="Trigger"><span class="rule-summary-pill">${e.triggerType}</span></td>
          <td data-label="Condition">${e.condition}</td>
          <td data-label="Action">${e.actionType}</td>
          <td data-label="Outcome"><span class="outcome-pill outcome-${e.outcome}">${e.outcome}</span></td>
        </tr>`,
        )
        .join('')
      document.querySelectorAll('[data-open]').forEach((tr) => tr.addEventListener('click', () => openDetail(tr.getAttribute('data-open'))))
    }

    function openDetail(id) {
      const e = Store.get().ruleEngineExecutions.find((x) => x.id === id)
      if (!e) return
      const rows = [
        ['Rule engine', e.ruleEngineName],
        ['Triggered at', e.triggeredAt],
        ['Trigger', e.triggerType],
        ['Device', e.deviceName || 'All devices'],
        ['Condition', e.condition],
        ['Action', e.actionType],
        ['Action detail', e.actionDetail || '—'],
        ['Duration', e.durationMs != null ? `${e.durationMs} ms` : '—'],
        ['Outcome', `<span class="outcome-pill outcome-${e.outcome}">${e.outcome}</span>`],
      ]
      document.getElementById('execution-detail-grid').innerHTML = rows
        .map(([label, value]) => `<div class="execution-detail-row"><span class="execution-detail-label">${label}</span><span class="execution-detail-value">${value}</span></div>`)
        .join('')
      const failBox = document.getElementById('execution-fail-box')
      failBox.classList.toggle('hidden', e.outcome !== 'failed')
      if (e.outcome === 'failed') document.getElementById('execution-fail-reason').textContent = e.failReason || 'No additional details recorded.'
      UI.openModal('execution-detail-modal')
    }

    document.getElementById('search').addEventListener('input', render)
    render()

    document.getElementById('view-toggle-slot').innerHTML = UI.viewToggleHtml('rule-engine-reports')
    UI.wireViewToggle('rule-engine-reports', document.getElementById('table-scroll'))
  </script>
</body>
</html>
