<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <link rel="stylesheet" href="shared/devices.css" />
  <link rel="stylesheet" href="shared/device-detail.css" />
  <title>Asset — Univa</title>
  <style>
    #metadata-panel {
      max-width: 50%;
    }
    @media (max-width: 900px) {
      #metadata-panel {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content" style="padding:0;">
        <div id="asset-detail-root"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="asset-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Edit asset</h2>
        <button type="button" class="modal-close" onclick="UI.closeModal('asset-modal')" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="asset-form">
          <div class="modal-field"><label for="asset-name">Asset name*</label><input id="asset-name" type="text" required /></div>
          <div class="modal-field">
            <label>Asset groups</label>
            <div class="checklist-search-wrap">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
              <input type="text" id="asset-groups-search" placeholder="Search asset groups" />
            </div>
            <div class="group-checkbox-list" id="asset-groups-list"></div>
          </div>
          <div class="modal-field"><label for="asset-profile">Asset profile</label><select id="asset-profile"></select></div>
          <div class="modal-field"><label for="asset-location">Location</label><input id="asset-location" type="text" /></div>
          <div class="modal-field">
            <label>Devices</label>
            <div class="checklist-search-wrap">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
              <input type="text" id="asset-devices-search" placeholder="Search devices" />
            </div>
            <div class="group-checkbox-list" id="asset-devices-list"></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-button secondary" onclick="UI.closeModal('asset-modal')">Cancel</button>
        <button type="submit" form="asset-form" class="modal-button primary">Save changes</button>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    // The asset id travels in the URL hash — see device-detail.html for why.
    const assetId = window.location.hash.slice(1)

    function getAsset() {
      return Store.get().assets.find((a) => a.id === assetId)
    }

    const initialAsset = getAsset()
    Layout.mount({
      active: 'assets',
      breadcrumbs: initialAsset
        ? [
            { label: 'Home', href: 'dashboard.html' },
            { label: 'Assets', href: 'assets.html' },
            { label: initialAsset.name },
          ]
        : [
            { label: 'Home', href: 'dashboard.html' },
            { label: 'Assets', href: 'assets.html' },
          ],
    })

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    }

    /* ------------------------------------------------------------ icons */
    const SEARCH_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>'
    const EDIT_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20Z" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    const TRASH_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>'
    const LIST_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke-linecap="round"/></svg>'
    const CHART_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 15l4-5 3 3 5-7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    const REFRESH_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 2l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11V9a4 4 0 0 1 4-4h14" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 22l-4-4 4-4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v2a4 4 0 0 1-4 4H3" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    const EXPAND_SVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    const MORE_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>'
    function chevronSvg(expanded, deg) {
      deg = deg == null ? (expanded ? 0 : -90) : (expanded ? deg : 0)
      return `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" style="transform:rotate(${deg}deg);transition:transform 0.15s ease;"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    }

    /* ------------------------------------------------------- telemetry math
       Identical algorithm to device-detail.js's (same hash/PRNG), kept as
       its own copy so this page has no dependency on that file — it only
       needs an id string to seed off, which an asset's id works for too. */
    function hashString(value) {
      let hash = 0x811c9dc5
      for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i)
        hash = Math.imul(hash, 0x01000193)
      }
      return hash >>> 0
    }
    function mulberry32(seed) {
      let t = seed
      return function random() {
        t |= 0
        t = (t + 0x6d2b79f5) | 0
        let r = Math.imul(t ^ (t >>> 15), 1 | t)
        r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296
      }
    }
    const BUCKET_MS = 60000
    const RANGE_PRESETS = {
      '5m': { label: 'Last 5 minutes', windowMs: 5 * 60000, stepMs: 15000 },
      '1h': { label: 'Last 1 hour', windowMs: 60 * 60000, stepMs: 60000 },
      '24h': { label: 'Last 24 hours', windowMs: 24 * 60 * 60000, stepMs: 15 * 60000 },
      '7d': { label: 'Last 7 days', windowMs: 7 * 24 * 60 * 60000, stepMs: 60 * 60000 },
    }
    function telemetryValueAt(entityId, metricKey, timestampMs, metricConfig) {
      const baseline = metricConfig.baseline
      const amplitude = metricConfig.amplitude
      const dec = metricConfig.decimals == null ? 1 : metricConfig.decimals
      const bucket = Math.floor(timestampMs / BUCKET_MS)
      const rng = mulberry32(hashString(`${entityId}:${metricKey}:${bucket}`))
      const trend = Math.sin(bucket / 180) * amplitude
      const noise = (rng() - 0.5) * amplitude * 0.15
      return Number(Math.max(0, baseline + trend + noise).toFixed(dec))
    }
    function generateTelemetrySeries(entityId, metricKey, metricConfig, rangeKey, now) {
      const preset = RANGE_PRESETS[rangeKey] || RANGE_PRESETS['1h']
      const points = []
      for (let t = now - preset.windowMs; t <= now; t += preset.stepMs) {
        points.push({ timestamp: t, value: telemetryValueAt(entityId, metricKey, t, metricConfig) })
      }
      return points
    }

    const SERIES_COLORS = ['#7c3aed', '#0f766e', '#b45309', '#7c3aed', '#be123c', '#15803d']
    const CHART_WIDTH = 640
    const CHART_HEIGHT = 200
    const CHART_PADDING = 14
    let telemetryChartCache = null

    function computeCoordinates(points) {
      if (points.length === 0) return []
      const values = points.map((p) => p.value)
      const min = Math.min.apply(null, values)
      const max = Math.max.apply(null, values)
      const range = max - min || 1
      const usableWidth = CHART_WIDTH - CHART_PADDING * 2
      const usableHeight = CHART_HEIGHT - CHART_PADDING * 2
      return points.map((point, index) => {
        const x = CHART_PADDING + (points.length === 1 ? usableWidth / 2 : (index / (points.length - 1)) * usableWidth)
        const y = CHART_PADDING + usableHeight - ((point.value - min) / range) * usableHeight
        return { x: x, y: y, value: point.value, timestamp: point.timestamp }
      })
    }
    function linePath(coords) {
      if (coords.length === 0) return ''
      if (coords.length === 1) return `M ${coords[0].x},${coords[0].y}`
      let path = `M ${coords[0].x.toFixed(1)},${coords[0].y.toFixed(1)}`
      for (let i = 1; i < coords.length; i++) path += ` L ${coords[i].x.toFixed(1)},${coords[i].y.toFixed(1)}`
      return path
    }
    const Y_AXIS_TICK_FRACTIONS = [0, 0.25, 0.5, 0.75, 1]
    function yAxisTicks(points, unit) {
      if (points.length === 0) return []
      const values = points.map((p) => p.value)
      const min = Math.min.apply(null, values)
      const max = Math.max.apply(null, values)
      const range = max - min || 1
      return Y_AXIS_TICK_FRACTIONS.map((fraction) => ({ fraction: fraction, label: `${(max - fraction * range).toFixed(1)}${unit || ''}` }))
    }
    function xAxisTicks(points, range) {
      if (points.length === 0) return []
      const tickCount = Math.min(5, points.length)
      const step = (points.length - 1) / (tickCount - 1 || 1)
      const formatTs = range === '7d'
        ? (ts) => new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' })
        : (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      const ticks = []
      for (let tickIndex = 0; tickIndex < tickCount; tickIndex++) {
        const pointIndex = Math.round(tickIndex * step)
        ticks.push({ pointIndex: pointIndex, label: formatTs(points[pointIndex].timestamp) })
      }
      return ticks
    }

    /* ------------------------------------------------------------- state */
    let md = { search: '', searchOpen: false, editingIndex: null, editingValue: '' }
    let tm = { dataMode: 'telemetry', seriesPanelOpen: false, range: '1h', viewMode: 'chart', visibleMetrics: null, hoverIndex: null }

    function resetTelemetryState(asset) {
      tm = { dataMode: 'telemetry', seriesPanelOpen: false, range: '1h', viewMode: 'chart', visibleMetrics: new Set((asset.metrics || []).map((m) => m.key)), hoverIndex: null }
    }

    function wireMaximizeButtons(container) {
      container.querySelectorAll('.device-panel [aria-label="Expand"]').forEach((btn) => {
        UI.wireMaximizeButton(btn, btn.closest('.device-panel'))
      })
    }

    /* ---------------------------------------------------------- metadata */
    function assetDetailFields(asset) {
      return [
        { key: 'Status', value: asset.status },
        { key: 'Asset profile', value: asset.profileName || '—' },
        { key: 'Location', value: asset.location || '—' },
        { key: 'Asset groups', value: (asset.groupNames || []).join(', ') || '—' },
        { key: 'Created date', value: asset.createdDate },
        { key: 'Asset ID', value: asset.id },
      ]
    }

    function renderMetadataPanel() {
      const asset = getAsset()
      const query = md.search.trim().toLowerCase()
      const visibleDetails = assetDetailFields(asset).filter((f) => f.key.toLowerCase().includes(query))
      const indexed = (asset.metadata || []).map((f, i) => ({ key: f.key, value: f.value, _index: i }))
      const visible = indexed.filter((f) => f.key.toLowerCase().includes(query))
      return `
        <div class="device-panel-title-row">
          <h2 class="device-panel-title">${LIST_SVG}Metadata</h2>
          <div class="device-panel-title-actions">
            <button type="button" class="icon-button" aria-label="Expand">${EXPAND_SVG}</button>
            <button type="button" class="icon-button" id="metadata-search-toggle" aria-label="Search metadata">${SEARCH_SVG}</button>
          </div>
        </div>
        ${md.searchOpen ? `<input type="text" class="metadata-search-input" id="metadata-search-input" placeholder="Search metadata" value="${escapeHtml(md.search)}" />` : ''}
        <div class="metadata-scroll" id="metadata-scroll">
          ${visibleDetails.map((field) => `
          <div class="metadata-list-row">
            <span class="metadata-key">${escapeHtml(field.key)}</span>
            <span class="metadata-value">${escapeHtml(field.value)}</span>
          </div>`).join('')}
          ${visible.length === 0 && visibleDetails.length === 0 ? '<p class="section-empty">No metadata attributes</p>' : visible.map((field) => `
          <div class="metadata-list-row" data-field-index="${field._index}">
            <span class="metadata-key">${escapeHtml(field.key)}</span>
            ${md.editingIndex === field._index ? `
            <span class="metadata-edit-row">
              <input type="text" id="metadata-edit-input" value="${escapeHtml(md.editingValue)}" autofocus />
              <button type="button" class="text-link" data-save-field="${field._index}">Save</button>
            </span>` : `
            <span class="metadata-value">
              ${escapeHtml(field.value || '—')}
              <div class="row-menu">
                <button type="button" class="row-menu-button" data-menu-toggle>${MORE_SVG}</button>
                <div class="row-menu-dropdown metadata-row-menu-dropdown">
                  <button type="button" class="row-menu-item" data-edit-field="${field._index}">${EDIT_SVG}Edit value</button>
                  <button type="button" class="row-menu-item danger" data-delete-field="${field._index}">${TRASH_SVG}Delete value</button>
                </div>
              </div>
            </span>`}
          </div>`).join('')}
        </div>
        <div class="metadata-add-row">
          <input type="text" placeholder="Key" id="metadata-new-key" />
          <input type="text" placeholder="Value" id="metadata-new-value" />
          <button type="button" class="icon-button" id="metadata-add-btn" aria-label="Add metadata field">+</button>
        </div>`
    }

    function rerenderMetadataPanel() {
      const panel = document.getElementById('metadata-panel')
      panel.innerHTML = renderMetadataPanel()
      wireMetadataPanelEvents()
    }

    function wireMetadataPanelEvents() {
      const panel = document.getElementById('metadata-panel')
      document.getElementById('metadata-search-toggle').addEventListener('click', () => { md.searchOpen = !md.searchOpen; rerenderMetadataPanel() })
      const searchInput = document.getElementById('metadata-search-input')
      if (searchInput) searchInput.addEventListener('input', (e) => { md.search = e.target.value; rerenderMetadataPanel() })

      panel.querySelectorAll('[data-menu-toggle]').forEach((btn) => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const menu = btn.closest('.row-menu')
          const wasOpen = menu.classList.contains('open')
          UI.closeRowMenus(panel)
          if (!wasOpen) UI.openRowMenu(btn)
        })
      })

      panel.querySelectorAll('[data-edit-field]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const index = Number(btn.getAttribute('data-edit-field'))
          const field = (getAsset().metadata || [])[index]
          md.editingIndex = index
          md.editingValue = field ? field.value : ''
          rerenderMetadataPanel()
        })
      })
      panel.querySelectorAll('[data-delete-field]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const index = Number(btn.getAttribute('data-delete-field'))
          const field = (getAsset().metadata || [])[index]
          if (!field) return
          UI.confirm({
            message: `Delete metadata field <strong>${escapeHtml(field.key)}</strong>? This can't be undone.`,
            onConfirm: () => {
              Store.removeAssetMetadataFieldAt(assetId, index)
              UI.toast(`Removed "${field.key}"`)
              rerenderMetadataPanel()
            },
          })
        })
      })
      const editInput = document.getElementById('metadata-edit-input')
      if (editInput) {
        editInput.addEventListener('input', (e) => { md.editingValue = e.target.value })
        editInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') commitMetadataEdit() })
      }
      const saveBtn = panel.querySelector('[data-save-field]')
      if (saveBtn) saveBtn.addEventListener('click', () => commitMetadataEdit())

      document.getElementById('metadata-add-btn').addEventListener('click', () => {
        const keyInput = document.getElementById('metadata-new-key')
        const valueInput = document.getElementById('metadata-new-value')
        if (!keyInput.value.trim()) return
        Store.addAssetMetadataField(assetId, keyInput.value.trim(), valueInput.value.trim())
        UI.toast('Metadata field added')
        rerenderMetadataPanel()
      })
      wireMaximizeButtons(panel)
    }
    function commitMetadataEdit() {
      const field = (getAsset().metadata || [])[md.editingIndex]
      if (!field) return
      Store.updateAssetMetadataFieldAt(assetId, md.editingIndex, md.editingValue.trim())
      UI.toast(`Updated "${field.key}"`)
      md.editingIndex = null
      rerenderMetadataPanel()
    }
    document.addEventListener('click', () => UI.closeRowMenus())

    /* --------------------------------------------------------- telemetry */
    function telemetryHoverMarkup(seriesByMetric, visibleSeries, hoverIndex, guideX) {
      let markup = `<line x1="${guideX}" y1="${CHART_PADDING}" x2="${guideX}" y2="${CHART_HEIGHT - CHART_PADDING}" stroke="#d6d3d1" stroke-width="1" stroke-dasharray="3 3"/>`
      visibleSeries.forEach((entry) => {
        const colorIndex = seriesByMetric.indexOf(entry)
        const coord = entry.coords[hoverIndex]
        if (!coord) return
        markup += `<circle cx="${coord.x}" cy="${coord.y}" r="4" fill="${SERIES_COLORS[colorIndex % SERIES_COLORS.length]}" stroke="#ffffff" stroke-width="1.5"/>`
      })
      return markup
    }
    function telemetryTooltipMarkup(seriesByMetric, visibleSeries, hoverIndex, guideX) {
      return `<div class="chart-tooltip" style="left:${(guideX / CHART_WIDTH) * 100}%">
        <div class="chart-tooltip-time">${new Date(visibleSeries[0].points[hoverIndex].timestamp).toLocaleString()}</div>
        ${visibleSeries.map((entry) => {
          const colorIndex = seriesByMetric.indexOf(entry)
          return `<div class="chart-tooltip-row"><span class="legend-dot" style="background:${SERIES_COLORS[colorIndex % SERIES_COLORS.length]}"></span>${escapeHtml(entry.metric.label)}: <strong>${entry.points[hoverIndex].value}${entry.metric.unit}</strong></div>`
        }).join('')}
      </div>`
    }
    function updateTelemetryHover() {
      const overlay = document.getElementById('chart-hover-overlay')
      const tooltipSlot = document.getElementById('chart-tooltip-slot')
      if (!overlay || !telemetryChartCache) return
      const seriesByMetric = telemetryChartCache.seriesByMetric
      const visibleSeries = telemetryChartCache.visibleSeries
      const hoverIndex = tm.hoverIndex
      const guideX = hoverIndex !== null && visibleSeries.length > 0 && visibleSeries[0].coords[hoverIndex] ? visibleSeries[0].coords[hoverIndex].x : null
      if (hoverIndex === null || guideX === null) {
        overlay.innerHTML = ''
        if (tooltipSlot) tooltipSlot.innerHTML = ''
        return
      }
      overlay.innerHTML = telemetryHoverMarkup(seriesByMetric, visibleSeries, hoverIndex, guideX)
      if (tooltipSlot) tooltipSlot.innerHTML = telemetryTooltipMarkup(seriesByMetric, visibleSeries, hoverIndex, guideX)
    }

    function telemetryPanelHtml() {
      const asset = getAsset()
      const metrics = asset.metrics || []
      let inner
      if (tm.dataMode === 'analytics') {
        telemetryChartCache = null
        inner = '<div class="telemetry-empty">No analytics configured for this asset.</div>'
      } else {
        const seriesByMetric = metrics.map((metric) => {
          const points = generateTelemetrySeries(asset.id, metric.key, metric, tm.range, Date.now())
          return { metric: metric, points: points, coords: computeCoordinates(points) }
        })
        const visibleSeries = seriesByMetric.filter((entry) => tm.visibleMetrics.has(entry.metric.key))
        const primarySeries = visibleSeries[0]
        const yTicks = primarySeries ? yAxisTicks(primarySeries.points, primarySeries.metric.unit) : []
        const xTicks = primarySeries ? xAxisTicks(primarySeries.points, tm.range) : []
        const hoverIndex = tm.hoverIndex
        const guideX = hoverIndex !== null && visibleSeries.length > 0 && visibleSeries[0].coords[hoverIndex] ? visibleSeries[0].coords[hoverIndex].x : null

        let body
        if (visibleSeries.length === 0) {
          telemetryChartCache = null
          body = '<div class="telemetry-empty">No series selected.</div>'
        } else if (tm.viewMode === 'chart') {
          let gridLines = ''
          ;[0.25, 0.5, 0.75, 1].forEach((fraction) => {
            const y = CHART_PADDING + (CHART_HEIGHT - CHART_PADDING * 2) * fraction
            gridLines += `<line x1="${CHART_PADDING}" y1="${y}" x2="${CHART_WIDTH - CHART_PADDING}" y2="${y}" stroke="#e7e5e4" stroke-width="1"/>`
          })
          let paths = ''
          visibleSeries.forEach((entry) => {
            const colorIndex = seriesByMetric.indexOf(entry)
            const color = SERIES_COLORS[colorIndex % SERIES_COLORS.length]
            paths += `<path fill="none" stroke="${color}" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="${linePath(entry.coords)}"/>`
            entry.coords.forEach((c) => {
              paths += `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.5" fill="${color}" stroke="#ffffff" stroke-width="1"/>`
            })
          })
          const hoverMarkup = hoverIndex !== null && guideX !== null ? telemetryHoverMarkup(seriesByMetric, visibleSeries, hoverIndex, guideX) : ''
          const tooltipMarkup = hoverIndex !== null && guideX !== null ? telemetryTooltipMarkup(seriesByMetric, visibleSeries, hoverIndex, guideX) : ''
          telemetryChartCache = { seriesByMetric: seriesByMetric, visibleSeries: visibleSeries }
          body = `
            <div class="telemetry-chart-wrap" id="telemetry-chart-wrap">
              <div class="telemetry-chart-body">
                <div class="chart-y-axis">${yTicks.map((t) => `<span>${t.label}</span>`).join('')}</div>
                <div class="chart-plot-col">
                  <svg id="telemetry-svg" viewBox="0 0 ${CHART_WIDTH} ${CHART_HEIGHT}" preserveAspectRatio="none">
                    ${gridLines}${paths}<g id="chart-hover-overlay">${hoverMarkup}</g>
                  </svg>
                  <div class="chart-x-axis">${xTicks.map((t) => `<span>${t.label}</span>`).join('')}</div>
                  <div id="chart-tooltip-slot">${tooltipMarkup}</div>
                </div>
              </div>
            </div>`
        } else {
          telemetryChartCache = null
          const rows = visibleSeries[0].points.map((_, i) => i).reverse()
          body = `
            <div class="devices-table-scroll">
              <table class="data-table">
                <thead><tr><th>Timestamp</th>${visibleSeries.map((e) => `<th>${escapeHtml(e.metric.label)} (${e.metric.unit || '—'})</th>`).join('')}</tr></thead>
                <tbody>
                  ${rows.map((rowIndex) => `<tr><td>${new Date(visibleSeries[0].points[rowIndex].timestamp).toLocaleString()}</td>${visibleSeries.map((e) => `<td>${e.points[rowIndex].value}${e.metric.unit}</td>`).join('')}</tr>`).join('')}
                </tbody>
              </table>
            </div>`
        }

        inner = `
          <div class="telemetry-toolbar">
            <div class="telemetry-toolbar-left">
              <div class="telemetry-view-toggle">
                <button type="button" class="${tm.viewMode === 'chart' ? 'active' : ''}" data-view-mode="chart" aria-label="Chart view">${CHART_SVG}</button>
                <button type="button" class="${tm.viewMode === 'table' ? 'active' : ''}" data-view-mode="table" aria-label="Table view">${LIST_SVG}</button>
              </div>
              <button type="button" class="icon-button" id="telemetry-refresh-btn" aria-label="Refresh">${REFRESH_SVG}</button>
              <select class="telemetry-range-select" id="telemetry-range-select">
                ${Object.keys(RANGE_PRESETS).map((k) => `<option value="${k}" ${k === tm.range ? 'selected' : ''}>${RANGE_PRESETS[k].label}</option>`).join('')}
              </select>
            </div>
            <button type="button" class="series-panel-toggle" id="series-panel-toggle">${chevronSvg(tm.seriesPanelOpen, 90)}Selected ${tm.visibleMetrics.size}/${metrics.length} series</button>
          </div>
          ${tm.seriesPanelOpen ? `<div class="telemetry-legend">${seriesByMetric.map((entry, index) => `<button type="button" class="legend-chip${tm.visibleMetrics.has(entry.metric.key) ? '' : ' inactive'}" data-toggle-metric="${escapeHtml(entry.metric.key)}"><span class="legend-dot" style="background:${SERIES_COLORS[index % SERIES_COLORS.length]}"></span>${escapeHtml(entry.metric.label)}</button>`).join('')}</div>` : ''}
          ${body}`
      }

      return `
        <div class="device-panel-title-row">
          <h2 class="device-panel-title">${CHART_SVG}Telemetry</h2>
          <div class="device-panel-title-actions"><button type="button" class="icon-button" aria-label="Expand">${EXPAND_SVG}</button></div>
        </div>
        <div class="telemetry-mode-tabs">
          <button type="button" class="tab-button${tm.dataMode === 'telemetry' ? ' active' : ''}" data-data-mode="telemetry">Telemetry</button>
          <button type="button" class="tab-button${tm.dataMode === 'analytics' ? ' active' : ''}" data-data-mode="analytics">Analytics</button>
        </div>
        ${inner}`
    }

    function wireTelemetryPanelEvents() {
      const panel = document.getElementById('telemetry-panel')
      function rerenderTelemetry() {
        panel.innerHTML = telemetryPanelHtml()
        wireTelemetryPanelEvents()
      }
      panel.querySelectorAll('[data-data-mode]').forEach((btn) => {
        btn.addEventListener('click', () => { tm.dataMode = btn.getAttribute('data-data-mode'); rerenderTelemetry() })
      })
      panel.querySelectorAll('[data-view-mode]').forEach((btn) => {
        btn.addEventListener('click', () => { tm.viewMode = btn.getAttribute('data-view-mode'); rerenderTelemetry() })
      })
      const refreshBtn = document.getElementById('telemetry-refresh-btn')
      if (refreshBtn) refreshBtn.addEventListener('click', () => UI.toast('Telemetry refreshed'))
      const rangeSelect = document.getElementById('telemetry-range-select')
      if (rangeSelect) rangeSelect.addEventListener('change', (e) => { tm.range = e.target.value; tm.hoverIndex = null; rerenderTelemetry() })
      const seriesToggle = document.getElementById('series-panel-toggle')
      if (seriesToggle) seriesToggle.addEventListener('click', () => { tm.seriesPanelOpen = !tm.seriesPanelOpen; rerenderTelemetry() })
      panel.querySelectorAll('[data-toggle-metric]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-toggle-metric')
          if (tm.visibleMetrics.has(key)) tm.visibleMetrics.delete(key)
          else tm.visibleMetrics.add(key)
          rerenderTelemetry()
        })
      })
      const svg = document.getElementById('telemetry-svg')
      if (svg) {
        svg.addEventListener('mousemove', (event) => {
          if (!telemetryChartCache) return
          const visibleSeries = telemetryChartCache.visibleSeries
          if (visibleSeries.length === 0) return
          const count = visibleSeries[0].points.length
          if (count === 0) return
          const rect = svg.getBoundingClientRect()
          const relX = (event.clientX - rect.left) / rect.width
          const dataX = relX * CHART_WIDTH
          const usableWidth = CHART_WIDTH - CHART_PADDING * 2
          const raw = ((dataX - CHART_PADDING) / usableWidth) * (count - 1)
          const nextIndex = Math.max(0, Math.min(count - 1, Math.round(raw)))
          if (nextIndex === tm.hoverIndex) return
          tm.hoverIndex = nextIndex
          updateTelemetryHover()
        })
        const wrap = document.getElementById('telemetry-chart-wrap')
        if (wrap) wrap.addEventListener('mouseleave', () => {
          if (tm.hoverIndex === null) return
          tm.hoverIndex = null
          updateTelemetryHover()
        })
      }
      wireMaximizeButtons(panel)
    }

    /* --------------------------------------------------------- edit modal */
    function filterChecklist(listId, term) {
      const container = document.getElementById(listId)
      if (!container) return
      const t = term.trim().toLowerCase()
      const labels = Array.from(container.querySelectorAll('.modal-checkbox'))
      let visibleCount = 0
      labels.forEach((label) => {
        const match = !t || label.textContent.trim().toLowerCase().includes(t)
        label.style.display = match ? '' : 'none'
        if (match) visibleCount++
      })
      let emptyNote = container.querySelector('.checklist-no-match')
      if (labels.length > 0 && visibleCount === 0) {
        if (!emptyNote) {
          emptyNote = document.createElement('p')
          emptyNote.className = 'section-empty checklist-no-match'
          emptyNote.textContent = 'No matches found.'
          container.appendChild(emptyNote)
        }
      } else if (emptyNote) {
        emptyNote.remove()
      }
    }
    document.getElementById('asset-groups-search').addEventListener('input', (e) => filterChecklist('asset-groups-list', e.target.value))
    document.getElementById('asset-devices-search').addEventListener('input', (e) => filterChecklist('asset-devices-list', e.target.value))

    function populateForm(groupNames, profileName, deviceIds) {
      const data = Store.get()
      document.getElementById('asset-groups-list').innerHTML = data.assetGroups
        .map((g) => `<label class="modal-checkbox"><input type="checkbox" data-group="${g.name}" ${groupNames.includes(g.name) ? 'checked' : ''}/> ${g.name}</label>`)
        .join('')
      document.getElementById('asset-profile').innerHTML = data.assetProfiles.map((p) => `<option value="${p.name}">${p.name}</option>`).join('')
      document.getElementById('asset-profile').value = profileName
      document.getElementById('asset-devices-list').innerHTML =
        data.devices.length === 0
          ? '<span class="section-empty">No devices available</span>'
          : data.devices.map((d) => `<label class="modal-checkbox"><input type="checkbox" data-device="${d.id}" ${deviceIds.includes(d.id) ? 'checked' : ''}/> ${d.name}</label>`).join('')
    }

    function openEdit() {
      const asset = getAsset()
      if (!asset) return
      document.getElementById('asset-name').value = asset.name
      document.getElementById('asset-location').value = asset.location || ''
      document.getElementById('asset-groups-search').value = ''
      document.getElementById('asset-devices-search').value = ''
      populateForm(asset.groupNames || [], asset.profileName, asset.deviceIds || [])
      UI.openModal('asset-modal')
    }

    document.getElementById('asset-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const asset = getAsset()
      if (!asset) return
      const name = document.getElementById('asset-name').value.trim()
      if (!name) return
      const groupNames = Array.from(document.querySelectorAll('#asset-groups-list input:checked')).map((el) => el.getAttribute('data-group'))
      const profileName = document.getElementById('asset-profile').value
      const location = document.getElementById('asset-location').value.trim()
      const deviceIds = Array.from(document.querySelectorAll('#asset-devices-list input:checked')).map((el) => el.getAttribute('data-device'))
      Store.updateAsset(asset.id, { name, groupNames, profileName, location, deviceIds })
      UI.toast(`"${name}" updated successfully!`)
      UI.closeModal('asset-modal')
      renderPage()
    })

    function confirmDelete() {
      const asset = getAsset()
      if (!asset) return
      UI.confirm({
        message: `Delete <strong>${asset.name}</strong>? This can't be undone.`,
        onConfirm: () => {
          Store.removeAsset(asset.id)
          UI.toast(`"${asset.name}" deleted successfully!`)
          window.location.href = 'assets.html'
        },
      })
    }

    /* -------------------------------------------------------------- page */
    function renderPage() {
      const asset = getAsset()
      const root = document.getElementById('asset-detail-root')
      if (!asset) {
        root.innerHTML = `
          <div class="asset-detail-page">
            <p class="device-not-found">This asset no longer exists.</p>
            <a href="assets.html" class="text-link">Back to Assets</a>
          </div>`
        return
      }

      resetTelemetryState(asset)
      md = { search: '', searchOpen: false, editingIndex: null, editingValue: '' }

      root.innerHTML = `
        <div class="device-detail-page">
          <div class="device-detail-header">
            <div>
              <h1 class="device-detail-title">${escapeHtml(asset.name)} <span class="device-detail-id">(ID: ${asset.id})</span></h1>
              <p class="device-detail-subtitle">${escapeHtml(asset.location || 'No location provided')}</p>
            </div>
            <div class="page-header-actions">
              <span class="status-pill status-${asset.status}">${asset.status}</span>
              <button type="button" class="outline-action-button" id="toggle-status-btn">${asset.status === 'operational' ? 'Mark offline' : 'Mark operational'}</button>
              <button type="button" class="outline-action-button" id="edit-asset-btn">Edit</button>
              <button type="button" class="outline-action-button" id="delete-asset-btn" style="color:var(--danger); border-color:var(--danger-bg);">Delete</button>
            </div>
          </div>

          <div class="device-detail-body">
            <div class="device-panel" id="metadata-panel">${renderMetadataPanel()}</div>
            <div class="device-panel telemetry-card" id="telemetry-panel">${telemetryPanelHtml()}</div>
          </div>
        </div>`

      document.getElementById('toggle-status-btn').addEventListener('click', () => {
        Store.toggleAssetStatus(asset.id)
        UI.toast(`"${asset.name}" status updated successfully!`)
        renderPage()
      })
      document.getElementById('edit-asset-btn').addEventListener('click', openEdit)
      document.getElementById('delete-asset-btn').addEventListener('click', confirmDelete)

      wireMetadataPanelEvents()
      wireTelemetryPanelEvents()
    }

    renderPage()
  </script>
</body>
</html>
