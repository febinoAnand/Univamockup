<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/auth.css" />
  <style>
    /* Ported from shared/signup.css — auth.css doesn't carry the
       show/hide password suffix-button styling on its own. */
    .input-wrap.with-suffix input {
      padding-right: 2.5rem;
    }
    .suffix-button {
      position: absolute;
      right: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      color: #a8a29e;
      cursor: pointer;
    }
    .suffix-button:hover {
      color: #78716c;
    }
  </style>
  <title>Approval preview login — Univa</title>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <img src="assets/favicon.png" alt="Univa" class="auth-logo" />

      <p class="demo-users-note">
        Demo login — Org <strong>PENDINGDEMO</strong>, user <strong>reviewer</strong> / <strong>Preview123</strong>
      </p>

      <h1 class="login-title">Approval Preview Login</h1>
      <p class="login-subtitle">This page always leads to the Awaiting Approval screen — use it to preview that experience without editing any data.</p>

      <form id="preview-login-form" novalidate>
        <div class="field">
          <label for="pv-org">Organisation ID</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1" stroke-linecap="round"/><path d="M10 21v-3h4v3"/></svg>
            </span>
            <input id="pv-org" type="text" placeholder="e.g. PENDINGDEMO" />
          </div>
        </div>

        <div class="field">
          <label for="pv-username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.8 4.4-6 7.5-6s6.1 2.2 7.5 6" stroke-linecap="round"/></svg>
            </span>
            <input id="pv-username" type="text" placeholder="e.g. reviewer" />
          </div>
        </div>

        <div class="field">
          <label for="pv-password">Password</label>
          <div class="input-wrap with-suffix">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input id="pv-password" type="password" placeholder="Enter your password" />
            <button type="button" class="suffix-button" id="pv-password-toggle">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8"/></svg>
            </button>
          </div>
        </div>

        <p class="form-error hidden" id="pv-error">Invalid organisation ID, username, or password</p>

        <button type="submit" class="login-button">Sign In</button>
      </form>

      <div class="divider"></div>

      <p class="signup-row">Not what you're after? <a href="login.html" class="link">Back to the real login</a></p>
    </div>
  </div>

  <script src="shared/ui.js"></script>
  <script>
    const PREVIEW_ORG_ID = 'PENDINGDEMO'
    const PREVIEW_USERNAME = 'reviewer'
    const PREVIEW_PASSWORD = 'Preview123'

    UI.wireShowHideToggle('pv-password', 'pv-password-toggle')

    document.getElementById('preview-login-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const org = document.getElementById('pv-org').value.trim()
      const username = document.getElementById('pv-username').value.trim()
      const password = document.getElementById('pv-password').value
      const errorEl = document.getElementById('pv-error')

      const matches =
        org.toUpperCase() === PREVIEW_ORG_ID &&
        username.toLowerCase() === PREVIEW_USERNAME.toLowerCase() &&
        password === PREVIEW_PASSWORD

      if (!matches) {
        errorEl.classList.remove('hidden')
        return
      }

      errorEl.classList.add('hidden')
      window.location.href = 'awaiting-approval.html'
    })
  </script>
</body>
</html>
