<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/auth.css" />
  <link rel="stylesheet" href="shared/sysadmin-login.css" />
  <title>System administrator — Univa</title>
</head>
<body>
  <div class="auth-shell">
    <main class="auth-main sysadmin-main">
    <div class="login-card sysadmin-login-card">
      <img src="assets/favicon.png" alt="Univa" class="auth-logo" />
      <span class="sysadmin-badge">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z" stroke-linecap="round" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        System Administrator
      </span>

      <h1 class="login-title">Control Center</h1>
      <p class="login-subtitle">Sign in with your system administrator credentials</p>

      <form id="sysadmin-form" novalidate>
        <div class="field">
          <label for="sysadmin-username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.8 4.4-6 7.5-6s6.1 2.2 7.5 6" stroke-linecap="round"/></svg>
            </span>
            <input id="sysadmin-username" type="text" placeholder="root" autocomplete="username" required />
          </div>
        </div>

        <div class="field">
          <label for="sysadmin-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input id="sysadmin-password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
          </div>
        </div>

        <button type="submit" class="login-button sysadmin-login-button" id="sysadmin-submit" disabled>Sign in as administrator</button>
      </form>

      <div class="divider"></div>
      <p class="signup-row">Not an administrator? <a href="login.html" class="link">Back to sign in</a></p>
      <p class="login-footer">© 2026 All rights reserved.</p>
    </div>
    </main>
  </div>

  <script src="shared/ui.js"></script>
  <script>
    const usernameInput = document.getElementById('sysadmin-username')
    const passwordInput = document.getElementById('sysadmin-password')
    const submitButton = document.getElementById('sysadmin-submit')

    function updateSubmitState() {
      submitButton.disabled = !usernameInput.value.trim() || !passwordInput.value.trim()
    }
    usernameInput.addEventListener('input', updateSubmitState)
    passwordInput.addEventListener('input', updateSubmitState)

    document.getElementById('sysadmin-form').addEventListener('submit', function (event) {
      event.preventDefault()
      UI.runWithLoading(submitButton, () => {
        window.location.href = 'admin-dashboard.html'
      })
    })
  </script>
</body>
</html>
