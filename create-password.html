<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/auth.css" />
  <link rel="stylesheet" href="shared/create-password.css" />
  <title>Create password — Univa</title>
</head>
<body>
  <div class="login-page">
    <div class="login-card create-password-card hidden" id="success-view">
      <img src="assets/favicon.png" alt="Univa" class="auth-logo" />
      <div class="password-success-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 class="password-success-heading">Password Created Successfully!</h2>
      <p class="password-success-description">Your password has been created successfully. You can now sign in with your organization ID and password.</p>
      <button type="button" class="login-button" onclick="window.location.href='login.html'">Sign In</button>
    </div>

    <div class="login-card create-password-card" id="form-view">
      <img src="assets/favicon.png" alt="Univa" class="auth-logo" />

      <div class="org-verified-banner hidden" id="verified-banner">
        <span class="org-verified-icon">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="org-verified-text">
          <span class="org-verified-name" id="verified-org-name"></span>
          <span class="org-verified-note">Organization verified successfully</span>
        </span>
      </div>

      <form id="verify-form" novalidate>
        <div class="field">
          <label for="organizationId">Organization ID <span class="required">*</span></label>
          <div class="org-verify-wrap">
            <span class="org-verify-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1" stroke-linecap="round"/><path d="M10 21v-3h4v3"/></svg>
            </span>
            <input id="organizationId" type="text" placeholder="Enter your organization ID" required />
            <button type="submit" class="verify-button" id="verify-btn" disabled>Verify</button>
          </div>
        </div>
      </form>

      <form id="password-form" class="hidden" novalidate>
        <div class="field">
          <label for="organizationIdVerified">Organization ID <span class="required">*</span></label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M9 16h1M14 16h1" stroke-linecap="round"/><path d="M10 21v-3h4v3"/></svg>
            </span>
            <input id="org-id-display" type="text" disabled />
          </div>
        </div>

        <div class="password-grid">
          <div class="field">
            <label for="newPassword">New Password <span class="required">*</span></label>
            <div class="input-wrap with-suffix">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              </span>
              <input id="newPassword" type="password" placeholder="Enter new password" required />
              <button type="button" class="suffix-button" id="toggle-new">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
            <div class="input-wrap with-suffix">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              </span>
              <input id="confirmPassword" type="password" placeholder="Confirm new password" required />
              <button type="button" class="suffix-button" id="toggle-confirm">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.8"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="requirements-box">
          <p class="requirements-title">Password Requirements:</p>
          <ul class="requirements-list" id="requirements-list"></ul>
        </div>

        <button type="submit" class="login-button" id="create-password-btn" disabled>Create Password</button>
      </form>

      <p class="signup-row">Remember your password? <a href="login.html" class="link">Sign in</a></p>
      <p class="login-footer">© 2026 All rights reserved.</p>
    </div>
  </div>

  <script src="shared/ui.js"></script>
  <script>
    const DEMO_ORGANIZATIONS = { ORGWVLYIY: 'Innospace' }

    const orgInput = document.getElementById('organizationId')
    const verifyBtn = document.getElementById('verify-btn')
    orgInput.addEventListener('input', () => { verifyBtn.disabled = !orgInput.value.trim() })

    document.getElementById('verify-form').addEventListener('submit', function (event) {
      event.preventDefault()
      const organizationId = orgInput.value.trim()
      if (!organizationId) return
      const orgName = DEMO_ORGANIZATIONS[organizationId.toUpperCase()] || 'Your Organization'
      document.getElementById('verified-org-name').textContent = orgName
      document.getElementById('verified-banner').classList.remove('hidden')
      document.getElementById('verify-form').classList.add('hidden')
      document.getElementById('password-form').classList.remove('hidden')
      document.getElementById('org-id-display').value = organizationId
    })

    UI.wireShowHideToggle('newPassword', 'toggle-new')
    UI.wireShowHideToggle('confirmPassword', 'toggle-confirm')

    const newPasswordInput = document.getElementById('newPassword')
    const confirmPasswordInput = document.getElementById('confirmPassword')
    const createBtn = document.getElementById('create-password-btn')

    function refreshRequirements() {
      const pw = newPasswordInput.value
      document.getElementById('requirements-list').innerHTML = UI.passwordRequirementsHtml(pw)
      const allMet = UI.allPasswordRequirementsMet(pw)
      const match = confirmPasswordInput.value.length > 0 && pw === confirmPasswordInput.value
      createBtn.disabled = !(allMet && match)
    }
    newPasswordInput.addEventListener('input', refreshRequirements)
    confirmPasswordInput.addEventListener('input', refreshRequirements)
    refreshRequirements()

    document.getElementById('password-form').addEventListener('submit', function (event) {
      event.preventDefault()
      document.getElementById('form-view').classList.add('hidden')
      document.getElementById('success-view').classList.remove('hidden')
    })
  </script>
</body>
</html>
