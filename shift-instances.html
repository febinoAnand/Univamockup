<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/app.css" />
  <title>Shift instance — Univa</title>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="app-main">
      <div class="app-content" id="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Shift instance</h1>
            <p class="page-subtitle">Generated occurrences of scheduled shifts on specific dates</p>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem;">
          <div class="table-search-wrap" style="margin-bottom:0;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
            <input type="text" id="search" placeholder="Search by shift name" />
          </div>
          <div id="view-toggle-slot"></div>
        </div>

        <div class="table-scroll" id="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Shift</th>
                <th>Schedule</th>
                <th>Date</th>
                <th>Day</th>
                <th>Time window</th>
                <th>Status</th>
                <th class="data-table-menu-col"></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/ui.js"></script>
  <script>
    const filterScheduleId = window.location.hash.slice(1)
    const filterSchedule = filterScheduleId ? Store.get().shiftSchedules.find((s) => s.id === filterScheduleId) : null

    const breadcrumbs = [
      { label: 'Home', href: 'dashboard.html' },
      { label: 'Shift management', href: 'shift-management.html' },
      filterSchedule ? { label: 'Shift instance', href: 'shift-instances.html' } : { label: 'Shift instance' },
    ]
    if (filterSchedule) breadcrumbs.push({ label: filterSchedule.name })

    Layout.mount({ active: 'shift-instances', breadcrumbs })

    if (filterSchedule) {
      document.querySelector('.page-subtitle').innerHTML =
        `Showing instances generated by <strong>${filterSchedule.name}</strong> — <a class="link" href="shift-instances.html">Show all</a>`
    }

    function formatTime(t) {
      if (!t) return '—'
      const [hStr, mStr] = t.split(':')
      let h = parseInt(hStr, 10)
      const period = h >= 12 ? 'PM' : 'AM'
      h = h % 12
      if (h === 0) h = 12
      return `${h}:${mStr} ${period}`
    }

    // A day can have more than one shift (up to all three) — sort by date
    // then start time so same-day instances always render adjacently, in
    // chronological order, regardless of seed/insertion order.
    function compareInstances(a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1
      return a.startTime < b.startTime ? -1 : a.startTime > b.startTime ? 1 : 0
    }

    function render() {
      const data = Store.get()
      const term = document.getElementById('search').value.trim().toLowerCase()
      let rows = filterSchedule ? data.shiftInstances.filter((i) => i.scheduleName === filterSchedule.name) : data.shiftInstances
      if (term) rows = rows.filter((i) => i.shiftName.toLowerCase().includes(term))
      rows = [...rows].sort(compareInstances)

      const tbody = document.getElementById('tbody')
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-table-note">No shift instances ${filterSchedule ? 'for this schedule' : 'match your search'}.</td></tr>`
        return
      }
      tbody.innerHTML = rows
        .map(
          (i) => `
        <tr>
          <td class="card-title-cell">${i.shiftName}</td>
          <td data-label="Schedule">${i.scheduleName}</td>
          <td data-label="Date">${i.date}</td>
          <td data-label="Day">${i.day}</td>
          <td data-label="Time window">${formatTime(i.startTime)} – ${formatTime(i.endTime)}</td>
          <td data-label="Status"><span class="status-pill status-${i.status}">${i.status}</span></td>
          <td class="data-table-menu-col">
            <div class="row-menu">
              <button type="button" class="row-menu-button" data-menu-toggle>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
              </button>
              <div class="row-menu-dropdown">
                <button type="button" class="row-menu-item danger" data-delete="${i.id}">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke-linecap="round"/></svg>
                  Delete
                </button>
              </div>
            </div>
          </td>
        </tr>`,
        )
        .join('')

      document.querySelectorAll('[data-delete]').forEach((btn) => btn.addEventListener('click', () => confirmDelete(btn.getAttribute('data-delete'))))
      document.querySelectorAll('[data-menu-toggle]').forEach((btn) =>
        btn.addEventListener('click', (event) => {
          event.stopPropagation()
          const menu = btn.closest('.row-menu')
          const wasOpen = menu.classList.contains('open')
          UI.closeRowMenus()
          if (!wasOpen) UI.openRowMenu(btn)
        }),
      )
    }
    document.addEventListener('click', () => UI.closeRowMenus())

    function confirmDelete(id) {
      const i = Store.get().shiftInstances.find((x) => x.id === id)
      if (!i) return
      UI.confirm({
        message: `Delete the <strong>${i.shiftName}</strong> instance on ${i.date}? This can't be undone.`,
        onConfirm: () => {
          Store.removeShiftInstance(id)
          render()
          UI.toast('Shift instance deleted successfully!')
        },
      })
    }

    document.getElementById('view-toggle-slot').innerHTML = UI.viewToggleHtml('shift-instances')
    UI.wireViewToggle('shift-instances', document.getElementById('table-scroll'))

    document.getElementById('search').addEventListener('input', render)
    render()
  </script>
</body>
</html>
